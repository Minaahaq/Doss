<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مخزني Pro — الاحترافي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1219; --surface: #151c28; --surface2: #1a2332;
      --line: #25324a; --lineSoft: #1e2939; --ink: #e9eef6; --muted: #8ba0bb;
      --primary: #2fd6a3; --primarySoft: rgba(47,214,163,.14);
      --amber: #ffb224; --coral: #ff6b5e; --blue: #5aa2ff; --violet: #b48cff;
      --radius: 14px; --shadow: 0 10px 26px rgba(0,0,0,.5);
      --font: 'Almarai', sans-serif; --fontDisplay: 'Changa', sans-serif;
    }
    [data-theme="light"] {
      --bg: #f4f7fc; --surface: #ffffff; --surface2: #f0f3f8;
      --line: #d0d8e8; --lineSoft: #e2e8f0; --ink: #1a2636; --muted: #5a6f88;
      --shadow: 0 10px 26px rgba(0,0,0,.08);
    }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); transition: .3s; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--surface); border-inline-end: 1px solid var(--lineSoft); padding: 1rem 0; position: sticky; top:0; height:100vh; overflow-y:auto; }
    .brand { padding: 0 1.2rem 1.5rem; display:flex; align-items:center; gap:.8rem; }
    .brand-mark { width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#59f0c0,var(--primary));display:grid;place-items:center;color:#04281e;font-weight:800;font-size:1.2rem; }
    .nav { display:flex;flex-direction:column;gap:.3rem;padding:0 .6rem; }
    .nav-item { display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer;width:100%;text-align:start;transition:.2s; }
    .nav-item:hover, .nav-item.active { background:var(--primarySoft);color:var(--primary); }
    .nav-item svg { width:18px;height:18px; }
    .content { flex:1; min-width:0; }
    .topbar { position:sticky;top:0;z-index:10;padding:.7rem 1.5rem;background:rgba(13,18,25,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between;align-items:center; }
    main { padding:1.2rem 1.5rem 3rem; }
    .page { display:none; animation:fadeIn .3s ease; }
    .page.active { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
    .stats-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem; }
    .stat { background:var(--surface);border:1px solid var(--lineSoft);border-radius:var(--radius);padding:1rem;border-inline-start:4px solid var(--statColor);display:flex;gap:.8rem;align-items:center; }
    .stat-icon { width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--statSoft);color:var(--statColor); }
    .stat-label { font-size:.7rem;color:var(--muted);font-weight:700;display:block; }
    .stat-value { font-family:var(--fontDisplay);font-size:1.4rem;font-weight:800; }
    .panel { background:var(--surface);border:1px solid var(--lineSoft);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden; }
    .panel-head { padding:.8rem 1rem;border-bottom:1px solid var(--lineSoft);display:flex;align-items:center;gap:.6rem; }
    .panel-head h3 { font-family:var(--fontDisplay);font-size:.95rem;flex:1; }
    .btn { display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;border:none;font-weight:700;font-size:.8rem;cursor:pointer;transition:.2s; }
    .btn-primary { background:var(--primary);color:#04281e;box-shadow:0 4px 14px rgba(47,214,163,.3); }
    .btn-danger { background:var(--coral);color:#2b0705; }
    .btn-line { background:transparent;border:1px solid var(--line);color:var(--ink); }
    .input, .select { width:100%;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit; }
    .input:focus { border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primarySoft); }
    .modal-wrap { position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s; }
    .modal-wrap.open { opacity:1;pointer-events:auto; }
    .modal { background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow:auto;padding:0;transform:scale(.97);transition:.3s; }
    .modal-wrap.open .modal { transform:scale(1); }
    .modal-head { padding:1rem;border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between; }
    .modal-body { padding:1.2rem; }
    .modal-foot { padding:1rem;border-top:1px solid var(--lineSoft);display:flex;justify-content:flex-end;gap:.5rem; }
    .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:.8rem; }
    .span-2 { grid-column:1/-1; }
    .toasts { position:fixed;bottom:1rem;left:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:350px; }
    .toast { padding:.7rem 1rem;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--primary);border-radius:8px;font-weight:700;animation:slideUp .3s ease; }
    .toast.error { border-inline-start-color:var(--coral); }
    .tbl { width:100%;border-collapse:collapse;font-size:.85rem; }
    .tbl th { text-align:start;padding:.6rem .8rem;background:var(--surface2);color:var(--muted);font-size:.75rem;border-bottom:2px solid var(--line); }
    .tbl td { padding:.5rem .8rem;border-bottom:1px solid var(--lineSoft); }
    .tbl tr:hover { background:var(--primarySoft); }
    .pill { display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700; }
    .pill.success { background:var(--primarySoft);color:var(--primary); }
    .pill.warning { background:rgba(255,178,36,.14);color:var(--amber); }
    .pill.danger { background:rgba(255,107,94,.14);color:var(--coral); }
    .flex { display:flex;gap:.5rem;align-items:center;flex-wrap:wrap; }
    .flex-spacer { flex:1; }
    .mt-1 { margin-top:.8rem; }
    .mb-1 { margin-bottom:.8rem; }
    .text-muted { color:var(--muted); }
    @media(max-width:768px){ .sidebar{display:none;} .form-grid{grid-template-columns:1fr;} .topbar{padding:.5rem 1rem;} main{padding:.5rem 1rem 5rem;} }
  </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
  <div style="background:var(--surface);padding:2.5rem;border-radius:var(--radius);border:1px solid var(--line);width:350px;text-align:center;">
    <h2 style="color:var(--primary);font-family:var(--fontDisplay);">📦 مخزني Pro</h2>
    <p style="color:var(--muted);margin:.5rem 0 1.5rem;">نظام إدارة متكامل (احترافي)</p>
    <input class="input" id="loginUsername" type="text" placeholder="اسم المستخدم" style="text-align:center;margin-bottom:.5rem;" value="admin">
    <input class="input" id="loginPass" type="password" placeholder="كلمة المرور" style="text-align:center;" value="admin123">
    <button class="btn btn-primary" style="width:100%;margin-top:.8rem;" id="loginBtn">دخول</button>
    <div style="margin-top:1rem;font-size:.7rem;color:var(--muted);">(يمكن تغيير بيانات الدخول من الإعدادات)</div>
  </div>
</div>

<!-- التطبيق -->
<div class="app" style="display:none;" id="appRoot">

  <!-- سايدبار -->
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">📦</div><div><h3 style="font-family:var(--fontDisplay);">مخزني</h3><small style="color:var(--muted);font-size:.7rem;">Pro v3.0</small></div></div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-page="dashboard">📊 لوحة التحكم</button>
      <button class="nav-item" data-page="products">📦 المنتجات</button>
      <button class="nav-item" data-page="suppliers">🏢 الموردين</button>
      <button class="nav-item" data-page="purchases">📥 طلبات الشراء</button>
      <button class="nav-item" data-page="pos">🛒 نقطة البيع</button>
      <button class="nav-item" data-page="customers">👤 العملاء</button>
      <button class="nav-item" data-page="reports">📈 التقارير</button>
      <button class="nav-item" data-page="ai">🧠 الذكاء الاصطناعي</button>
      <button class="nav-item" data-page="settings">⚙️ الإعدادات</button>
    </nav>
    <div style="padding:1rem;border-top:1px solid var(--lineSoft);margin-top:auto;display:flex;justify-content:space-between;align-items:center;">
      <span id="userRole" style="font-size:.7rem;color:var(--muted);">مدير</span>
      <button class="btn btn-line btn-sm" id="logoutBtn">🚪 خروج</button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div><h2 id="pageTitle" style="font-family:var(--fontDisplay);font-size:1.2rem;">لوحة التحكم</h2><span id="dateTime" style="font-size:.7rem;color:var(--muted);"></span></div>
      <div class="flex">
        <button class="btn btn-line btn-sm" id="themeToggle">🌙</button>
        <button class="btn btn-primary btn-sm" id="quickAddBtn">➕ إضافة منتج</button>
      </div>
    </header>
    <main id="mainContent"></main>
  </div>
</div>

<!-- مودال عام -->
<div class="modal-wrap" id="genericModal"><div class="modal"><div class="modal-head"><h3 id="gModalTitle">عنوان</h3><button class="btn btn-line btn-sm" data-close>✕</button></div><div class="modal-body" id="gModalBody"></div><div class="modal-foot"><button class="btn btn-line" data-close>إلغاء</button><button class="btn btn-primary" id="gModalAction">حفظ</button></div></div></div>

<div class="toasts" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    // ============================================================
    // 1. التخزين
    // ============================================================
    var Storage = {
      get: function(key, fallback) {
        if (fallback === undefined) fallback = null;
        try {
          var raw = localStorage.getItem(key);
          return raw !== null ? JSON.parse(raw) : fallback;
        } catch (e) {
          return fallback;
        }
      },
      set: function(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
    };

    // ============================================================
    // 2. الخدمات (Services)
    // ============================================================
    var Services = {};

    // ---- الإعدادات ----
    Services.Settings = {
      getDefaults: function() {
        return {
          shopName: 'مخزني Pro',
          currency: 'ج.م',
          taxRate: 14,
          defaultMinStock: 5,
          theme: 'dark',
          logo: '📦'
        };
      },
      get: function() {
        var saved = Storage.get('wm_settings', null);
        return saved ? this._merge(this.getDefaults(), saved) : this.getDefaults();
      },
      _merge: function(a, b) {
        var result = {};
        for (var key in a) result[key] = a[key];
        for (var key in b) result[key] = b[key];
        return result;
      },
      update: function(data) {
        var current = this.get();
        var updated = this._merge(current, data);
        Storage.set('wm_settings', updated);
        return updated;
      }
    };

    // ---- المصادقة ----
    Services.Auth = {
      getDefaults: function() {
        return { username: 'admin', password: btoa('admin123') };
      },
      getCredentials: function() {
        var creds = Storage.get('wm_credentials', null);
        if (!creds) {
          creds = this.getDefaults();
          Storage.set('wm_credentials', creds);
        }
        return creds;
      },
      login: function(username, password) {
        var creds = this.getCredentials();
        return username === creds.username && btoa(password) === creds.password;
      },
      updateCredentials: function(username, password) {
        var newCreds = { username: username.trim(), password: btoa(password.trim()) };
        Storage.set('wm_credentials', newCreds);
        return newCreds;
      }
    };

    // ---- المنتجات ----
    Services.Product = {
      getAll: function() { return Storage.get('wm_products', []); },
      getById: function(id) {
        var list = this.getAll();
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === id) return list[i];
        }
        return null;
      },
      create: function(data) {
        var list = this.getAll();
        var newP = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          createdAt: Date.now()
        };
        for (var key in data) newP[key] = data[key];
        list.push(newP);
        Storage.set('wm_products', list);
        return newP;
      },
      update: function(id, data) {
        var list = this.getAll();
        var idx = -1;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === id) { idx = i; break; }
        }
        if (idx === -1) return null;
        for (var key in data) list[idx][key] = data[key];
        Storage.set('wm_products', list);
        return list[idx];
      },
      delete: function(id) {
        var list = this.getAll();
        var newList = [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id !== id) newList.push(list[i]);
        }
        Storage.set('wm_products', newList);
      },
      getStatus: function(p) {
        if (p.quantity <= 0) return 'out';
        if (p.quantity <= (p.minStock || 5)) return 'low';
        return 'ok';
      }
    };

    // ---- الموردين ----
    Services.Supplier = {
      getAll: function() { return Storage.get('wm_suppliers', []); },
      getById: function(id) {
        var list = this.getAll();
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === id) return list[i];
        }
        return null;
      },
      create: function(name, contact, phone) {
        if (contact === undefined) contact = '';
        if (phone === undefined) phone = '';
        var list = this.getAll();
        var newS = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          name: name.trim(),
          contact: contact.trim(),
          phone: phone.trim(),
          createdAt: Date.now()
        };
        list.push(newS);
        Storage.set('wm_suppliers', list);
        return newS;
      },
      delete: function(id) {
        var list = this.getAll();
        var newList = [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id !== id) newList.push(list[i]);
        }
        Storage.set('wm_suppliers', newList);
      }
    };

    // ---- طلبات الشراء ----
    Services.Purchase = {
      getAll: function() { return Storage.get('wm_purchases', []); },
      create: function(data) {
        var list = this.getAll();
        var newPO = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          status: 'pending',
          createdAt: Date.now()
        };
        for (var key in data) newPO[key] = data[key];
        list.push(newPO);
        Storage.set('wm_purchases', list);
        return newPO;
      },
      receive: function(poId) {
        var list = this.getAll();
        var po = null;
        var poIdx = -1;
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === poId) { po = list[i]; poIdx = i; break; }
        }
        if (!po || po.status === 'received') return null;
        po.status = 'received';
        po.receivedAt = Date.now();

        var products = Services.Product.getAll();
        var ops = Storage.get('wm_operations', []);
        for (var j = 0; j < po.items.length; j++) {
          var item = po.items[j];
          var prod = null;
          for (var k = 0; k < products.length; k++) {
            if (products[k].id === item.productId) { prod = products[k]; break; }
          }
          if (prod) {
            prod.quantity = (prod.quantity || 0) + item.qty;
            ops.push({
              id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
              productId: prod.id,
              productName: prod.name,
              type: 'in',
              qty: item.qty,
              note: 'استلام طلب شراء #' + po.id.slice(0, 8),
              createdAt: Date.now()
            });
          }
        }
        Storage.set('wm_products', products);
        Storage.set('wm_operations', ops);
        Storage.set('wm_purchases', list);
        return po;
      },
      delete: function(id) {
        var list = this.getAll();
        var newList = [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id !== id) newList.push(list[i]);
        }
        Storage.set('wm_purchases', newList);
      }
    };

    // ---- العملاء ----
    Services.Customer = {
      getAll: function() { return Storage.get('wm_customers', []); },
      create: function(name, phone) {
        if (phone === undefined) phone = '';
        var list = this.getAll();
        var c = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          name: name.trim(),
          phone: phone.trim(),
          createdAt: Date.now()
        };
        list.push(c);
        Storage.set('wm_customers', list);
        return c;
      },
      delete: function(id) {
        var list = this.getAll();
        var newList = [];
        for (var i = 0; i < list.length; i++) {
          if (list[i].id !== id) newList.push(list[i]);
        }
        Storage.set('wm_customers', newList);
      }
    };

    // ---- المبيعات ----
    Services.Sales = {
      getAll: function() { return Storage.get('wm_sales', []); },
      create: function(data) {
        var list = this.getAll();
        var number = 'INV-' + Date.now().toString(36).toUpperCase();
        var sale = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
          number: number,
          customerId: data.customerId || '',
          items: data.items || [],
          total: data.total || 0,
          discount: data.discount || 0,
          tax: data.tax || 0,
          paymentMethod: data.paymentMethod || 'cash',
          note: (data.note || '').trim(),
          createdAt: Date.now()
        };
        list.push(sale);
        Storage.set('wm_sales', list);
        return sale;
      }
    };

    // ---- التقارير ----
    Services.Report = {
      getDashboardStats: function() {
        var products = Services.Product.getAll();
        var sales = Services.Sales.getAll();
        var suppliers = Services.Supplier.getAll();
        var totalStockValue = 0;
        for (var i = 0; i < products.length; i++) {
          var p = products[i];
          totalStockValue += (p.purchasePrice || 0) * (p.quantity || 0);
        }
        var totalSales = 0;
        for (var j = 0; j < sales.length; j++) totalSales += sales[j].total;
        var lowStock = 0;
        for (var k = 0; k < products.length; k++) {
          if (Services.Product.getStatus(products[k]) !== 'ok') lowStock++;
        }
        return {
          products: products.length,
          suppliers: suppliers.length,
          totalStockValue: totalStockValue,
          totalSales: totalSales,
          lowStock: lowStock
        };
      },
      getPaymentMethodDistribution: function() {
        var sales = Services.Sales.getAll();
        var map = {};
        for (var i = 0; i < sales.length; i++) {
          var method = sales[i].paymentMethod || 'cash';
          map[method] = (map[method] || 0) + sales[i].total;
        }
        var result = [];
        for (var key in map) {
          result.push({ label: key, value: map[key] });
        }
        return result;
      },
      getBestSuppliers: function() {
        var purchases = Services.Purchase.getAll();
        var received = [];
        for (var i = 0; i < purchases.length; i++) {
          if (purchases[i].status === 'received') received.push(purchases[i]);
        }
        var map = {};
        for (var j = 0; j < received.length; j++) {
          var p = received[j];
          var supplier = Services.Supplier.getById(p.supplierId);
          var name = supplier ? supplier.name : 'غير معروف';
          map[name] = (map[name] || 0) + (p.totalCost || 0);
        }
        var result = [];
        for (var key in map) {
          result.push({ name: key, spent: map[key] });
        }
        result.sort(function(a, b) { return b.spent - a.spent; });
        return result;
      }
    };

    // ---- الذكاء الاصطناعي ----
    Services.AI = {
      analyze: function() {
        var products = Services.Product.getAll();
        var ops = Storage.get('wm_operations', []);
        var sales = Services.Sales.getAll();
        var low = [];
        for (var i = 0; i < products.length; i++) {
          if (Services.Product.getStatus(products[i]) !== 'ok') low.push(products[i]);
        }
        var totalOut = 0;
        for (var j = 0; j < ops.length; j++) {
          if (ops[j].type === 'out') totalOut += ops[j].qty;
        }
        var avgDailySale = totalOut / Math.max(1, 30);
        var restock = [];
        for (var k = 0; k < low.length; k++) {
          var p = low[k];
          var daysToEmpty = avgDailySale > 0 ? Math.floor(p.quantity / avgDailySale) : 99;
          restock.push({
            product: p,
            urgency: daysToEmpty < 3 ? 'عاجل' : 'متوسط',
            daysToEmpty: daysToEmpty
          });
        }
        var totalRevenue = 0;
        for (var l = 0; l < sales.length; l++) totalRevenue += sales[l].total;
        var totalProfit = 0;
        for (var m = 0; m < sales.length; m++) {
          var cost = 0;
          var items = sales[m].items || [];
          for (var n = 0; n < items.length; n++) {
            cost += (items[n].cost || 0) * items[n].qty;
          }
          totalProfit += (sales[m].total - cost);
        }
        return { restock: restock, totalRevenue: totalRevenue, totalProfit: totalProfit, totalSales: sales.length };
      }
    };

    // ============================================================
    // 3. واجهة المستخدم (UI)
    // ============================================================
    var UI = {
      showToast: function(msg, type) {
        if (type === undefined) type = 'success';
        var container = document.getElementById('toastContainer');
        var el = document.createElement('div');
        el.className = 'toast ' + type;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(function() {
          el.style.opacity = '0';
          setTimeout(function() { el.remove(); }, 300);
        }, 3500);
      },
      openModal: function(title, bodyHTML, actionLabel, onAction) {
        if (actionLabel === undefined) actionLabel = 'حفظ';
        document.getElementById('gModalTitle').textContent = title;
        document.getElementById('gModalBody').innerHTML = bodyHTML;
        document.getElementById('gModalAction').textContent = actionLabel;
        var actionBtn = document.getElementById('gModalAction');
        actionBtn.onclick = function() {
          if (onAction) onAction();
        };
        document.getElementById('genericModal').classList.add('open');
      },
      closeModal: function() {
        document.getElementById('genericModal').classList.remove('open');
      },
      renderPage: function(pageId, html) {
        var container = document.getElementById('page-' + pageId);
        if (!container) {
          container = document.createElement('section');
          container.id = 'page-' + pageId;
          container.className = 'page';
          document.getElementById('mainContent').appendChild(container);
        }
        container.innerHTML = html;
        container.classList.add('active');
        var allPages = document.querySelectorAll('.page');
        for (var i = 0; i < allPages.length; i++) {
          if (allPages[i].id !== container.id) allPages[i].classList.remove('active');
        }
        var navBtn = document.querySelector('.nav-item[data-page="' + pageId + '"]');
        if (navBtn) document.getElementById('pageTitle').textContent = navBtn.textContent.trim();
        var allNav = document.querySelectorAll('.nav-item');
        for (var j = 0; j < allNav.length; j++) {
          if (allNav[j].dataset.page === pageId) allNav[j].classList.add('active');
          else allNav[j].classList.remove('active');
        }
      }

          if (cartItems[i].id === id) { existing = cartItems[i]; break; }
        }
        if (existing) {
          if (existing.qty >= p.quantity) { UI.showToast('الكمية القصوى', 'warning'); return; }
          existing.qty++;
        } else {
          cartItems.push({ id: p.id, name: p.name, price: p.salePrice, qty: 1 });
        }
        this.render();
      },
      removeFromCart: function(idx) { cartItems.splice(idx, 1); this.render(); },
      clearCart: function() { cartItems = []; this.render(); },
      checkout: function() {
        if (cartItems.length === 0) { UI.showToast('السلة فارغة', 'error'); return; }
        var customerId = document.getElementById('posCustomer').value;
        var paymentMethod = document.getElementById('posPayment').value;
        var discount = parseFloat(document.getElementById('posDiscount').value) || 0;
        var settings = Services.Settings.get();
        var total = 0;
        for (var i = 0; i < cartItems.length; i++) {
          total += cartItems[i].price * cartItems[i].qty;
        }
        var discountAmount = total * (discount / 100);
        total = total - discountAmount;
        var tax = total * (settings.taxRate || 0) / 100;
        var grandTotal = total + tax;
        var items = [];
        for (var j = 0; j < cartItems.length; j++) {
          var item = cartItems[j];
          var p = Services.Product.getById(item.id);
          if (p) {
            p.quantity -= item.qty;
            Services.Product.update(p.id, { quantity: p.quantity });
            var ops = Storage.get('wm_operations', []);
            ops.push({
              id: uid(),
              productId: p.id,
              productName: p.name,
              type: 'out',
              qty: item.qty,
              note: 'بيع POS',
              createdAt: Date.now()
            });
            Storage.set('wm_operations', ops);
          }
          items.push({ id: item.id, name: item.name, qty: item.qty, price: item.price, cost: p ? p.purchasePrice : 0 });
        }
        Services.Sales.create({ customerId: customerId, items: items, total: grandTotal, discount: discountAmount, tax: tax, paymentMethod: paymentMethod, note: '' });
        cartItems = [];
        this.render();
        UI.showToast('✅ تم البيع - ' + grandTotal.toFixed(0) + ' ' + settings.currency);
        Controllers.Dashboard.render();
      }
    };

    // ---- العملاء ----
    Controllers.Customers = {
      render: function() {
        var list = Services.Customer.getAll();
        var rows = '';
        for (var i = 0; i < list.length; i++) {
          var c = list[i];
          rows += '<tr><td>' + c.name + '</td><td>' + (c.phone || '') + '</td>';
          rows += '<td><button class="btn btn-sm btn-danger" onclick="Controllers.Customers.delete(\'' + c.id + '\')">🗑️</button></td></tr>';
        }
        var html = '';
        html += '<div class="flex mb-1"><div class="flex-spacer"></div><button class="btn btn-primary" onclick="Controllers.Customers.showAdd()">➕ إضافة عميل</button></div>';
        html += '<div class="panel"><table class="tbl"><thead><tr><th>الاسم</th><th>الهاتف</th><th>إجراءات</th></tr></thead><tbody>';
        if (rows) html += rows;
        else html += '<tr><td colspan="3" class="text-muted">لا يوجد عملاء</td></tr>';
        html += '</tbody></table></div>';
        UI.renderPage('customers', html);
      },
      showAdd: function() {
        var body = '';
        body += '<div class="form-grid">';
        body += '<div class="span-2"><label>اسم العميل</label><input class="input" id="fCName"></div>';
        body += '<div><label>الهاتف</label><input class="input" id="fCPhone"></div>';
        body += '</div>';
        UI.openModal('إضافة عميل', body, 'حفظ', function() {
          var name = document.getElementById('fCName').value.trim();
          if (!name) { UI.showToast('الاسم مطلوب', 'error'); return; }
          Services.Customer.create(name, document.getElementById('fCPhone').value);
          UI.closeModal();
          Controllers.Customers.render();
          UI.showToast('تمت الإضافة');
        });
      },
      delete: function(id) {
        if (confirm('حذف العميل؟')) {
          Services.Customer.delete(id);
          Controllers.Customers.render();
          UI.showToast('تم الحذف');
        }
      }
    };

    // ---- التقارير ----
    Controllers.Reports = {
      render: function() {
        var stats = Services.Report.getDashboardStats();
        var dist = Services.Report.getPaymentMethodDistribution();
        var bestSuppliers = Services.Report.getBestSuppliers();
        var products = Services.Product.getAll();
        var sorted = products.slice(0);
        sorted.sort(function(a, b) { return (b.salePrice * b.quantity) - (a.salePrice * a.quantity); });
        var topNames = [];
        var limit = Math.min(5, sorted.length);
        for (var i = 0; i < limit; i++) {
          topNames.push(sorted[i].name);
        }
        var html = '';
        html += '<div class="stats-grid">';
        html += '<div class="stat"><div class="stat-icon">💰</div><div><span class="stat-label">إجمالي المبيعات</span><span class="stat-value">' + stats.totalSales.toFixed(0) + '</span></div></div>';
        html += '<div class="stat"><div class="stat-icon">📦</div><div><span class="stat-label">قيمة المخزون</span><span class="stat-value">' + stats.totalStockValue.toFixed(0) + '</span></div></div>';
        html += '<div class="stat"><div class="stat-icon">🏢</div><div><span class="stat-label">عدد الموردين</span><span class="stat-value">' + stats.suppliers + '</span></div></div>';
        html += '</div>';

        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">';
        html += '<div class="panel"><div class="panel-head"><h3>💳 توزيع المدفوعات</h3></div><ul>';
        if (dist.length > 0) {
          for (var j = 0; j < dist.length; j++) {
            html += '<li style="padding:.5rem 1rem;display:flex;justify-content:space-between;"><span>' + dist[j].label + '</span><span>' + dist[j].value.toFixed(0) + '</span></li>';
          }
        } else { html += '<li class="text-muted">لا توجد بيانات</li>'; }
        html += '</ul></div>';

        html += '<div class="panel"><div class="panel-head"><h3>🏆 أفضل الموردين</h3></div><ul>';
        if (bestSuppliers.length > 0) {
          for (var k = 0; k < bestSuppliers.length; k++) {
            html += '<li style="padding:.5rem 1rem;display:flex;justify-content:space-between;"><span>' + bestSuppliers[k].name + '</span><span>' + bestSuppliers[k].spent.toFixed(0) + '</span></li>';
          }
        } else { html += '<li class="text-muted">لا توجد بيانات</li>'; }
        html += '</ul></div></div>';

        html += '<div class="panel"><div class="panel-head"><h3>📋 تحليل ABC (محاكاة)</h3></div><div style="padding:1rem;color:var(--muted);">منتجات الفئة A (الأعلى قيمة): ' + (topNames.join('، ') || 'لا توجد منتجات') + '</div></div>';
        UI.renderPage('reports', html);
      }
    };

    // ---- الذكاء الاصطناعي ----
    Controllers.AI = {
      render: function() {
        var analysis = Services.AI.analyze();
        var html = '';
        html += '<div class="stats-grid">';
        html += '<div class="stat"><div class="stat-icon">🧠</div><div><span class="stat-label">توصيات لإعادة الطلب</span><span class="stat-value">' + analysis.restock.length + '</span></div></div>';
        html += '<div class="stat"><div class="stat-icon">💰</div><div><span class="stat-label">إجمالي الإيرادات</span><span class="stat-value">' + analysis.totalRevenue.toFixed(0) + '</span></div></div>';
        html += '<div class="stat"><div class="stat-icon">📈</div><div><span class="stat-label">صافي الربح</span><span class="stat-value">' + analysis.totalProfit.toFixed(0) + '</span></div></div>';
        html += '</div>';

        html += '<div class="panel"><div class="panel-head"><h3>📋 توصيات ذكية</h3></div><ul>';
        if (analysis.restock.length > 0) {
          for (var i = 0; i < analysis.restock.length; i++) {
            var r = analysis.restock[i];
            var cls = r.urgency === 'عاجل' ? 'danger' : 'warning';
            html += '<li style="padding:.5rem 1rem;border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between;"><span>' + r.product.name + '</span><span class="pill ' + cls + '">' + r.urgency + ' (ينفد خلال ' + r.daysToEmpty + ' يوم)</span></li>';
          }
        } else {
          html += '<li class="text-muted" style="padding:.5rem 1rem;">جميع المنتجات بحالة جيدة ✅</li>';
        }
        html += '</ul></div>';
        UI.renderPage('ai', html);
      }
    };

    // ---- الإعدادات ----
    Controllers.Settings = {
      render: function() {
        var settings = Services.Settings.get();
        var creds = Services.Auth.getCredentials();
        var html = '';
        html += '<div class="panel"><div class="panel-head"><h3>⚙️ إعدادات النظام</h3></div>';
        html += '<div style="padding:1.2rem;">';
        html += '<div class="form-grid">';
        html += '<div><label>اسم المتجر</label><input class="input" id="setShopName" value="' + settings.shopName + '"></div>';
        html += '<div><label>العملة</label><input class="input" id="setCurrency" value="' + settings.currency + '"></div>';
        html += '<div><label>نسبة الضريبة (%)</label><input class="input" id="setTax" type="number" value="' + settings.taxRate + '"></div>';
        html += '<div><label>الحد الأدنى الافتراضي</label><input class="input" id="setMinStock" type="number" value="' + settings.defaultMinStock + '"></div>';
        html += '<div><label>الشعار (رمز)</label><input class="input" id="setLogo" value="' + settings.logo + '"></div>';
        html += '</div>';
        html += '<button class="btn btn-primary mt-1" onclick="Controllers.Settings.saveSettings()">💾 حفظ الإعدادات</button>';
        html += '</div></div>';

        html += '<div class="panel"><div class="panel-head"><h3>🔐 بيانات الدخول</h3></div>';
        html += '<div style="padding:1.2rem;">';
        html += '<div class="form-grid">';
        html += '<div><label>اسم المستخدم الجديد</label><input class="input" id="newUsername" value="' + creds.username + '" placeholder="اسم المستخدم"></div>';
        html += '<div><label>كلمة المرور الجديدة</label><input class="input" id="newPassword" type="text" placeholder="كلمة المرور الجديدة"></div>';
        html += '</div>';
        html += '<button class="btn btn-primary mt-1" onclick="Controllers.Settings.changeCredentials()">🔑 تغيير بيانات الدخول</button>';
        html += '<div style="margin-top:.5rem;font-size:.7rem;color:var(--muted);">(سيتم تسجيل الخروج تلقائياً بعد التغيير)</div>';
        html += '</div></div>';

        html += '<div class="panel"><div class="panel-head"><h3>👤 إدارة المستخدمين</h3></div>';
        html += '<div style="padding:1.2rem;">';
        html += '<div class="flex"><input class="input" id="newUsername2" placeholder="اسم المستخدم" style="max-width:200px;"><input class="input" id="newUserPass2" type="password" placeholder="كلمة المرور" style="max-width:200px;"><button class="btn btn-primary" onclick="Controllers.Settings.addUser()">➕ إضافة</button></div>';
        html += '<ul id="userList" style="margin-top:.5rem;"></ul>';
        html += '</div></div>';
        UI.renderPage('settings', html);
        this.renderUsers();
      },
      saveSettings: function() {
        Services.Settings.update({
          shopName: document.getElementById('setShopName').value,
          currency: document.getElementById('setCurrency').value,
          taxRate: parseFloat(document.getElementById('setTax').value) || 0,
          defaultMinStock: parseInt(document.getElementById('setMinStock').value) || 5,
          logo: document.getElementById('setLogo').value
        });
        UI.showToast('تم حفظ الإعدادات');
        this.render();
      },
      changeCredentials: function() {
        var username = document.getElementById('newUsername').value.trim();
        var password = document.getElementById('newPassword').value.trim();
        if (!username || !password) { UI.showToast('املأ الحقول', 'error'); return; }
        if (password.length < 4) { UI.showToast('كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error'); return; }
        Services.Auth.updateCredentials(username, password);
        UI.showToast('✅ تم تغيير بيانات الدخول، سيتم تسجيل الخروج');
        Storage.set('wm_auth', { loggedIn: false });
        setTimeout(function() { location.reload(); }, 1000);
      },
      renderUsers: function() {
        var users = Storage.get('wm_users', []);
        var list = document.getElementById('userList');
        if (list) {
          var html = '';
          for (var i = 0; i < users.length; i++) {
            html += '<li style="padding:.3rem 0;display:flex;justify-content:space-between;"><span>' + users[i].username + ' (' + (users[i].role || 'كاشير') + ')</span>';
            html += '<button class="btn btn-sm btn-danger" onclick="Controllers.Settings.deleteUser(\'' + users[i].username + '\')">✕</button></li>';
          }
          list.innerHTML = html;
        }
      },
      addUser: function() {
        var username = document.getElementById('newUsername2').value.trim();
        var pass = document.getElementById('newUserPass2').value.trim();
        if (!username || !pass) { UI.showToast('املأ الحقول', 'error'); return; }
        var users = Storage.get('wm_users', []);
        for (var i = 0; i < users.length; i++) {
          if (users[i].username === username) { UI.showToast('المستخدم موجود', 'error'); return; }
        }
        users.push({ username: username, password: btoa(pass), role: 'كاشير' });
        Storage.set('wm_users', users);
        this.renderUsers();
        UI.showToast('تمت الإضافة');
      },
      deleteUser: function(username) {
        var users = Storage.get('wm_users', []);
        var newList = [];
        for (var i = 0; i < users.length; i++) {
          if (users[i].username !== username) newList.push(users[i]);
        }
        Storage.set('wm_users', newList);
        this.renderUsers();
      }
    };

    // ============================================================
    // 5. التهيئة والتشغيل
    // ============================================================
    function initApp() {
      var auth = Storage.get('wm_auth', null);
      if (!auth || !auth.loggedIn) {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appRoot').style.display = 'none';
        return;
      }
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appRoot').style.display = 'flex';

      var settings = Services.Settings.get();
      document.documentElement.setAttribute('data-theme', settings.theme || 'dark');
      document.getElementById('themeToggle').textContent = settings.theme === 'dark' ? '☀️' : '🌙';

      Controllers.Dashboard.render();

      var navBtns = document.querySelectorAll('.nav-item');
      for (var i = 0; i < navBtns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            var page = this.dataset.page;
            var map = {
              dashboard: Controllers.Dashboard,
              products: Controllers.Products,
              suppliers: Controllers.Suppliers,
              purchases: Controllers.Purchases,
              pos: Controllers.POS,
              customers: Controllers.Customers,
              reports: Controllers.Reports,
              ai: Controllers.AI,
              settings: Controllers.Settings
            };
            if (map[page]) map[page].render();
            else UI.showToast('صفحة قيد التطوير', 'warning');
          });
        })(navBtns[i]);
      }

      document.getElementById('quickAddBtn').addEventListener('click', function() {
        Controllers.Products.showAdd();
      });

      document.getElementById('themeToggle').addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        Services.Settings.update({ theme: next });
        this.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      document.getElementById('logoutBtn').addEventListener('click', function() {
        Storage.set('wm_auth', { loggedIn: false });
        location.reload();
      });

      var closeBtns = document.querySelectorAll('[data-close]');
      for (var j = 0; j < closeBtns.length; j++) {
        closeBtns[j].addEventListener('click', UI.closeModal);
      }
      document.getElementById('genericModal').addEventListener('click', function(e) {
        if (e.target === this) UI.closeModal();
      });

      function updateClock() {
        document.getElementById('dateTime').textContent = new Date().toLocaleString('ar');
      }
      updateClock();
      setInterval(updateClock, 1000);

      document.getElementById('loginBtn').addEventListener('click', function() {
        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPass').value.trim();
        if (Services.Auth.login(username, password)) {
          Storage.set('wm_auth', { loggedIn: true });
          location.reload();
        } else {
          UI.showToast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
        }
      });
      document.getElementById('loginPass').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });
      document.getElementById('loginUsername').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });

      // بيانات افتراضية
      if (Storage.get('wm_products', null) === null) {
        Services.Product.create({ name: 'ماوس لاسلكي', sku: 'MS-01', category: 'إلكترونيات', purchasePrice: 150, salePrice: 250, quantity: 50, minStock: 10 });
        Services.Product.create({ name: 'كيبورد ميكانيكي', sku: 'KB-01', category: 'إلكترونيات', purchasePrice: 400, salePrice: 650, quantity: 20, minStock: 5 });
        var sup = Services.Supplier.create('الشركة العالمية للتوزيع', 'احمد', '0123456789');
        var allProds = Services.Product.getAll();
        if (allProds.length > 0) {
          Services.Purchase.create({
            supplierId: sup.id,
            items: [{ productId: allProds[0].id, name: 'ماوس', qty: 100, price: 120 }],
            totalCost: 12000,
            status: 'received'
          });
        }
        UI.showToast('✅ تم تهيئة البيانات الافتراضية');
      }

      window.Controllers = Controllers;
      UI.showToast('🚀 مرحباً بك في مخزني Pro الاحترافي');
    }

    document.addEventListener('DOMContentLoaded', initApp);
  })();
</script>
</body>
</html>
