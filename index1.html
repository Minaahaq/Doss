<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MINA PRO • CRM</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js",
                "firebase/functions": "https://www.gstatic.com/firebasejs/10.12.4/firebase-functions.js"
            }
        }
    </script>
    <style>
        /* ===== RESET & ROOTS ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --surface3: #f1f4f9;
            --text: #0f172a;
            --text2: #334155;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary2: #1d4ed8;
            --primary-light: #dbeafe;
            --purple: #7c3aed;
            --green: #10b981;
            --orange: #f59e0b;
            --red: #ef4444;
            --shadow: 0 10px 40px rgba(15, 23, 42, 0.06);
            --shadow-lg: 0 20px 60px rgba(15, 23, 42, 0.10);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark {
            --bg: #0b1628;
            --surface: #12203a;
            --surface2: #1a2c4a;
            --surface3: #1f3355;
            --text: #f1f5f9;
            --text2: #cbd5e1;
            --muted: #94a3b8;
            --border: #1e3355;
            --primary-light: #1e3a6b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: var(--transition);
            font-size: 15px;
            line-height: 1.5;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
            border: 0;
            background: none;
        }
        .hidden {
            display: none !important;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* ===== LOGIN ===== */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 20% 30%, var(--primary), var(--purple));
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: 40px;
            padding: 48px 36px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo {
            font-size: 34px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-sub {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* ===== APP LAYOUT ===== */
        #app {
            min-height: 100vh;
        }
        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 24px 16px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 30;
            overflow-y: auto;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .brand {
            font-size: 24px;
            font-weight: 900;
            padding: 8px 12px;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        .brand span {
            color: var(--purple);
        }
        .nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .nav button {
            width: 100%;
            text-align: right;
            padding: 14px 16px;
            border-radius: 16px;
            font-weight: 700;
            color: var(--muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
        }
        .nav button:hover {
            background: var(--surface2);
            color: var(--text);
        }
        .nav button.active {
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.30);
        }
        .sidebar-footer {
            position: absolute;
            bottom: 24px;
            right: 16px;
            left: 16px;
        }
        .sidebar-footer button {
            width: 100%;
        }

        /* ===== MAIN ===== */
        .main {
            margin-right: 260px;
            width: calc(100% - 260px);
            padding: 20px 28px 40px;
        }

        /* ===== TOPBAR ===== */
        .topbar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 12px;
            z-index: 20;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.75);
        }
        body.dark .topbar {
            background: rgba(18, 32, 58, 0.85);
        }
        .topbar-title strong {
            font-size: 18px;
        }
        .top-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .icon-btn {
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text);
            border-radius: 16px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }
        .icon-btn:hover {
            background: var(--surface3);
            transform: scale(0.96);
        }
        .notif-badge {
            position: absolute;
            top: -4px;
            left: -4px;
            background: var(--red);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            min-width: 20px;
            height: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 2px solid var(--surface);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.4);
            pointer-events: none;
        }
        .user-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--purple));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }
        .user-meta strong {
            display: block;
            font-size: 14px;
            line-height: 1.2;
        }
        .user-meta span {
            font-size: 11px;
            color: var(--muted);
        }

        /* ===== MOBILE NAV ===== */
        .mobile-nav {
            display: none;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .mobile-nav::-webkit-scrollbar {
            display: none;
        }
        .mobile-nav button {
            white-space: nowrap;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
        }
        .mobile-nav button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ===== COMPONENTS ===== */
        .page-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .page-title h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .page-title p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-lg);
        }

        .grid {
            display: grid;
            gap: 20px;
        }
        .grid-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .grid-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 24px;
        }
        .stat {
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .stat-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .stat-label {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .stat-line {
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--purple));
            border-radius: 10px;
            margin-top: 14px;
            width: 30%;
        }

        .btn {
            border-radius: 16px;
            padding: 12px 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #fff;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 0;
            font-size: 14px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
        }
        .btn.secondary {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn.secondary:hover {
            background: var(--surface3);
            box-shadow: none;
        }
        .btn.green {
            background: var(--green);
        }
        .btn.red {
            background: var(--red);
        }
        .btn.orange {
            background: var(--orange);
        }
        .btn.small {
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 12px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            color: var(--text2);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .field input,
        .field select,
        .field textarea,
        .search {
            width: 100%;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
            outline: none;
            transition: var(--transition);
            font-size: 14px;
        }
        .field textarea {
            min-height: 100px;
            resize: vertical;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
            background: var(--surface);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .search-wrap {
            flex: 1;
            min-width: 200px;
        }
        .table-wrap {
            overflow: auto;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
            font-size: 14px;
        }
        th {
            background: var(--surface2);
            color: var(--muted);
            font-size: 12px;
            text-align: right;
            padding: 16px 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        td {
            padding: 14px 14px;
            border-top: 1px solid var(--border);
        }
        tr:hover td {
            background: var(--surface2);
        }

        .badge {
            display: inline-flex;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            align-items: center;
            gap: 4px;
        }
        .badge.blue {
            background: var(--primary-light);
            color: var(--primary);
        }
        .badge.green {
            background: #d1fae5;
            color: #047857;
        }
        .badge.orange {
            background: #fef3c7;
            color: #b45309;
        }
        .badge.red {
            background: #fee2e2;
            color: #b91c1c;
        }
        body.dark .badge.blue {
            background: #1e3a6b;
            color: #93c5fd;
        }
        body.dark .badge.green {
            background: #103d31;
            color: #6ee7b7;
        }
        body.dark .badge.orange {
            background: #493614;
            color: #fcd34d;
        }
        body.dark .badge.red {
            background: #491d23;
            color: #fca5a5;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .chart-box {
            height: 280px;
            position: relative;
        }
        .empty {
            padding: 40px 20px;
            text-align: center;
            color: var(--muted);
        }

        /* ===== MODAL ===== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.6);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal.show {
            display: flex;
        }
        .modal-card {
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow: auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            animation: modalFade 0.2s ease;
        }
        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-head strong {
            font-size: 22px;
            font-weight: 800;
        }
        .close {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: var(--surface2);
            color: var(--text);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }
        .close:hover {
            background: var(--surface3);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 60px;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:1024px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width:900px) {
            .sidebar {
                display: none;
            }
            .main {
                margin-right: 0;
                width: 100%;
                padding: 16px;
            }
            .mobile-nav {
                display: flex;
            }
            .topbar {
                padding: 8px 14px;
                border-radius: 20px;
                top: 8px;
            }
            .topbar-title strong {
                font-size: 15px;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
            .user-meta {
                display: none;
            }
        }

        @media(max-width:600px) {
            .login-card {
                padding: 32px 20px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .stat-value {
                font-size: 24px;
            }
            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
            .page-title h1 {
                font-size: 22px;
            }
            .card {
                padding: 16px;
            }
            .btn {
                padding: 10px 16px;
                font-size: 13px;
            }
            .modal-card {
                padding: 20px;
            }
            .top-actions .icon-btn:not(.notif-btn) {
                display: none;
            }
            .table-wrap {
                border-radius: 12px;
            }
            td,
            th {
                padding: 10px 10px;
                font-size: 12px;
            }
        }

        /* notification item */
        .notif-item {
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--surface2);
            border-right: 4px solid var(--primary);
            margin-bottom: 10px;
            transition: var(--transition);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .notif-item.unread {
            background: var(--primary-light);
            border-right-color: var(--purple);
        }
        body.dark .notif-item.unread {
            background: #1a2c4a;
        }
        .notif-item .notif-body {
            flex: 1;
        }
        .notif-item .notif-time {
            font-size: 11px;
            color: var(--muted);
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <section id="loginScreen">
        <div class="login-card">
            <div class="logo">MINA <span>PRO</span></div>
            <div class="login-sub">منصة إدارة الفريق والمبيعات</div>
            <div class="field">
                <label>البريد الإلكتروني</label>
                <input id="loginEmail" type="email" autocomplete="email" placeholder="admin@company.com">
            </div>
            <div class="field">
                <label>كلمة المرور</label>
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••">
            </div>
            <button class="btn" style="width:100%;justify-content:center" id="loginBtn">تسجيل الدخول</button>
            <div id="loginError" style="color:var(--red);font-size:13px;text-align:center;margin-top:16px"></div>
        </div>
    </section>

    <!-- APP -->
    <section id="app" class="hidden">
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">MINA <span>PRO</span></div>
                <nav id="sidebarNav" class="nav"></nav>
                <div class="sidebar-footer">
                    <button class="btn secondary" style="width:100%;justify-content:center" onclick="logout()">🚪 تسجيل الخروج</button>
                </div>
            </aside>

            <main class="main">
                <div class="topbar">
                    <div class="topbar-title"><strong id="pageHeading">لوحة التحكم</strong></div>
                    <div class="top-actions">
                        <button class="icon-btn notif-btn" onclick="navigate('notifications')" id="notifBtn">
                            🔔
                            <span class="notif-badge hidden" id="notifBadge">0</span>
                        </button>
                        <button class="icon-btn" onclick="toggleTheme()">🌓</button>
                        <div class="user-box">
                            <div class="avatar" id="topAvatar">M</div>
                            <div class="user-meta">
                                <strong id="topName">Admin</strong>
                                <span id="topRole">Admin</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="mobileNav" class="mobile-nav"></div>
                <div id="content"></div>
            </main>
        </div>
    </section>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-card">
            <div class="modal-head">
                <strong id="modalTitle">نافذة</strong>
                <button class="close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toast" class="toast">✅ تم</div>

    <script type="module">
        // ============================================================
        // IMPORTS
        // ============================================================
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, serverTimestamp, orderBy, onSnapshot, setDoc } from "firebase/firestore";

        // ============================================================
        // CONFIG (استبدل بقيمك)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDsJXNa6EYenn2f5mfoNQVEDxHhCH-XGAo",
            authDomain: "alzahady-6e615.firebaseapp.com",
            databaseURL: "https://alzahady-6e615-default-rtdb.firebaseio.com",
            projectId: "alzahady-6e615",

        function esc(value) {
            return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"',
                "&quot;").replaceAll("'", "&#039;");
        }

        function money(value) {
            return Number(value || 0).toLocaleString("en-US", { style: "currency", currency: "USD",
                maximumFractionDigits: 0 });
        }

        function formatDate(timestamp) {
            if (!timestamp) return "-";
            try {
                const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
                return date.toLocaleDateString("ar-EG", { hour: '2-digit', minute: '2-digit' });
            } catch { return "-"; }
        }

        function toast(msg, icon = "✅") {
            const el = $("toast");
            el.innerHTML = `${icon} ${msg}`;
            el.classList.add("show");
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
        }

        function showModal(title, html) {
            $("modalTitle").textContent = title;

        function statusBadge(status) {
            const map = {
                new: ["جديد", "blue"],
                contacted: ["تم التواصل", "orange"],
                qualified: ["مؤهل", "blue"],
                negotiation: ["تفاوض", "orange"],
                won: ["مربوحة", "green"],
                lost: ["خاسرة", "red"],
                pending: ["معلقة", "orange"],
                approved: ["معتمدة", "blue"],
                paid: ["مدفوعة", "green"],
                active: ["نشط", "green"],
                inactive: ["متوقف", "red"],
                todo: ["جديدة", "blue"],
                doing: ["قيد التنفيذ", "orange"],
                done: ["مكتملة", "green"]
            };
            const x = map[status] || [status || "غير محدد", "blue"];
            return `<span class="badge ${x[1]}">${esc(x[0])}</span>`;
        }

        window.filterTable = function(tableId, value) {
            const table = document.getElementById(tableId);
            if (!table) return;
            const rows = table.querySelectorAll("tbody tr");
            const lower = value.toLowerCase();
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(lower) ? "" : "none";
            });
        };

            const q = query(collection(db, "notifications"), where("userId", "==", currentUser.uid), where("read", "==",
                false));
            const snap = await getDocs(q);
            const count = snap.size;
            const badge = $("notifBadge");
            if (count > 0) {
                badge.textContent = count > 9 ? "9+" : count;
                badge.classList.remove("hidden");

                .email));
                const snap = await getDocs(q);
                let total = 0,
                    count = 0;
                snap.forEach(d => { total += Number(d.data().finalPrice || 0);
                    count++; });
                content.innerHTML = `
                    <div class="page-title"><div><h1>مرحباً ${esc(currentUserData?.name || "عميلنا")} 👋</h1><p>نظرة سريعة على حسابك</p></div></div>
                    <div class="stats"><div class="card stat"><div class="stat-icon">📦</div><div class="stat-value">${count}</div><div class="stat-label">الطلبات</div><div class="stat-line"></div></div><div class="card stat"><div class="stat-icon">💰</div><div class="stat-value">${money(total)}</div><div class="stat-label">المشتريات</div><div class="stat-line"></div></div></div>
                `;
                return;
            }

            const [usersSnap, leadsSnap, clientsSnap, dealsSnap, commSnap] = await Promise.all([
                getDocs(collection(db, "users")),
                getDocs(collection(db, "leads")),
                getDocs(collection(db, "clients")),
                getDocs(collection(db, "deals")),
                getDocs(collection(db, "commissions"))
            ]);

            let revenue = 0,
                commissions = 0,
                won = 0;
            const memberPerformance = {};
            dealsSnap.forEach(d => {
                const x = d.data();
                if (x.status === "won") {
                    won++;
                    const amt = Number(x.finalPrice || 0);
                    revenue += amt;
                    const m = x.memberName || 'غير معين';
                    if (!memberPerformance[m]) memberPerformance[m] = 0;
                    memberPerformance[m] += amt;
                }
            });
            commSnap.forEach(d => { commissions += Number(d.data().amount || 0); });

            let membersTable = '';
            const sorted = Object.entries(memberPerformance).sort((a, b) => b[1] - a[1]);
            if (sorted.length === 0) membersTable =
                `<tr><td colspan="2"><div class="empty">لا توجد مبيعات بعد</div></td></tr>`;
            else sorted.forEach(([name, total]) => {
                membersTable += `<tr><td><strong>${esc(name)}</strong></td><td>${money(total)}</td></tr>`;
            });

            const isAdmin = (currentRole === 'admin' || currentRole === 'manager');

            content.innerHTML = `
                <div class="page-title">
                    <div><h1>مرحباً ${esc(currentUserData?.name || "بك")} 👋</h1><p>نظرة عامة على الأداء</p></div>
                    <button class="btn" onclick="openQuickActions()">+ إجراء سريع</button>

                <div class="stats">
                    <div class="card stat"><div class="stat-icon">👥</div><div class="stat-value">${clientsSnap.size}</div><div class="stat-label">العملاء</div><div class="stat-line"></div></div>
                    <div class="card stat"><div class="stat-icon">🔥</div><div class="stat-value">${leadsSnap.size}</div><div class="stat-label">Leads</div><div class="stat-line"></div></div>
                    <div class="card stat"><div class="stat-icon">💰</div><div class="stat-value">${money(revenue)}</div><div class="stat-label">المبيعات</div><div class="stat-line"></div></div>
                    <div class="card stat"><div class="stat-icon">💵</div><div class="stat-value">${money(commissions)}</div><div class="stat-label">العمولات</div><div class="stat-line"></div></div>
                </div>
                <div class="grid grid-2">
                    <div class="card">
                        <div class="toolbar"><strong>🏆 ترتيب المندوبين</strong></div>
                        <div class="table-wrap"><table><thead><tr><th>المندوب</th><th>المبيعات</th></tr></thead><tbody>${membersTable}</tbody></table></div>
                    </div>
                    <div class="card">
                        <div class="toolbar"><strong>📈 المبيعات</strong><span class="badge green">${won} صفقة</span></div>
                        <div class="chart-box"><canvas id="salesChart"></canvas></div>
                    </div>
                </div>
                <div class="card" style="margin-top:20px">
                    <div class="toolbar"><strong>⚡ اختصارات سريعة</strong></div>
                    <div class="grid grid-4">
                        <button class="btn" onclick="openLeadModal()">🔥 Lead</button>
                        <button class="btn secondary" onclick="openClientModal()">👤 عميل</button>
                        <button class="btn secondary" onclick="openDealModal()">💰 صفقة</button>
                        ${isAdmin ? `<button class="btn secondary" onclick="openTaskModal()">📋 مهمة</button>` : ''}
                        ${isAdmin ? `<button class="btn secondary" onclick="openProjectModal()">📦 مشروع</button>` : ''}
                    </div>
                </div>
            `;

            setTimeout(() => {
                destroyChart("sales");
                const ctx = $("salesChart")?.getContext("2d");
                if (ctx) {
                    charts.sales = new Chart(ctx, {
                        type: "bar",
                        data: {
                            labels: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو"],
                            datasets: [{ label: "المبيعات", data: [12000, 18500, 15000, 27000, 23000, revenue],
                                borderRadius: 8, backgroundColor: "#2563eb" }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
            }, 100);
        }

            if (charts[name]) { charts[name].destroy();

        window.saveLead = async function(id) {
            const data = {
                name: $("leadName").value.trim(),
                phone: $("leadPhone").value.trim(),
                email: $("leadEmail").value.trim(),
                source: $("leadSource").value,
                status: $("leadStatus").value,
                assignedTo: currentUser.uid,
                assignedName: currentUserData?.name || ""
            };
            if (!data.phone) { toast("رقم الهاتف مطلوب"); return; }
            try {
                if (id) await updateDoc(doc(db, "leads", id), data);
                else { data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "leads"), data); }
                toast("تم الحفظ");
                closeModal();
                renderLeads();
            } catch (e) { toast(e.message); }
        };

            if (!title) { toast("عنوان المهمة مطلوب"); return; }

            const assignedUser = usersList.find(u => u.uid === assignedToId);

                priority,
                createdBy: currentUser.uid

                    data.createdAt = serverTimestamp();

            document.querySelectorAll("#leadTable tbody tr").forEach(row => {
                if (!value) { row.style.display = ""; return; }
                row.style.display = row.textContent.includes(statusText(value)) ? "" : "none";
            });
        };

        function statusText(s) {
            const x = { new: "جديد", contacted: "تم التواصل", qualified: "مؤهل", negotiation: "تفاوض", won: "مربوحة",
                lost: "خاسرة" };
            return x[s] || s;
        }

        console.log("🚀 MINA PRO CRM loaded successfully!");
    </script>
</body>
</html>
