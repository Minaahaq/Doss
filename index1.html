<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مخزني Pro — الاحترافي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== أنماط متقدمة ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0d1219; --surface: #151c28; --surface2: #1a2332;
      --line: #25324a; --lineSoft: #1e2939; --ink: #e9eef6; --muted: #8ba0bb;
      --primary: #2fd6a3; --primarySoft: rgba(47,214,163,.14);
      --amber: #ffb224; --coral: #ff6b5e; --blue: #5aa2ff; --violet: #b48cff;
      --radius: 14px; --shadow: 0 10px 26px rgba(0,0,0,.5);
      --font: 'Almarai', sans-serif; --fontDisplay: 'Changa', sans-serif;
    }
    [data-theme="light"] {
      --bg: #f4f7fc; --surface: #ffffff; --surface2: #f0f3f8;
      --line: #d0d8e8; --lineSoft: #e2e8f0; --ink: #1a2636; --muted: #5a6f88;
      --shadow: 0 10px 26px rgba(0,0,0,.08);
    }
    body { font-family: var(--font); background: var(--bg); color: var(--ink); transition: .3s; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--surface); border-inline-end: 1px solid var(--lineSoft); padding: 1rem 0; position: sticky; top:0; height:100vh; overflow-y:auto; }
    .brand { padding: 0 1.2rem 1.5rem; display:flex; align-items:center; gap:.8rem; }
    .brand-mark { width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#59f0c0,var(--primary));display:grid;place-items:center;color:#04281e;font-weight:800;font-size:1.2rem; }
    .nav { display:flex;flex-direction:column;gap:.3rem;padding:0 .6rem; }
    .nav-item { display:flex;align-items:center;gap:.7rem;padding:.6rem .9rem;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:700;font-size:.85rem;cursor:pointer;width:100%;text-align:start;transition:.2s; }
    .nav-item:hover, .nav-item.active { background:var(--primarySoft);color:var(--primary); }
    .nav-item svg { width:18px;height:18px; }
    .content { flex:1; min-width:0; }
    .topbar { position:sticky;top:0;z-index:10;padding:.7rem 1.5rem;background:rgba(13,18,25,.85);backdrop-filter:blur(6px);border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between;align-items:center; }
    main { padding:1.2rem 1.5rem 3rem; }
    .page { display:none; animation:fadeIn .3s ease; }
    .page.active { display:block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
    .stats-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem; }
    .stat { background:var(--surface);border:1px solid var(--lineSoft);border-radius:var(--radius);padding:1rem;border-inline-start:4px solid var(--statColor);display:flex;gap:.8rem;align-items:center; }
    .stat-icon { width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--statSoft);color:var(--statColor); }
    .stat-label { font-size:.7rem;color:var(--muted);font-weight:700;display:block; }
    .stat-value { font-family:var(--fontDisplay);font-size:1.4rem;font-weight:800; }
    .panel { background:var(--surface);border:1px solid var(--lineSoft);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden; }
    .panel-head { padding:.8rem 1rem;border-bottom:1px solid var(--lineSoft);display:flex;align-items:center;gap:.6rem; }
    .panel-head h3 { font-family:var(--fontDisplay);font-size:.95rem;flex:1; }
    .btn { display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:8px;border:none;font-weight:700;font-size:.8rem;cursor:pointer;transition:.2s; }
    .btn-primary { background:var(--primary);color:#04281e;box-shadow:0 4px 14px rgba(47,214,163,.3); }
    .btn-danger { background:var(--coral);color:#2b0705; }
    .btn-line { background:transparent;border:1px solid var(--line);color:var(--ink); }
    .input, .select { width:100%;padding:.5rem .8rem;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit; }
    .input:focus { border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primarySoft); }
    .modal-wrap { position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s; }
    .modal-wrap.open { opacity:1;pointer-events:auto; }
    .modal { background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow:auto;padding:0;transform:scale(.97);transition:.3s; }
    .modal-wrap.open .modal { transform:scale(1); }
    .modal-head { padding:1rem;border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between; }
    .modal-body { padding:1.2rem; }
    .modal-foot { padding:1rem;border-top:1px solid var(--lineSoft);display:flex;justify-content:flex-end;gap:.5rem; }
    .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:.8rem; }
    .span-2 { grid-column:1/-1; }
    .toasts { position:fixed;bottom:1rem;left:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:350px; }
    .toast { padding:.7rem 1rem;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--primary);border-radius:8px;font-weight:700;animation:slideUp .3s ease; }
    .toast.error { border-inline-start-color:var(--coral); }
    .tbl { width:100%;border-collapse:collapse;font-size:.85rem; }
    .tbl th { text-align:start;padding:.6rem .8rem;background:var(--surface2);color:var(--muted);font-size:.75rem;border-bottom:2px solid var(--line); }
    .tbl td { padding:.5rem .8rem;border-bottom:1px solid var(--lineSoft); }
    .tbl tr:hover { background:var(--primarySoft); }
    .pill { display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.7rem;font-weight:700; }
    .pill.success { background:var(--primarySoft);color:var(--primary); }
    .pill.warning { background:rgba(255,178,36,.14);color:var(--amber); }
    .pill.danger { background:rgba(255,107,94,.14);color:var(--coral); }
    .flex { display:flex;gap:.5rem;align-items:center;flex-wrap:wrap; }
    .flex-spacer { flex:1; }
    .mt-1 { margin-top:.8rem; }
    .mb-1 { margin-bottom:.8rem; }
    .text-muted { color:var(--muted); }
    @media(max-width:768px){ .sidebar{display:none;} .form-grid{grid-template-columns:1fr;} .topbar{padding:.5rem 1rem;} main{padding:.5rem 1rem 5rem;} }
  </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
  <div style="background:var(--surface);padding:2.5rem;border-radius:var(--radius);border:1px solid var(--line);width:350px;text-align:center;">
    <h2 style="color:var(--primary);font-family:var(--fontDisplay);">📦 مخزني Pro</h2>
    <p style="color:var(--muted);margin:.5rem 0 1.5rem;">نظام إدارة متكامل (احترافي)</p>
    <input class="input" id="loginUsername" type="text" placeholder="اسم المستخدم" style="text-align:center;margin-bottom:.5rem;">
    <input class="input" id="loginPass" type="password" placeholder="كلمة المرور" style="text-align:center;">
    <button class="btn btn-primary" style="width:100%;margin-top:.8rem;" id="loginBtn">دخول</button>
    <div style="margin-top:1rem;font-size:.7rem;color:var(--muted);">(يمكن تغيير بيانات الدخول من الإعدادات)</div>
  </div>
</div>

<!-- التطبيق -->
<div class="app" style="display:none;" id="appRoot">

  <!-- سايدبار -->
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">📦</div><div><h3 style="font-family:var(--fontDisplay);">مخزني</h3><small style="color:var(--muted);font-size:.7rem;">Pro v3.0</small></div></div>
    <nav class="nav" id="mainNav">
      <button class="nav-item active" data-page="dashboard">📊 لوحة التحكم</button>
      <button class="nav-item" data-page="products">📦 المنتجات</button>
      <button class="nav-item" data-page="suppliers">🏢 الموردين</button>
      <button class="nav-item" data-page="purchases">📥 طلبات الشراء</button>
      <button class="nav-item" data-page="pos">🛒 نقطة البيع</button>
      <button class="nav-item" data-page="customers">👤 العملاء</button>
      <button class="nav-item" data-page="reports">📈 التقارير</button>
      <button class="nav-item" data-page="ai">🧠 الذكاء الاصطناعي</button>
      <button class="nav-item" data-page="settings">⚙️ الإعدادات</button>
    </nav>
    <div style="padding:1rem;border-top:1px solid var(--lineSoft);margin-top:auto;display:flex;justify-content:space-between;align-items:center;">
      <span id="userRole" style="font-size:.7rem;color:var(--muted);">مدير</span>
      <button class="btn btn-line btn-sm" id="logoutBtn">🚪 خروج</button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <div><h2 id="pageTitle" style="font-family:var(--fontDisplay);font-size:1.2rem;">لوحة التحكم</h2><span id="dateTime" style="font-size:.7rem;color:var(--muted);"></span></div>
      <div class="flex">
        <button class="btn btn-line btn-sm" id="themeToggle">🌙</button>
        <button class="btn btn-primary btn-sm" id="quickAddBtn">➕ إضافة منتج</button>
      </div>
    </header>
    <main id="mainContent"></main>
  </div>
</div>

<!-- مودال عام -->
<div class="modal-wrap" id="genericModal"><div class="modal"><div class="modal-head"><h3 id="gModalTitle">عنوان</h3><button class="btn btn-line btn-sm" data-close>✕</button></div><div class="modal-body" id="gModalBody"></div><div class="modal-foot"><button class="btn btn-line" data-close>إلغاء</button><button class="btn btn-primary" id="gModalAction">حفظ</button></div></div></div>

<div class="toasts" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    // ====================================================
    // 1. التخزين
    // ====================================================
    const Storage = {
      get(key, fallback = null) {
        try { const raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; } catch { return fallback; }
      },
      set(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    };

    // ====================================================
    // 2. الخدمات
    // ====================================================
    const Services = {};

    // ---- الإعدادات ----
    Services.Settings = {
      getDefaults() {
        return { shopName: 'مخزني Pro', currency: 'ج.م', taxRate: 14, defaultMinStock: 5, theme: 'dark', logo: '📦' };
      },
      get() {
        const saved = Storage.get('wm_settings', null);
        return saved ? { ...this.getDefaults(), ...saved } : this.getDefaults();
      },
      update(data) {
        const current = this.get();
        const updated = { ...current, ...data };
        Storage.set('wm_settings', updated);
        return updated;
      }
    };

    // ---- المصادقة ----
    Services.Auth = {
      // بيانات الدخول الافتراضية (تُستخدم لأول مرة)
      getDefaults() {
        return { username: 'admin', password: btoa('admin123') }; // مشفرة Base64
      },
      getCredentials() {
        const saved = Storage.get('wm_credentials', null);
        if (!saved) {
          // حفظ البيانات الافتراضية
          const def = this.getDefaults();
          Storage.set('wm_credentials', def);
          return def;
        }
        return saved;
      },
      login(username, password) {
        const creds = this.getCredentials();
        return username === creds.username && btoa(password) === creds.password;
      },
      updateCredentials(username, password) {
        const newCreds = { username, password: btoa(password) };
        Storage.set('wm_credentials', newCreds);
        return newCreds;
      }
    };

    // ---- باقي الخدمات (المنتجات، الموردين، إلخ) ----
    Services.Product = {
      getAll() { return Storage.get('wm_products', []); },
      getById(id) { return this.getAll().find(p => p.id === id); },
      create(data) {
        const list = this.getAll();
        const newP = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), createdAt: Date.now(), ...data };
        list.push(newP);
        Storage.set('wm_products', list);
        return newP;
      },
      update(id, data) {
        const list = this.getAll();
        const idx = list.findIndex(p => p.id === id);
        if (idx === -1) return null;
        list[idx] = { ...list[idx], ...data };
        Storage.set('wm_products', list);
        return list[idx];
      },
      delete(id) {
        let list = this.getAll();
        list = list.filter(p => p.id !== id);
        Storage.set('wm_products', list);
      },
      getStatus(p) {
        if (p.quantity <= 0) return 'out';
        if (p.quantity <= (p.minStock || 5)) return 'low';
        return 'ok';
      }
    };

    Services.Supplier = {
      getAll() { return Storage.get('wm_suppliers', []); },
      getById(id) { return this.getAll().find(s => s.id === id); },
      create(name, contact = '', phone = '') {
        const list = this.getAll();
        const newS = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), name, contact, phone, createdAt: Date.now() };
        list.push(newS);
        Storage.set('wm_suppliers', list);
        return newS;
      },
      delete(id) {
        let list = this.getAll();
        list = list.filter(s => s.id !== id);
        Storage.set('wm_suppliers', list);
      }
    };

    Services.Purchase = {
      getAll() { return Storage.get('wm_purchases', []); },
      create(data) {
        const list = this.getAll();
        const newPO = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), status: 'pending', createdAt: Date.now(), ...data };
        list.push(newPO);
        Storage.set('wm_purchases', list);
        return newPO;
      },
      receive(poId) {
        const list = this.getAll();
        const po = list.find(p => p.id === poId);
        if (!po || po.status === 'received') return null;
        po.status = 'received';
        po.receivedAt = Date.now();
        const products = Services.Product.getAll();
        po.items.forEach(item => {
          const prod = products.find(p => p.id === item.productId);
          if (prod) {
            prod.quantity = (prod.quantity || 0) + item.qty;
            const ops = Storage.get('wm_operations', []);
            ops.push({
              id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
              productId: prod.id,
              productName: prod.name,
              type: 'in',
              qty: item.qty,
              note: `استلام طلب شراء #${po.id}`,
              createdAt: Date.now()
            });
            Storage.set('wm_operations', ops);
          }
        });
        Storage.set('wm_products', products);
        Storage.set('wm_purchases', list);
        return po;
      },
      delete(id) {
        let list = this.getAll();
        list = list.filter(p => p.id !== id);
        Storage.set('wm_purchases', list);
      }
    };

    Services.Customer = {
      getAll() { return Storage.get('wm_customers', []); },
      create(name, phone = '') {
        const list = this.getAll();
        const c = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), name, phone, createdAt: Date.now() };
        list.push(c);
        Storage.set('wm_customers', list);
        return c;
      },
      delete(id) {
        let list = this.getAll();
        list = list.filter(c => c.id !== id);
        Storage.set('wm_customers', list);
      }
    };

    Services.Sales = {
      getAll() { return Storage.get('wm_sales', []); },
      create({ customerId, items, total, discount = 0, tax = 0, paymentMethod = 'cash', note = '' }) {
        const list = this.getAll();
        const number = 'INV-' + Date.now().toString(36).toUpperCase();
        const sale = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), number, customerId, items, total, discount, tax, paymentMethod, note, createdAt: Date.now() };
        list.push(sale);
        Storage.set('wm_sales', list);
        return sale;
      }
    };

    Services.Report = {
      getDashboardStats() {
        const products = Services.Product.getAll();
        const sales = Services.Sales.getAll();
        const suppliers = Services.Supplier.getAll();
        const totalStockValue = products.reduce((s, p) => s + (p.purchasePrice||0) * (p.quantity||0), 0);
        const totalSales = sales.reduce((s, p) => s + p.total, 0);
        const lowStock = products.filter(p => Services.Product.getStatus(p) !== 'ok').length;
        return { products: products.length, suppliers: suppliers.length, totalStockValue, totalSales, lowStock };
      },
      getPaymentMethodDistribution() {
        const sales = Services.Sales.getAll();
        const map = {};
        sales.forEach(s => { map[s.paymentMethod] = (map[s.paymentMethod] || 0) + s.total; });
        return Object.entries(map).map(([k,v]) => ({ label: k, value: v }));
      },
      getBestSuppliers() {
        const purchases = Services.Purchase.getAll().filter(p => p.status === 'received');
        const map = {};
        purchases.forEach(p => {
          const supplier = Services.Supplier.getById(p.supplierId);
          const name = supplier ? supplier.name : 'غير معروف';
          map[name] = (map[name] || 0) + p.totalCost;
        });
        return Object.entries(map).map(([k,v]) => ({ name: k, spent: v })).sort((a,b) => b.spent - a.spent);
      }
    };

    Services.AI = {
      analyze() {
        const products = Services.Product.getAll();
        const ops = Storage.get('wm_operations', []);
        const sales = Services.Sales.getAll();
        const low = products.filter(p => Services.Product.getStatus(p) !== 'ok');
        const avgDailySale = ops.filter(o => o.type === 'out').reduce((s,o) => s + o.qty, 0) / Math.max(1, 30);
        const restock = low.map(p => {
          const daysToEmpty = avgDailySale > 0 ? Math.floor(p.quantity / avgDailySale) : 99;
          return { product: p, urgency: daysToEmpty < 3 ? 'عاجل' : 'متوسط', daysToEmpty };
        });
        const totalRevenue = sales.reduce((s, v) => s + v.total, 0);
        const totalProfit = sales.reduce((s, v) => s + (v.total - (v.items.reduce((a,i) => a + (i.cost||0)*i.qty, 0))), 0);
        return { restock, totalRevenue, totalProfit, totalSales: sales.length };
      }
    };

    // ====================================================
    // 3. واجهة المستخدم (UI)
    // ====================================================
    const UI = {
      showToast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3500);
      },
      openModal(title, bodyHTML, actionLabel = 'حفظ', onAction = null) {
        document.getElementById('gModalTitle').textContent = title;
        document.getElementById('gModalBody').innerHTML = bodyHTML;
        document.getElementById('gModalAction').textContent = actionLabel;
        document.getElementById('gModalAction').onclick = () => { if (onAction) onAction(); };
        document.getElementById('genericModal').classList.add('open');
      },
      closeModal() { document.getElementById('genericModal').classList.remove('open'); },
      renderPage(pageId, html) {
        let container = document.getElementById('page-' + pageId);
        if (!container) {
          container = document.createElement('section');
          container.id = 'page-' + pageId;
          container.className = 'page';
          document.getElementById('mainContent').appendChild(container);
        }
        container.innerHTML = html;
        container.classList.add('active');
        document.querySelectorAll('.page').forEach(p => { if (p.id !== container.id) p.classList.remove('active'); });
        const navBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
        if (navBtn) document.getElementById('pageTitle').textContent = navBtn.textContent.trim();
        document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === pageId));
      }
    };

    // ====================================================
    // 4. الكونترولرز (Controllers)
    // ====================================================
    const Controllers = {};

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

    // ---- لوحة التحكم ----
    Controllers.Dashboard = {
      render() {
        const stats = Services.Report.getDashboardStats();
        const html = `
          <div class="stats-grid">
            <div class="stat" style="--statColor:var(--blue);--statSoft:rgba(90,162,255,.14);">
              <div class="stat-icon">📦</div><div><span class="stat-label">المنتجات</span><span class="stat-value">${stats.products}</span></div>
            </div>
            <div class="stat" style="--statColor:var(--primary);--statSoft:var(--primarySoft);">
              <div class="stat-icon">💰</div><div><span class="stat-label">قيمة المخزون</span><span class="stat-value">${stats.totalStockValue.toFixed(0)}</span></div>
            </div>
            <div class="stat" style="--statColor:var(--violet);--statSoft:rgba(180,140,255,.14);">
              <div class="stat-icon">📈</div><div><span class="stat-label">إجمالي المبيعات</span><span class="stat-value">${stats.totalSales.toFixed(0)}</span></div>
            </div>
            <div class="stat" style="--statColor:var(--amber);--statSoft:rgba(255,178,36,.14);">
              <div class="stat-icon">⚠️</div><div><span class="stat-label">تنبيهات المخزون</span><span class="stat-value">${stats.lowStock}</span></div>
            </div>
            <div class="stat" style="--statColor:var(--coral);--statSoft:rgba(255,107,94,.14);">
              <div class="stat-icon">🏢</div><div><span class="stat-label">الموردين</span><span class="stat-value">${stats.suppliers}</span></div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="panel"><div class="panel-head"><h3>🏆 أفضل الموردين</h3></div>

    Controllers.POS = {
      render() {
        const products = Services.Product.getAll().filter(p => p.quantity > 0);
        const customers = Services.Customer.getAll();
        const prodHTML = products.map(p => `<button class="btn btn-line btn-sm" onclick="Controllers.POS.addToCart('${p.id}')">${p.name} (${p.quantity})</button>`).join(' ');
        const cartHTML = cartItems.map((item, idx) => `<div class="flex" style="padding:.2rem 0;border-bottom:1px solid var(--lineSoft);">
          <span>${item.name} × ${item.qty}</span><span>${(item.price*item.qty).toFixed(0)}</span>
          <button class="btn btn-sm btn-danger" onclick="Controllers.POS.removeFromCart(${idx})">✕</button>
        </div>`).join('');
        const total = cartItems.reduce((s,i) => s + i.price * i.qty, 0);
        const settings = Services.Settings.get();
        const tax = total * (settings.taxRate || 0) / 100;
        const grandTotal = total + tax;
        const html = `
          <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:1rem;">
            <div class="panel"><div class="panel-head"><h3>🛍️ المنتجات</h3></div><div style="padding:.8rem;display:flex;flex-wrap:wrap;gap:.4rem;">${prodHTML||'لا توجد منتجات'}</div></div>
            <div class="panel"><div class="panel-head"><h3>🧾 السلة</h3></div>
              <div style="padding:.8rem;">
                <div class="flex"><label>العميل</label><select class="select" id="posCustomer"><option value="">نقدي</option>${customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                <div class="flex"><label>طريقة الدفع</label><select class="select" id="posPayment"><option value="cash">نقدي</option><option value="card">بطاقة</option><option value="transfer">تحويل</option><option value="wallet">محفظة</option></select></div>
                <div class="flex"><label>خصم (%)</label><input class="input" id="posDiscount" type="number" value="0" style="width:80px;"></div>
                <div id="posCartItems">${cartHTML||'<span class="text-muted">السلة فارغة</span>'}</div>
                <div style="border-top:1px solid var(--lineSoft);margin-top:.5rem;padding-top:.5rem;">
                  <div class="flex"><span>المجموع</span><span>${total.toFixed(0)}</span></div>
                  <div class="flex"><span>الضريبة (${settings.taxRate||0}%)</span><span>${tax.toFixed(0)}</span></div>
                  <div class="flex" style="font-weight:800;font-size:1.2rem;"><span>الإجمالي</span><span>${grandTotal.toFixed(0)}</span></div>
                </div>
                <button class="btn btn-primary" style="width:100%;margin-top:.5rem;" onclick="Controllers.POS.checkout()">💰 إتمام البيع</button>
                <button class="btn btn-danger" style="width:100%;margin-top:.3rem;" onclick="Controllers.POS.clearCart()">🗑️ تفريغ</button>
              </div>
            </div>
          </div>
        `;
        UI.renderPage('pos', html);
      },
      addToCart(id) {
        const p = Services.Product.getById(id);
        if (!p || p.quantity <= 0) return UI.showToast('غير متوفر', 'error');
        const existing = cartItems.find(item => item.id === id);
        if (existing) {
          if (existing.qty >= p.quantity) return UI.showToast('الكمية القصوى', 'warning');
          existing.qty++;
        } else {
          cartItems.push({ id: p.id, name: p.name, price: p.salePrice, qty: 1 });
        }
        this.render();
      },
      removeFromCart(idx) { cartItems.splice(idx, 1); this.render(); },
      clearCart() { cartItems = []; this.render(); },
      checkout() {
        if (!cartItems.length) return UI.showToast('السلة فارغة', 'error');
        const customerId = document.getElementById('posCustomer').value;
        const paymentMethod = document.getElementById('posPayment').value;
        const discount = parseFloat(document.getElementById('posDiscount').value) || 0;
        const settings = Services.Settings.get();
        let total = cartItems.reduce((s, i) => s + i.price * i.qty, 0);
        const discountAmount = total * (discount / 100);
        total = total - discountAmount;
        const tax = total * (settings.taxRate || 0) / 100;
        const grandTotal = total + tax;
        const items = cartItems.map(item => {
          const p = Services.Product.getById(item.id);
          if (p) {
            p.quantity -= item.qty;
            Services.Product.update(p.id, { quantity: p.quantity });
            const ops = Storage.get('wm_operations', []);
            ops.push({
              id: uid(),
              productId: p.id,
              productName: p.name,
              type: 'out',
              qty: item.qty,
              note: 'بيع POS',
              createdAt: Date.now()
            });
            Storage.set('wm_operations', ops);
          }
          return { ...item, cost: p?.purchasePrice || 0 };
        });
        Services.Sales.create({ customerId, items, total: grandTotal, discount: discountAmount, tax, paymentMethod, note: '' });
        cartItems = [];
        this.render();
        UI.showToast(`✅ تم البيع - ${grandTotal.toFixed(0)} ${settings.currency}`);
        Controllers.Dashboard.render();
      }
    };

          </div>
          <div class="panel"><div class="panel-head"><h3>📋 توصيات ذكية</h3></div>
            <ul>${analysis.restock.length ? analysis.restock.map(r => `<li style="padding:.5rem 1rem;border-bottom:1px solid var(--lineSoft);display:flex;justify-content:space-between;"><span>${r.product.name}</span><span class="pill ${r.urgency==='عاجل'?'danger':'warning'}">${r.urgency} (ينفد خلال ${r.daysToEmpty} يوم)</span></li>`).join('') : '<li class="text-muted" style="padding:.5rem 1rem;">جميع المنتجات بحالة جيدة ✅</li>'}</ul>
          </div>
        `;
        UI.renderPage('ai', html);
      }
    };

    // ---- الإعدادات (مع إمكانية تغيير بيانات الدخول) ----
    Controllers.Settings = {
      render() {
        const settings = Services.Settings.get();
        const creds = Services.Auth.getCredentials();
        const html = `
          <div class="panel"><div class="panel-head"><h3>⚙️ إعدادات النظام</h3></div>
          <div style="padding:1.2rem;">
            <div class="form-grid">
              <div><label>اسم المتجر</label><input class="input" id="setShopName" value="${settings.shopName}"></div>
              <div><label>العملة</label><input class="input" id="setCurrency" value="${settings.currency}"></div>
              <div><label>نسبة الضريبة (%)</label><input class="input" id="setTax" type="number" value="${settings.taxRate}"></div>
              <div><label>الحد الأدنى الافتراضي</label><input class="input" id="setMinStock" type="number" value="${settings.defaultMinStock}"></div>
              <div><label>الشعار (رمز)</label><input class="input" id="setLogo" value="${settings.logo}"></div>
            </div>
            <button class="btn btn-primary mt-1" onclick="Controllers.Settings.saveSettings()">💾 حفظ الإعدادات</button>
          </div></div>
          <div class="panel"><div class="panel-head"><h3>🔐 بيانات الدخول</h3></div>
          <div style="padding:1.2rem;">
            <div class="form-grid">
              <div><label>اسم المستخدم الجديد</label><input class="input" id="newUsername" value="${creds.username}" placeholder="اسم المستخدم"></div>
              <div><label>كلمة المرور الجديدة</label><input class="input" id="newPassword" type="text" placeholder="كلمة المرور الجديدة"></div>
            </div>
            <button class="btn btn-primary mt-1" onclick="Controllers.Settings.changeCredentials()">🔑 تغيير بيانات الدخول</button>
            <div style="margin-top:.5rem;font-size:.7rem;color:var(--muted);">(سيتم تسجيل الخروج تلقائياً بعد التغيير)</div>
          </div></div>
          <div class="panel"><div class="panel-head"><h3>👤 إدارة المستخدمين</h3></div>
          <div style="padding:1.2rem;">
            <div class="flex"><input class="input" id="newUsername2" placeholder="اسم المستخدم" style="max-width:200px;"><input class="input" id="newUserPass2" type="password" placeholder="كلمة المرور" style="max-width:200px;"><button class="btn btn-primary" onclick="Controllers.Settings.addUser()">➕ إضافة</button></div>
            <ul id="userList" style="margin-top:.5rem;"></ul>
          </div></div>
        `;
        UI.renderPage('settings', html);
        this.renderUsers();
      },
      saveSettings() {
        Services.Settings.update({
          shopName: document.getElementById('setShopName').value,
          currency: document.getElementById('setCurrency').value,
          taxRate: parseFloat(document.getElementById('setTax').value) || 0,
          defaultMinStock: parseInt(document.getElementById('setMinStock').value) || 5,
          logo: document.getElementById('setLogo').value
        });
        UI.showToast('تم حفظ الإعدادات');
        this.render();
      },
      changeCredentials() {
        const username = document.getElementById('newUsername').value.trim();
        const password = document.getElementById('newPassword').value.trim();
        if (!username || !password) return UI.showToast('املأ الحقول', 'error');
        if (password.length < 4) return UI.showToast('كلمة المرور يجب أن تكون 4 أحرف على الأقل', 'error');
        Services.Auth.updateCredentials(username, password);
        UI.showToast('✅ تم تغيير بيانات الدخول، سيتم تسجيل الخروج');
        // تسجيل الخروج
        Storage.set('wm_auth', { loggedIn: false });
        setTimeout(() => location.reload(), 1000);
      },
      renderUsers() {
        const users = Storage.get('wm_users', []);
        const list = document.getElementById('userList');
        if (list) list.innerHTML = users.map(u => `<li style="padding:.3rem 0;display:flex;justify-content:space-between;"><span>${u.username} (${u.role||'كاشير'})</span><button class="btn btn-sm btn-danger" onclick="Controllers.Settings.deleteUser('${u.username}')">✕</button></li>`).join('');
      },
      addUser() {
        const username = document.getElementById('newUsername2').value.trim();
        const pass = document.getElementById('newUserPass2').value.trim();
        if (!username || !pass) return UI.showToast('املأ الحقول', 'error');
        const users = Storage.get('wm_users', []);
        if (users.find(u => u.username === username)) return UI.showToast('المستخدم موجود', 'error');
        users.push({ username, password: btoa(pass), role: 'كاشير' });
        Storage.set('wm_users', users);
        this.renderUsers();
        UI.showToast('تمت الإضافة');
      },
      deleteUser(username) {
        let users = Storage.get('wm_users', []);
        users = users.filter(u => u.username !== username);
        Storage.set('wm_users', users);
        this.renderUsers();
      }
    };

    // ====================================================
    // 5. التهيئة
    // ====================================================
    function init() {
      // التحقق من الدخول
      const auth = Storage.get('wm_auth', null);
      if (!auth || !auth.loggedIn) {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appRoot').style.display = 'none';
        return;
      }
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appRoot').style.display = 'flex';

      // الثيم
      const settings = Services.Settings.get();
      document.documentElement.setAttribute('data-theme', settings.theme || 'dark');
      document.getElementById('themeToggle').textContent = settings.theme === 'dark' ? '☀️' : '🌙';

      // رندر الصفحة الافتراضية
      Controllers.Dashboard.render();

      // الأحداث العامة
      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        Services.Settings.update({ theme: next });
        document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
      });

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const page = btn.dataset.page;
          const map = {
            dashboard: Controllers.Dashboard,
            products: Controllers.Products,
            suppliers: Controllers.Suppliers,
            purchases: Controllers.Purchases,
            pos: Controllers.POS,
            customers: Controllers.Customers,
            reports: Controllers.Reports,
            ai: Controllers.AI,
            settings: Controllers.Settings
          };
          if (map[page]) map[page].render();
          else UI.showToast('صفحة قيد التطوير', 'warning');
        });
      });

      document.getElementById('quickAddBtn').addEventListener('click', () => Controllers.Products.showAdd());

      document.getElementById('logoutBtn').addEventListener('click', () => {
        Storage.set('wm_auth', { loggedIn: false });
        location.reload();
      });

      document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', UI.closeModal));
      document.getElementById('genericModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) UI.closeModal();
      });

      // الساعة
      function updateClock() {
        document.getElementById('dateTime').textContent = new Date().toLocaleString('ar');
      }
      updateClock();
      setInterval(updateClock, 1000);

      // تسجيل الدخول باستخدام بيانات التخزين المحلي
      document.getElementById('loginBtn').addEventListener('click', () => {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPass').value.trim();
        if (Services.Auth.login(username, password)) {
          Storage.set('wm_auth', { loggedIn: true });
          location.reload();
        } else {
          UI.showToast('اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
        }
      });
      document.getElementById('loginPass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });
      document.getElementById('loginUsername').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
      });

      // بيانات افتراضية (Seed)
      if (Storage.get('wm_products', null) === null) {
        Services.Product.create({ name: 'ماوس لاسلكي', sku: 'MS-01', category: 'إلكترونيات', purchasePrice: 150, salePrice: 250, quantity: 50, minStock: 10 });
        Services.Product.create({ name: 'كيبورد ميكانيكي', sku: 'KB-01', category: 'إلكترونيات', purchasePrice: 400, salePrice: 650, quantity: 20, minStock: 5 });
        const sup = Services.Supplier.create('الشركة العالمية للتوزيع', 'احمد', '0123456789');
        Services.Purchase.create({ supplierId: sup.id, items: [{ productId: Services.Product.getAll()[0].id, name: 'ماوس', qty: 100, price: 120 }], totalCost: 12000, status: 'received' });
        UI.showToast('✅ تم تهيئة البيانات الافتراضية');
      }

      window.Controllers = Controllers;
      UI.showToast('🚀 مرحباً بك في مخزني Pro الاحترافي');
    }

    document.addEventListener('DOMContentLoaded', init);
  })();
</script>
</body>
</html>
