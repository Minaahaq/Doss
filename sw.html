<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>مخزني Pro — نظام متكامل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== RESET & ROOT ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0b1119;
      --surface: #141c2b;
      --surface2: #1a2538;
      --line: #2a3a54;
      --lineSoft: #1f2d42;
      --ink: #ecf2f9;
      --muted: #8aa1c4;
      --primary: #2fd6a3;
      --primarySoft: rgba(47,214,163,.18);
      --amber: #f5b342;
      --coral: #ff6b5e;
      --blue: #5aa2ff;
      --violet: #b48cff;
      --radius: 20px;
      --shadow: 0 12px 30px rgba(0,0,0,.5);
      --font: 'Almarai', system-ui, sans-serif;
      --fontDisplay: 'Changa', sans-serif;
    }
    [data-theme="light"] {
      --bg: #f2f6fc;
      --surface: #ffffff;
      --surface2: #f0f4fa;
      --line: #d0dae8;
      --lineSoft: #e2eaf2;
      --ink: #1a263a;
      --muted: #5f7a9e;
      --shadow: 0 12px 30px rgba(0,0,0,.08);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      font-size: 18px;
      line-height: 1.6;
      transition: background .3s, color .3s;
      -webkit-font-smoothing: antialiased;
    }
    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 99px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ===== LOGIN ===== */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 1rem;
    }
    .login-box {
      background: var(--surface);
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .login-box h2 {
      font-family: var(--fontDisplay);
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: .5rem;
    }
    .login-box p {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 1.5rem;
    }
    .login-box .input {
      font-size: 1.1rem;
      padding: .8rem 1rem;
      margin-bottom: .7rem;
      border-radius: 14px;
      background: var(--surface2);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 100%;
      font-family: inherit;
      transition: border .2s;
    }
    .login-box .input:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px var(--primarySoft);
    }
    .login-box .btn {
      width: 100%;
      padding: .9rem;
      font-size: 1.2rem;
      border-radius: 14px;
      margin-top: .5rem;
    }

    /* ===== APP LAYOUT ===== */
    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ===== SIDEBAR (iOS style) ===== */
    .sidebar {
      width: 280px;
      background: var(--surface);
      border-inline-end: 1px solid var(--lineSoft);
      padding: 1.5rem 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .brand {
      padding: 0 1.5rem 1.8rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #59f0c0, var(--primary));
      display: grid;
      place-items: center;
      font-size: 2rem;
      box-shadow: 0 6px 18px rgba(47,214,163,.3);
      color: #04281e;
    }
    .brand h1 {
      font-family: var(--fontDisplay);
      font-size: 1.7rem;
      line-height: 1.1;
    }
    .brand small {
      font-size: .7rem;
      color: var(--muted);
      display: block;
      font-weight: 700;
    }

    /* ---- NAVIGATION (sections) ---- */
    .nav-section {
      padding: 0 1rem;
      margin-bottom: 1rem;
    }
    .nav-section-title {
      font-size: .65rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      opacity: .6;
      padding: 0 .5rem .3rem;
      font-weight: 800;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: .9rem;
      padding: .8rem 1rem;
      border-radius: 14px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      text-align: start;
      transition: all .2s;
      margin-bottom: 2px;
    }
    .nav-item .icon {
      font-size: 1.6rem;
      width: 2.2rem;
      text-align: center;
      flex-shrink: 0;
    }
    .nav-item:hover {
      background: rgba(255,255,255,.04);
      color: var(--ink);
    }
    .nav-item.active {
      background: var(--primarySoft);
      color: var(--primary);
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 1.2rem 1.5rem;
      border-top: 1px solid var(--lineSoft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-footer .user-badge {
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .sidebar-footer .user-badge .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--primarySoft);
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 1.4rem;
    }

    /* ===== CONTENT ===== */
    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 1rem 2rem;
      background: rgba(11,17,25,.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--lineSoft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar h2 {
      font-family: var(--fontDisplay);
      font-size: 1.8rem;
      font-weight: 800;
    }
    .topbar .date-time {
      font-size: .85rem;
      color: var(--muted);
      display: flex;
      gap: .8rem;
      align-items: center;
    }
    .topbar-actions {
      display: flex;
      gap: .6rem;
      align-items: center;
    }
    .topbar-actions .btn {
      font-size: 1rem;
      padding: .6rem 1.2rem;
      border-radius: 14px;
    }

    /* ===== MAIN PAGES ===== */
    main {
      padding: 1.5rem 2rem 4rem;
    }
    .page {
      display: none;
      animation: fadeUp .4s ease;
    }
    .page.active {
      display: block;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }

    /* ===== STATS GRID (big icons) ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--lineSoft);
      border-radius: var(--radius);
      padding: 1.2rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s;
    }
    .stat:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }
    .stat .icon {
      font-size: 2.8rem;
      width: 4rem;
      height: 4rem;
      background: var(--primarySoft);
      border-radius: 16px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .stat .info .label {
      font-size: .8rem;
      color: var(--muted);
      font-weight: 700;
      display: block;
    }
    .stat .info .value {
      font-family: var(--fontDisplay);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.2;
    }

    /* ===== PANELS ===== */
    .panel {
      background: var(--surface);
      border: 1px solid var(--lineSoft);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .panel-head {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--lineSoft);
      display: flex;
      align-items: center;
      gap: .8rem;
      font-size: 1.1rem;
    }
    .panel-head h3 {
      font-family: var(--fontDisplay);
      font-size: 1.3rem;
      font-weight: 700;
      flex: 1;
    }
    .panel-head .badge {
      background: var(--primarySoft);
      color: var(--primary);
      padding: .2rem .9rem;
      border-radius: 99px;
      font-size: .85rem;
      font-weight: 800;
    }

    /* ===== BUTTONS (big) ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      padding: .7rem 1.4rem;
      border-radius: 14px;
      border: none;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-primary {
      background: var(--primary);
      color: #04281e;
      box-shadow: 0 4px 16px rgba(47,214,163,.3);
    }
    .btn-primary:hover { filter: brightness(1.08); transform: translateY(-2px); }
    .btn-danger {
      background: var(--coral);
      color: #2b0705;
      box-shadow: 0 4px 16px rgba(255,107,94,.3);
    }
    .btn-line {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .btn-line:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: .4rem 1rem; font-size: .85rem; }
    .btn-lg { padding: .9rem 2rem; font-size: 1.2rem; }

    /* ===== INPUTS ===== */
    .input, .select {
      width: 100%;
      padding: .8rem 1rem;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--surface2);
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      transition: border .2s, box-shadow .2s;
    }
    .input:focus, .select:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 4px var(--primarySoft);
    }

    /* ===== TABLE ===== */
    .tbl-wrap {
      overflow-x: auto;
    }
    .tbl {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }
    .tbl th {
      padding: .8rem 1rem;
      background: var(--surface2);
      color: var(--muted);
      font-size: .8rem;
      text-align: start;
      border-bottom: 2px solid var(--line);
      white-space: nowrap;
    }
    .tbl td {
      padding: .7rem 1rem;
      border-bottom: 1px solid var(--lineSoft);
      vertical-align: middle;
    }
    .tbl tr:hover { background: var(--primarySoft); }

    /* ===== PILLS ===== */
    .pill {
      display: inline-block;
      padding: .2rem .8rem;
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 700;
    }
    .pill.success { background: var(--primarySoft); color: var(--primary); }
    .pill.warning { background: rgba(245,179,66,.15); color: var(--amber); }
    .pill.danger { background: rgba(255,107,94,.15); color: var(--coral); }

    /* ===== MODAL ===== */
    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      padding: 1rem;
    }
    .modal-wrap.open { opacity:1; pointer-events:auto; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      width: 100%;
      max-width: 640px;
      max-height: 92vh;
      overflow: auto;
      padding: 0;
      transform: scale(.95);
      transition: .3s cubic-bezier(.2,.9,.3,1.2);
    }
    .modal-wrap.open .modal { transform:scale(1); }
    .modal-head {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--lineSoft);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-head h3 { font-family: var(--fontDisplay); font-size: 1.4rem; }
    .modal-body { padding: 1.5rem; }
    .modal-foot {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--lineSoft);
      display: flex;
      justify-content: flex-end;
      gap: .6rem;
    }

    /* ===== TOASTS ===== */
    .toasts {
      position: fixed;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      max-width: 380px;
    }
    .toast {
      padding: .9rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-inline-start: 5px solid var(--primary);
      border-radius: 16px;
      font-weight: 700;
      font-size: .95rem;
      box-shadow: var(--shadow);
      animation: slideIn .3s ease;
    }
    .toast.error { border-inline-start-color: var(--coral); }
    @keyframes slideIn {
      from { opacity:0; transform:translateY(16px); }
      to { opacity:1; transform:translateY(0); }
    }

    /* ===== INVOICE PREVIEW ===== */
    .invoice-preview {
      background: #fff;
      color: #111;
      padding: 2rem;
      border-radius: 16px;
      font-family: 'Almarai', sans-serif;
      direction: rtl;
    }
    .invoice-preview h2 { font-size: 1.8rem; margin-bottom: .3rem; }
    .invoice-preview .meta { color: #555; font-size: .9rem; margin-bottom: 1rem; }
    .invoice-preview table { width:100%; border-collapse:collapse; margin:1rem 0; }
    .invoice-preview table th, .invoice-preview table td { padding:.5rem; border-bottom:1px solid #ddd; text-align:center; }
    .invoice-preview .total { font-size:1.4rem; font-weight:800; margin-top:.5rem; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .topbar { padding: .7rem 1rem; flex-wrap: wrap; }
      .topbar h2 { font-size: 1.3rem; }
      main { padding: .8rem 1rem 5rem; }
      .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }
      .stat .icon { font-size: 2rem; width: 3rem; height: 3rem; }
      .stat .info .value { font-size: 1.5rem; }
    }
    @media (max-width: 600px) {
      .login-box { padding: 1.5rem; }
      .modal { border-radius: 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }
    /* ===== UTILITY ===== */
    .flex { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
    .flex-spacer { flex:1; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .span-2 { grid-column:1/-1; }
    .mt-1 { margin-top:.8rem; }
    .mb-1 { margin-bottom:.8rem; }
    .text-muted { color:var(--muted); }
    .text-center { text-align:center; }
  </style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginScreen">
  <div class="login-box">
    <h2>📦 مخزني Pro</h2>
    <p>نظام إدارة متكامل • تصميم احترافي</p>
    <input class="input" id="loginUsername" type="text" placeholder="اسم المستخدم" value="admin" />
    <input class="input" id="loginPass" type="password" placeholder="كلمة المرور" value="admin123" />
    <button class="btn btn-primary" id="loginBtn">دخول</button>
    <div style="margin-top:1rem; font-size:.75rem; color:var(--muted);">يمكنك تغيير بيانات الدخول من الإعدادات</div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="app" style="display:none;" id="appRoot">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">📦</div>
      <div><h1>مخزني</h1><small>Pro v4.0</small></div>
    </div>

    <!-- القسم الرئيسي -->
    <div class="nav-section">
      <div class="nav-section-title">الرئيسية</div>
      <button class="nav-item active" data-page="dashboard"><span class="icon">📊</span> لوحة التحكم</button>
    </div>

    <!-- قسم الكاشير -->
    <div class="nav-section">
      <div class="nav-section-title">الكاشير</div>
      <button class="nav-item" data-page="pos"><span class="icon">🛒</span> نقطة البيع</button>
      <button class="nav-item" data-page="customers"><span class="icon">👤</span> العملاء</button>
      <button class="nav-item" data-page="purchases"><span class="icon">📥</span> طلبات الشراء</button>
    </div>

    <!-- قسم المدير -->
    <div class="nav-section">
      <div class="nav-section-title">المدير</div>
      <button class="nav-item" data-page="products"><span class="icon">📦</span> المنتجات</button>
      <button class="nav-item" data-page="suppliers"><span class="icon">🏢</span> الموردين</button>
      <button class="nav-item" data-page="reports"><span class="icon">📈</span> التقارير</button>
      <button class="nav-item" data-page="ai"><span class="icon">🧠</span> الذكاء الاصطناعي</button>
    </div>

    <!-- قسم النظام -->
    <div class="nav-section">
      <div class="nav-section-title">النظام</div>
      <button class="nav-item" data-page="settings"><span class="icon">⚙️</span> الإعدادات</button>
    </div>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="avatar">👨‍💼</div>
        <span id="sidebarUserName" style="font-weight:700;">مدير</span>
      </div>
      <button class="btn btn-line btn-sm" id="logoutBtn">🚪 خروج</button>
    </div>
  </aside>

  <!-- CONTENT -->
  <div class="content">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">لوحة التحكم</h2>
        <div class="date-time"><span id="todayDate"></span> <span id="clockDisplay"></span></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-line btn-sm" id="themeToggle">🌙</button>
        <button class="btn btn-primary" id="quickAddBtn">➕ إضافة منتج</button>
      </div>
    </header>

    <main id="mainContent">
      <!-- سيتم حقن الصفحات ديناميكياً -->
    </main>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-wrap" id="genericModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="gModalTitle">عنوان</h3>
      <button class="btn btn-line btn-sm" data-close>✕</button>
    </div>
    <div class="modal-body" id="gModalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-line" data-close>إلغاء</button>
      <button class="btn btn-primary" id="gModalAction">حفظ</button>
    </div>
  </div>
</div>

<!-- ===== TOASTS ===== -->
<div class="toasts" id="toastContainer"></div>

<script>
  (function() {
    'use strict';

    // ============================================================
    // STORAGE
    // ============================================================
    var Storage = {
      get: function(key, fallback) {
        if (fallback === undefined) fallback = null;
        try { var raw = localStorage.getItem(key); return raw !== null ? JSON.parse(raw) : fallback; } catch(e) { return fallback; }
      },
      set: function(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
    };

    // ============================================================
    // SERVICES
    // ============================================================
    var Services = {};

    // ---- SETTINGS ----
    Services.Settings = {
      getDefaults: function() {
        return { shopName: 'مخزني Pro', currency: 'ج.م', taxRate: 14, defaultMinStock: 5, theme: 'dark', logo: '📦' };
      },
      get: function() {
        var saved = Storage.get('wm_settings', null);
        if (saved) {
          var def = this.getDefaults();
          for (var key in def) { if (saved[key] === undefined) saved[key] = def[key]; }
          return saved;
        }
        return this.getDefaults();
      },
      update: function(data) {
        var current = this.get();
        for (var key in data) current[key] = data[key];
        Storage.set('wm_settings', current);
        return current;
      }
    };

    // ---- AUTH ----
    Services.Auth = {
      getCredentials: function() {
        var creds = Storage.get('wm_credentials', null);
        if (!creds) {
          creds = { username: 'admin', password: btoa('admin123') };
          Storage.set('wm_credentials', creds);
        }
        return creds;
      },
      login: function(username, password) {
        var creds = this.getCredentials();
        return username === creds.username && btoa(password) === creds.password;
      },
      updateCredentials: function(username, password) {
        var newCreds = { username: username.trim(), password: btoa(password.trim()) };
        Storage.set('wm_credentials', newCreds);
        return newCreds;
      }
    };

        var totalStockValue = 0;
        for (var i = 0; i < products.length; i++) { totalStockValue += (products[i].purchasePrice || 0) * (products[i].quantity || 0); }
        var totalSales = 0;
        for (var j = 0; j < sales.length; j++) { totalSales += sales[j].total; }
        var lowStock = 0;
        for (var k = 0; k < products.length; k++) { if (Services.Product.getStatus(products[k]) !== 'ok') lowStock++; }
        return {
          products: products.length,
          suppliers: suppliers.length,
          totalStockValue: totalStockValue,
          totalSales: totalSales,
          lowStock: lowStock,
          invoices: sales.length
        };
      },
      getPaymentMethodDistribution: function() {
        var sales = Services.Sales.getAll();
        var map = {};
        for (var i = 0; i < sales.length; i++) {
          var method = sales[i].paymentMethod || 'cash';
          map[method] = (map[method] || 0) + sales[i].total;
        }
        var result = [];
        for (var key in map) result.push({ label: key, value: map[key] });
        return result;
      },
      getBestSuppliers: function() {
        var purchases = Services.Purchase.getAll();
        var received = [];
        for (var i = 0; i < purchases.length; i++) { if (purchases[i].status === 'received') received.push(purchases[i]); }
        var map = {};
        for (var j = 0; j < received.length; j++) {
          var p = received[j];
          var supplier = Services.Supplier.getById(p.supplierId);
          var name = supplier ? supplier.name : 'غير معروف';
          map[name] = (map[name] || 0) + (p.totalCost || 0);
        }
        var result = [];
        for (var key in map) result.push({ name: key, spent: map[key] });
        result.sort(function(a, b) { return b.spent - a.spent; });
        return result;

    // ---- AI ----
    Services.AI = {
      analyze: function() {
        var products = Services.Product.getAll();
        var ops = Storage.get('wm_operations', []);
        var sales = Services.Sales.getAll();
        var low = [];
        for (var i = 0; i < products.length; i++) { if (Services.Product.getStatus(products[i]) !== 'ok') low.push(products[i]); }
        var totalOut = 0;
        for (var j = 0; j < ops.length; j++) { if (ops[j].type === 'out') totalOut += ops[j].qty; }
        var avgDailySale = totalOut / Math.max(1, 30);
        var restock = [];
        for (var k = 0; k < low.length; k++) {
          var p = low[k];
          var daysToEmpty = avgDailySale > 0 ? Math.floor(p.quantity / avgDailySale) : 99;
          restock.push({ product: p, urgency: daysToEmpty < 3 ? 'عاجل' : 'متوسط', daysToEmpty: daysToEmpty });
        }
        var totalRevenue = 0;
        for (var l = 0; l < sales.length; l++) totalRevenue += sales[l].total;
        var totalProfit = 0;
        for (var m = 0; m < sales.length; m++) {
          var cost = 0;
          var items = sales[m].items || [];
          for (var n = 0; n < items.length; n++) cost += (items[n].cost || 0) * items[n].qty;
          totalProfit += (sales[m].total - cost);
        }
        return { restock: restock, totalRevenue: totalRevenue, totalProfit: totalProfit, totalSales: sales.length };
      }
    };

      addToCart: function(id) {
        var p = Services.Product.getById(id);
        if (!p || p.quantity <= 0) { UI.showToast('غير متوفر', 'error'); return; }
        var existing = null;
        for (var i = 0; i < cartItems.length; i++) { if (cartItems[i].id === id) { existing = cartItems[i]; break; } }
        if (existing) {
          if (existing.qty >= p.quantity) { UI.showToast('الكمية القصوى', 'warning'); return; }
          existing.qty++;
        } else { cartItems.push({ id: p.id, name: p.name, price: p.salePrice, qty: 1 }); }
        this.render();
      },
      removeFromCart: function(idx) { cartItems.splice(idx, 1); this.render(); },
      clearCart: function() { cartItems = []; this.render(); },
      checkout: function() {
        if (!cartItems.length) { UI.showToast('السلة فارغة', 'error'); return; }
        var customerId = document.getElementById('posCustomer').value;
        var paymentMethod = document.getElementById('posPayment').value;
        var discount = parseFloat(document.getElementById('posDiscount').value) || 0;
        var settings = Services.Settings.get();
        var total = 0;
        for (var i = 0; i < cartItems.length; i++) total += cartItems[i].price * cartItems[i].qty;
        var discountAmount = total * (discount / 100);
        total = total - discountAmount;
        var tax = total * (settings.taxRate || 0) / 100;
        var grandTotal = total + tax;
        var items = [];
        for (var j = 0; j < cartItems.length; j++) {
          var item = cartItems[j];
          var p = Services.Product.getById(item.id);
          if (p) {
            p.quantity -= item.qty;
            Services.Product.update(p.id, { quantity: p.quantity });
            var ops = Storage.get('wm_operations', []);
            ops.push({ id: uid(), productId: p.id, productName: p.name, type: 'out', qty: item.qty, note: 'بيع POS', createdAt: Date.now() });
            Storage.set('wm_operations', ops);
          }
          items.push({ id: item.id, name: item.name, qty: item.qty, price: item.price, cost: p ? p.purchasePrice : 0 });
        }
        var sale = Services.Sales.create({ customerId: customerId, items: items, total: grandTotal, discount: discountAmount, tax: tax, paymentMethod: paymentMethod, note: '' });
        cartItems = [];
        this.render();
        UI.showToast('✅ فاتورة ' + sale.number + ' - ' + grandTotal.toFixed(0) + ' ' + settings.currency);
        Controllers.Dashboard.render();
        // عرض الفاتورة
        Controllers.Invoices.show(sale.id);
      }
    };

        if (list) {
          var html = '';
          for (var i = 0; i < users.length; i++) {
            html += '<li style="display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid var(--lineSoft);"><span>' + users[i].username + ' (' + (users[i].role || 'كاشير') + ')</span><button class="btn btn-sm btn-danger" onclick="Controllers.Settings.deleteUser(\'' + users[i].username + '\')">✕</button></li>';
          }
          list.innerHTML = html;
        }
      },
      addUser: function() {
        var username = document.getElementById('newUsername2').value.trim();
        var pass = document.getElementById('newUserPass2').value.trim();
        if (!username || !pass) { UI.showToast('املأ الحقول', 'error'); return; }
        var users = Storage.get('wm_users', []);
        for (var i = 0; i < users.length; i++) { if (users[i].username === username) { UI.showToast('المستخدم موجود', 'error'); return; } }
        users.push({ username: username, password: btoa(pass), role: 'كاشير' });
        Storage.set('wm_users', users);
        this.renderUsers();
        UI.showToast('تمت الإضافة');
      },
      deleteUser: function(username) {
        var users = Storage.get('wm_users', []);
        var newList = [];
        for (var i = 0; i < users.length; i++) { if (users[i].username !== username) newList.push(users[i]); }
        Storage.set('wm_users', newList);
        this.renderUsers();
      }
    };

    // ============================================================
    // INIT
    // ============================================================
    function initApp() {
      var auth = Storage.get('wm_auth', null);
      if (!auth || !auth.loggedIn) {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appRoot').style.display = 'none';
        return;
      }
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appRoot').style.display = 'flex';

      var settings = Services.Settings.get();
      document.documentElement.setAttribute('data-theme', settings.theme || 'dark');
      document.getElementById('themeToggle').textContent = settings.theme === 'dark' ? '☀️' : '🌙';

      Controllers.Dashboard.render();

      var navBtns = document.querySelectorAll('.nav-item');
      for (var i = 0; i < navBtns.length; i++) {
        (function(btn) {
          btn.addEventListener('click', function() {
            var page = this.dataset.page;
            var map = {
              dashboard: Controllers.Dashboard,
              products: Controllers.Products,
              suppliers: Controllers.Suppliers,
              purchases: Controllers.Purchases,
              customers: Controllers.Customers,
              pos: Controllers.POS,
              reports: Controllers.Reports,
              ai: Controllers.AI,
              settings: Controllers.Settings
            };
            if (map[page]) map[page].render();
            else UI.showToast('صفحة قيد التطوير', 'warning');
          });
        })(navBtns[i]);
      }

      document.getElementById('quickAddBtn').addEventListener('click', function() { Controllers.Products.showAdd(); });

      document.getElementById('themeToggle').addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        Services.Settings.update({ theme: next });
        this.textContent = next === 'dark' ? '☀️' : '🌙';
      });

      document.getElementById('logoutBtn').addEventListener('click', function() {
        Storage.set('wm_auth', { loggedIn: false });
        location.reload();
      });

      var closeBtns = document.querySelectorAll('[data-close]');
      for (var j = 0; j < closeBtns.length; j++) {
        closeBtns[j].addEventListener('click', UI.closeModal);
      }
      document.getElementById('genericModal').addEventListener('click', function(e) {
        if (e.target === this) UI.closeModal();
      });

      function updateClock() {
        var now = new Date();
        document.getElementById('todayDate').textContent = now.toLocaleDateString('ar');
        document.getElementById('clockDisplay').textContent = now.toLocaleTimeString('ar');
      }
      updateClock();
      setInterval(updateClock, 1000);

      document.getElementById('loginBtn').addEventListener('click', function() {
        var username = document.getElementById('loginUsername').value.trim();
        var password = document.getElementById('loginPass').value.trim();
        if (Services.Auth.login(username, password)) {
          Storage.set('wm_auth', { loggedIn: true });
          location.reload();
        } else { UI.showToast('بيانات غير صحيحة', 'error'); }
      });
      document.getElementById('loginPass').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
      document.getElementById('loginUsername').addEventListener('keydown', function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

      // Seed
      if (Storage.get('wm_products', null) === null) {
        Services.Product.create({ name: 'ماوس لاسلكي', sku: 'MS-01', category: 'إلكترونيات', purchasePrice: 150, salePrice: 250, quantity: 50, minStock: 10 });
        Services.Product.create({ name: 'كيبورد ميكانيكي', sku: 'KB-01', category: 'إلكترونيات', purchasePrice: 400, salePrice: 650, quantity: 20, minStock: 5 });
        var sup = Services.Supplier.create('الشركة العالمية', 'أحمد', '0123456789');
        var prods = Services.Product.getAll();
        if (prods.length) {
          Services.Purchase.create({ supplierId: sup.id, items: [{ productId: prods[0].id, name: 'ماوس', qty: 100, price: 120 }], totalCost: 12000, status: 'received' });
        }
        UI.showToast('✅ تم تهيئة البيانات الافتراضية');
      }

      window.Controllers = Controllers;
      UI.showToast('🚀 مرحباً بك في النظام الاحترافي');
    }

    document.addEventListener('DOMContentLoaded', initApp);
  })();
</script>
</body>
</html>
