<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MINA KING • CRM</title>
    <meta name="theme-color" content="#080c14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MINA KING">
    <link rel="manifest" href="manifest.webmanifest">
    <!-- خط فخم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"
            }
        }
    </script>
    <style>
        /* ========================================================== */
        /* ROOT & RESET (تصميم ملكي فاخر) */
        /* ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg-primary: #080c14;
            --bg-surface: #111b2e;
            --bg-surface-light: #1a2844;
            --bg-elevated: #1f3152;
            --text-primary: #f0f4ff;
            --text-secondary: #b0c4de;
            --text-muted: #6b7f9b;
            --border-subtle: #233a5c;
            --color-gold: #f6b83d;
            --color-gold-dim: #7a5d1e;
            --color-emerald: #10b981;
            --color-emerald-dim: #065f46;
            --color-purple: #8b5cf6;
            --color-purple-dim: #4c1d95;
            --color-blue: #3b82f6;
            --color-red: #ef4444;
            --shadow-glow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-glass: 0 4px 30px rgba(0, 0, 0, 0.3);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-size: 15px;
            line-height: 1.6;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            /* مساحة للشريط السفلي */
            transition: background 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* الوضع الفاتح (اختياري لكنه يبقى فخم) */
        body.light {
            --bg-primary: #f0f4ff;
            --bg-surface: #ffffff;
            --bg-surface-light: #f8faff;
            --bg-elevated: #eef2f9;
            --text-primary: #0a1a33;
            --text-secondary: #2a3f5e;
            --text-muted: #7a8ba3;
            --border-subtle: #dce3ef;
            --shadow-glow: 0 8px 32px rgba(0, 20, 50, 0.1);
            --shadow-glass: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-purple);
            border-radius: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* ========================================================== */
        /* LOGIN (بوابة دخول فاخرة) */
        /* ========================================================== */
        #loginScreen {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at top right, #1a0b2e, #080c14);
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 40px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-glow);
            backdrop-filter: blur(10px);
        }
        .login-logo {
            font-size: 36px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, var(--color-gold), var(--color-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            letter-spacing: -1px;
        }
        .login-sub {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 600;
        }
        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }
        .field input {
            width: 100%;
            min-width: 0;
            padding: 15px 18px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: 0.3s;
            outline: none;
        }
        .field input:focus {
            border-color: var(--color-purple);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 15px;
            border: 0;
            background: linear-gradient(135deg, var(--color-purple), var(--color-blue));
            color: #fff;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
            width: 100%;
            letter-spacing: 0.5px;
        }
        .btn:active {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: var(--bg-surface-light);
            color: var(--text-primary);
            box-shadow: none;
            border: 1px solid var(--border-subtle);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--color-gold), #d97706);
            box-shadow: 0 6px 20px rgba(246, 184, 61, 0.3);
        }
        .btn-emerald {
            background: linear-gradient(135deg, var(--color-emerald), #047857);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }
        .btn-red {
            background: linear-gradient(135deg, var(--color-red), #b91c1c);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
            border-radius: 40px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            box-shadow: none;
        }

        /* ========================================================== */
        /* APP SHELL (تطبيق فاخر) */
        /* ========================================================== */
        #app {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 16px 16px calc(80px + env(safe-area-inset-bottom));
            position: relative;
        }

        /* الشريط العلوي (زجاجي) */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(17, 27, 46, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 60px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-glass);
        }
        body.light .topbar {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(0, 0, 0, 0.05);
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-gold), var(--color-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .user-info {
            line-height: 1.2;
        }
        .user-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-primary);
        }
        .user-role {
            font-size: 11px;
            color: var(--color-gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-secondary);
            transition: 0.2s;
            position: relative;
        }
        body.light .icon-btn {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
        }
        .icon-btn:active {
            transform: scale(0.90);
        }
        .badge-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--color-red);
            color: #fff;
            font-size: 10px;
            font-weight: 900;
            min-width: 20px;
            height: 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.5);
        }

        /* الشريط السفلي (زجاجي فاخر) */
        .bottom-nav {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(17, 27, 46, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            display: flex;
            justify-content: space-around;
            padding: 6px 6px;
            z-index: 50;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        body.light .bottom-nav {
            background: rgba(255, 255, 255, 0.8);
            border-color: rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-muted);
            background: none;
            border: 0;
            padding: 6px 12px;
            border-radius: 40px;
            transition: all 0.2s;
            min-width: 50px;
        }
        .nav-item .nav-icon {
            font-size: 22px;
            line-height: 1.2;
        }
        .nav-item.active {
            color: var(--color-gold);
            background: rgba(246, 184, 61, 0.1);
        }
        body.light .nav-item.active {
            background: rgba(139, 92, 246, 0.08);
            color: var(--color-purple);
        }

        /* ========================================================== */
        /* CARDS & CONTENT (فخامة) */
        /* ========================================================== */
        .page-title {
            font-size: 26px;
            font-weight: 900;
            margin: 6px 0 8px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light .page-title {
            background: linear-gradient(135deg, #0a1a33, var(--color-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-sub {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 18px 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-glow);
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.99);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .card-title {
            font-weight: 800;
            font-size: 17px;
            color: var(--text-primary);
        }
        .card-title span {
            color: var(--color-gold);
        }

        /* شبكة الإحصائيات الضخمة */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-item {
            background: var(--bg-surface-light);
            border-radius: var(--radius-md);
            padding: 18px 14px;
            text-align: center;
            border: 1px solid var(--border-subtle);
            position: relative;
            overflow: hidden;
        }
        .stat-item::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.05), transparent);
            pointer-events: none;
        }
        .stat-number {
            font-size: 30px;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1.2;
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* الجداول */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            margin-top: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 480px;
        }
        th {
            text-align: right;
            padding: 12px 12px;
            background: var(--bg-primary);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-subtle);
        }
        td {
            padding: 12px 12px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-secondary);
        }
        tr:last-child td {
            border-bottom: 0;
        }

        /* البادجات الفاخرة */
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.3px;
            background: var(--bg-surface-light);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .badge-gold {
            background: var(--color-gold-dim);
            color: var(--color-gold);
            border-color: var(--color-gold);
        }
        .badge-purple {
            background: var(--color-purple-dim);
            color: var(--color-purple);
            border-color: var(--color-purple);
        }
        .badge-emerald {
            background: var(--color-emerald-dim);
            color: var(--color-emerald);
            border-color: var(--color-emerald);
        }
        .badge-red {
            background: #4c1d1d;
            color: var(--color-red);
            border-color: var(--color-red);
        }
        .badge-blue {
            background: #1a2a5c;
            color: var(--color-blue);
            border-color: var(--color-blue);
        }

        body.light .badge {
            background: var(--bg-primary);
        }
        body.light .badge-gold {
            background: #fef3c7;
            color: #b45309;
            border-color: #f59e0b;
        }
        body.light .badge-purple {
            background: #ede9fe;
            color: #6d28d9;
            border-color: #7c3aed;
        }
        body.light .badge-emerald {
            background: #d1fae5;
            color: #047857;
            border-color: #10b981;
        }
        body.light .badge-red {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #ef4444;
        }
        body.light .badge-blue {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #3b82f6;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .empty-state {
            padding: 30px 10px;
            text-align: center;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* ========================================================== */
        /* MODAL (فاخر) */
        /* ========================================================== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 28px 24px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            animation: modalFade 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-glow);
        }
        @keyframes modalFade {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-primary);
        }
        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            background: transparent;
            color: var(--text-secondary);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========================================================== */
        /* TOAST فاخر */
        /* ========================================================== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-glow);
            white-space: nowrap;
            max-width: 90%;
            backdrop-filter: blur(10px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========================================================== */
        /* INPUTS داخل المودال */
        /* ========================================================== */
        .field select,
        .field textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .field textarea {
            min-height: 80px;
            resize: vertical;
        }
        .field select:focus,
        .field textarea:focus {
            border-color: var(--color-purple);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }
        .field select option {
            background: var(--bg-surface);
        }


        /* ==========================================================
           NATIVE APP UI — MOBILE / TABLET
           ========================================================== */
        html {
            background: var(--bg-primary);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            overflow-x: hidden;
            overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }

        button, input, select, textarea {
            font: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        button { cursor: pointer; touch-action: manipulation; }

        #app {
            width: 100%;
            max-width: 1180px;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 18px 22px calc(110px + env(safe-area-inset-bottom));
        }

        .topbar {
            position: sticky;
            top: max(10px, env(safe-area-inset-top));
            z-index: 40;
            min-height: 62px;
            margin-bottom: 22px;
            padding: 8px 12px;
            border-radius: 22px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            min-width: 42px;
            border-radius: 14px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface-light);
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform .18s ease, background .18s ease;
        }

        .icon-btn:active { transform: scale(.94); }

        .page-title {
            margin: 4px 2px 18px;
            font-size: clamp(22px, 3vw, 32px);
            line-height: 1.2;
            letter-spacing: -.4px;
        }

        .card {
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            border-radius: 16px;
        }

        table { min-width: 720px; }

        .bottom-nav {
            position: fixed;
            z-index: 90;
            left: 50%;

    <!-- ========================================================== -->

    <script type="module">
        // ============================================================
        // IMPORTS & CONFIG
        // ============================================================
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "firebase/auth";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc, query, where, serverTimestamp, onSnapshot, orderBy } from "firebase/firestore";

        const firebaseConfig = {
            apiKey: "AIzaSyDsJXNa6EYenn2f5mfoNQVEDxHhCH-XGAo",
            authDomain: "alzahady-6e615.firebaseapp.com",
            databaseURL: "https://alzahady-6e615-default-rtdb.firebaseio.com",
            projectId: "alzahady-6e615",
            storageBucket: "alzahady-6e615.firebasestorage.app",
            messagingSenderId: "377804257010",
            appId: "1:377804257010:web:9516e9ecbbc8b22ab0c26b",
            measurementId: "G-4XPCD5L40F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const secondaryApp = initializeApp(firebaseConfig, "secondary");
        const secondaryAuth = getAuth(secondaryApp);

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentUserData = null;
        let currentRole = 'member';
        let activeView = 'dashboard';
        let charts = {};
        let usersList = [];
        let notifUnsubscribe = null;
        let soundEnabled = true;
        let audioCtx = null;

        const $ = (id) => document.getElementById(id);
        const content = $('content');

        // ============================================================
        // HELPERS
        // ============================================================
        function esc(str) { return String(str ?? '').replace(/[&<>"]/g, function(m) { if (m === '&') return '&amp;'; if (m ===
                    '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m; }); }

        function money(val) { return Number(val || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD',
                maximumFractionDigits: 0 }); }

        function formatDate(ts) {
            if (!ts) return '-';
            try { const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString('ar-EG', { hour: '2-digit',
                    minute: '2-digit' }); } catch { return '-'; }
        }

        function toast(msg, icon = '✅') {
            const el = $('toast');
            el.innerHTML = `${icon} ${msg}`;
            el.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showModal(title, html) {
            $('modalTitle').textContent = title;
            $('modalBody').innerHTML = html;
            $('modal').classList.add('show');
        }

        function closeModal() {
            $('modal').classList.remove('show');
        }
        window.closeModal = closeModal;
        $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

        function statusBadge(status) {
            const map = {
                new: ['جديد', 'badge-blue'],
                contacted: ['تم التواصل', 'badge-gold'],
                qualified: ['مؤهل', 'badge-purple'],
                negotiation: ['تفاوض', 'badge-gold'],
                won: ['مربوحة', 'badge-emerald'],
                lost: ['خاسرة', 'badge-red'],
                pending: ['معلقة', 'badge-gold'],
                approved: ['معتمدة', 'badge-blue'],
                paid: ['مدفوعة', 'badge-emerald'],
                active: ['نشط', 'badge-emerald'],
                inactive: ['متوقف', 'badge-red'],
                todo: ['جديدة', 'badge-blue'],
                doing: ['قيد التنفيذ', 'badge-gold'],
                done: ['مكتملة', 'badge-emerald']
            };
            const x = map[status] || [status || 'غير محدد', 'badge-blue'];
            return `<span class="badge ${x[1]}">${esc(x[0])}</span>`;
        }

        function filterTable(tableId, value) {
            const tbl = document.getElementById(tableId);
            if (!tbl) return;
            const rows = tbl.querySelectorAll('tbody tr');
            const v = value.toLowerCase();
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(v) ? '' : 'none';
            });
        }
        window.filterTable = filterTable;

        // ============================================================
        // NOTIFICATION SOUND (فاخر بصوتين)
        // ============================================================
        function playNotificationSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                // نغمة ذهبية
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.value = 987.77;
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.25);

                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.value = 1318.51;
                gain2.gain.setValueAtTime(0.15, now + 0.1);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.1);
                osc2.stop(now + 0.4);

                if (navigator.vibrate) navigator.vibrate(50);
            } catch (e) { /* ignore */ }
        }

        // ============================================================
        // NOTIFICATIONS SYSTEM
        // ============================================================
        async function createNotification(userId, title, body, link = '#') {
            if (!userId) return;
            try {
                await addDoc(collection(db, 'notifications'), {
                    userId,
                    title,
                    body,
                    link,
                    read: false,
                    createdAt: serverTimestamp()
                });
            } catch (e) { console.warn('Notif error', e); }
        }

        async function markNotifRead(id) {
            await updateDoc(doc(db, 'notifications', id), { read: true });
            if (activeView === 'notifications') renderNotifications();
            updateNotifBadge();
        }

        async function markAllRead(userId) {
            const q = query(collection(db, 'notifications'), where('userId', '==', userId), where('read', '==', false));
            const snap = await getDocs(q);
            await Promise.all(snap.docs.map(d => updateDoc(doc(db, 'notifications', d.id), { read: true })));
            toast('تم تحديد الكل كمقروء', '👑');
            if (activeView === 'notifications') renderNotifications();
            updateNotifBadge();
        }

        async function updateNotifBadge() {
            if (!currentUser) return;
            const q = query(collection(db, 'notifications'), where('userId', '==', currentUser.uid), where('read', '==',
                false));
            const snap = await getDocs(q);
            const count = snap.size;
            const badge = $('notifBadge');
            if (count > 0) {
                badge.textContent = count > 9 ? '9+' : count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function listenNotifications() {
            if (notifUnsubscribe) notifUnsubscribe();
            if (!currentUser) return;
            const q = query(collection(db, 'notifications'), where('userId', '==', currentUser.uid));
            let lastCount = null;
            notifUnsubscribe = onSnapshot(q, (snapshot) => {
                let unread = 0;
                snapshot.forEach(d => { if (!d.data().read) unread++; });
                // لا تشغّل الصوت عند أول تحميل؛ فقط عند وصول إشعار جديد.
                if (lastCount !== null && unread > lastCount) playNotificationSound();
                lastCount = unread;
                updateNotifBadge();
            }, (error) => {
                console.warn('Notification listener error:', error);
            });
        }

        // ============================================================
        // AUTH
        // ============================================================
        $('loginBtn').addEventListener('click', login);
        $('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

        let loginBusy = false;

        async function login() {
            if (loginBusy) return;
            const email = $('loginEmail').value.trim();
            const pass = $('loginPassword').value;
            $('loginError').textContent = '';
            if (!email || !pass) { $('loginError').textContent = 'املأ البريد وكلمة المرور'; return; }
            loginBusy = true;
            const btn = $('loginBtn');
            const oldText = btn.textContent;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                // نحافظ على رسالة بسيطة للمستخدم، مع تسجيل السبب للمطور.
                console.warn('Login error:', e);
                $('loginError').textContent = 'بيانات غير صحيحة';
            } finally {
                loginBusy = false;
                btn.disabled = false;
                btn.style.opacity = '';
                btn.textContent = oldText;
            }
        }

        window.logout = async function() {
            if (notifUnsubscribe) notifUnsubscribe();
            await signOut(auth);
        };

        onAuthStateChanged(auth, async user => {
            if (!user) {
                $('loginScreen').classList.remove('hidden');
                $('app').classList.add('hidden');
                currentUser = null;
                return;
            }
            currentUser = user;
            try {
                let snap = await getDoc(doc(db, 'users', user.uid));

                // الحسابات القديمة قد يكون Document ID لها تلقائيًا،
                // لذلك نبحث أيضًا باستخدام حقل uid المخزن داخل الوثيقة.
                if (!snap.exists()) {
                    const userQuery = query(
                        collection(db, 'users'),
                        where('uid', '==', user.uid)
                    );
                    const userSnap = await getDocs(userQuery);
                    if (!userSnap.empty) {
                        snap = userSnap.docs[0];
                    }
                }

                if (!snap.exists()) {
                    toast('الحساب غير مسجل في بيانات النظام');
                    await signOut(auth);
                    return;
                }

                currentUserData = snap.data();
                currentUserData._docId = snap.id;
            } catch (e) {
                console.error('User profile load error:', e);
                toast('تعذر تحميل بيانات الحساب', '⚠️');
                await signOut(auth);
                return;
            }
            currentRole = currentUserData.role || 'member';
            $('topName').textContent = currentUserData.name || user.displayName || user.email;
            const roleMap = { admin: 'مدير', manager: 'مدير فريق', member: 'مندوب', client: 'عميل' };
            $('topRole').textContent = roleMap[currentRole] || currentRole.toUpperCase();
            $('topAvatar').textContent = (currentUserData.name || user.email || 'M')[0].toUpperCase();

            // Fetch users list
            const uSnap = await getDocs(collection(db, 'users'));
            usersList = [];
            uSnap.forEach(d => {
                const u = d.data();
                if (u.uid) usersList.push({ uid: u.uid, name: u.name || u.email, email: u.email });
            });

            $('loginScreen').classList.add('hidden');
            $('app').classList.remove('hidden');
            buildBottomNav();
            listenNotifications();
            await navigate('dashboard');
        });

        async function refreshUsersList() {
            const uSnap = await getDocs(collection(db, 'users'));
            usersList = [];
            uSnap.forEach(d => {
                const u = d.data();
                if (u.uid) usersList.push({ uid: u.uid, name: u.name || u.email, email: u.email });
            });
            return usersList;
        }

        function activityLabel(action, entity) {
            const map = {
                create: 'أضاف', update: 'عدّل', delete: 'حذف', approve: 'اعتمد',
                pay: 'سجّل دفع', login: 'سجّل دخول', logout: 'سجّل خروج'
            };
            const entities = {
                lead: 'Lead', client: 'عميل', deal: 'صفقة', project: 'مشروع',
                user: 'عضو', commission: 'عمولة', task: 'مهمة'
            };
            return `${map[action] || action} ${entities[entity] || entity}`;
        }

        function activityDateValue(ts) {
            if (!ts) return 0;
            if (typeof ts.toMillis === 'function') return ts.toMillis();
            if (typeof ts.toDate === 'function') return ts.toDate().getTime();
            if (ts instanceof Date) return ts.getTime();
            return Number(ts) || 0;
        }

        async function renderDashboard() {
            if (currentRole === 'client') {
                const q = query(collection(db, 'deals'), where('clientName', '==', currentUserData?.name || currentUser
                .email));
                const snap = await getDocs(q);
                let total = 0,
                    count = 0;
                snap.forEach(d => { total += Number(d.data().finalPrice || 0);
                    count++; });
                content.innerHTML = `
                    <div class="page-title">مرحباً ${esc(currentUserData?.name || 'عميلنا')} 👋</div>
                    <div class="stats-grid">
                        <div class="stat-item"><div class="stat-number">${count}</div><div class="stat-label">الطلبات</div></div>
                        <div class="stat-item"><div class="stat-number">${money(total)}</div><div class="stat-label">المشتريات</div></div>
                    </div>
                `;
                return;
            }

            const [usersSnap, leadsSnap, clientsSnap, dealsSnap, commSnap] = await Promise.all([
                getDocs(collection(db, 'users')),
                getDocs(collection(db, 'leads')),
                getDocs(collection(db, 'clients')),
                getDocs(collection(db, 'deals')),
                getDocs(collection(db, 'commissions'))
            ]);

            let revenue = 0,
                commissions = 0,
                won = 0;
            const perf = {};
            dealsSnap.forEach(d => {
                const x = d.data();
                if (x.status === 'won') {
                    won++;
                    const amt = Number(x.finalPrice || 0);
                    revenue += amt;
                    const m = x.createdByName || x.memberName || 'غير معين';
                    perf[m] = (perf[m] || 0) + amt;
                }
            });
            commSnap.forEach(d => { commissions += Number(d.data().amount || 0); });

            let rankHtml = '';
            const sorted = Object.entries(perf).sort((a, b) => b[1] - a[1]);
            if (sorted.length === 0) rankHtml =
                `<div class="empty-state">لا توجد مبيعات بعد</div>`;
            else {
                rankHtml = `<div class="table-wrap"><table><thead><tr><th>المندوب</th><th>المبيعات</th></tr></thead><tbody>
                    ${sorted.map(([name, total]) => `<tr><td><strong>${esc(name)}</strong></td><td style="color:var(--color-gold);font-weight:800;">${money(total)}</td></tr>`).join('')}
                </tbody></table></div>`;
            }

            const isAdmin = (currentRole === 'admin' || currentRole === 'manager');

            content.innerHTML = `
                <div class="page-title">مرحباً ${esc(currentUserData?.name || 'بك')} 👑</div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-number">${clientsSnap.size}</div><div class="stat-label">العملاء</div></div>
                    <div class="stat-item"><div class="stat-number">${leadsSnap.size}</div><div class="stat-label">Leads</div></div>
                    <div class="stat-item"><div class="stat-number" style="color:var(--color-emerald);">${money(revenue)}</div><div class="stat-label">المبيعات</div></div>
                    <div class="stat-item"><div class="stat-number" style="color:var(--color-gold);">${money(commissions)}</div><div class="stat-label">العمولات</div></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">🏆 <span>ترتيب</span> المندوبين</span></div>
                    ${rankHtml}
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">📈 أداء <span>المبيعات</span></span> <span class="badge badge-emerald">${won} صفقة</span></div>
                    <div style="height:200px;"><canvas id="salesChart"></canvas></div>
                </div>

                <div class="card">
                    <div class="card-header"><span class="card-title">⚡ إجراءات <span>سريعة</span></span></div>
                    <div style="display:flex;flex-wrap:wrap;gap:8px;">
                        <button class="btn btn-small" onclick="openLeadModal()">🔥 Lead</button>
                        <button class="btn btn-small btn-secondary" onclick="openClientModal()">🤝 عميل</button>
                        <button class="btn btn-small btn-secondary" onclick="openDealModal()">💎 صفقة</button>
                        ${isAdmin ? `<button class="btn btn-small btn-secondary" onclick="openTaskModal()">📋 مهمة</button>` : ''}
                        ${isAdmin ? `<button class="btn btn-small btn-secondary" onclick="openProjectModal()">📦 مشروع</button>` : ''}
                    </div>
                </div>
            `;

            setTimeout(() => {
                const ctx = document.getElementById('salesChart')?.getContext('2d');
                if (ctx) {
                    if (charts.sales) charts.sales.destroy();
                    charts.sales = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو'],
                            datasets: [{ label: 'المبيعات', data: [12000, 18500, 15000, 27000, 23000, revenue],
                                backgroundColor: '#8b5cf6', borderRadius: 12 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                }
            }, 100);
        }

        window.saveLead = async function(id) {

                phone: $('leadPhone').value.trim(),
                source: $('leadSource').value,
                status: $('leadStatus').value,
                assignedTo: currentUser.uid,

            };

            try {
                if (id) {

                    data.updatedByName = currentUserData?.name || currentUser.email || '';

                    delete data.assignedTo;

                    await updateDoc(doc(db, 'leads', id), data);
                    await logActivity('update', 'lead', id, { name: data.name, status: data.status });
                } else {
                    data.createdAt = serverTimestamp();
                    data.createdById = currentUser.uid;
                    data.createdByName = currentUserData?.name || currentUser.email || '';
                    data.createdByEmail = currentUser.email || '';
                    const ref = await addDoc(collection(db, 'leads'), data);

        // ============================================================
        // REPORTS — تقارير الإدارة والمندوبين
        // ============================================================
        async function renderReports(period = 'all') {
            if (currentRole !== 'admin' && currentRole !== 'manager') {
                content.innerHTML = `<div class="card"><div class="empty-state">⛔ التقارير متاحة للإدارة فقط</div></div>`;
                return;
            }

            const [dealsSnap, clientsSnap, leadsSnap, usersSnap] = await Promise.all([
                getDocs(collection(db, 'deals')),
                getDocs(collection(db, 'clients')),
                getDocs(collection(db, 'leads')),
                getDocs(collection(db, 'users'))
            ]);

            const now = Date.now();
            const periodMs = {
                today: 86400000,
                week: 7 * 86400000,
                month: 30 * 86400000,
                year: 365 * 86400000
            }[period] || Infinity;
            const inPeriod = x => period === 'all' || (now - activityDateValue(x.createdAt) <= periodMs);

            const reps = {};
            usersSnap.forEach(d => {
                const u = d.data();
                if (u.uid) reps[u.uid] = { name: u.name || u.email || 'بدون اسم', email: u.email || '', deals: 0, sales: 0, commissions: 0, clients: 0, leads: 0 };
            });

            let won = 0, sales = 0, commissions = 0, clients = 0, leads = 0, allDeals = 0;
            dealsSnap.forEach(d => {
                const x = d.data();
                if (!inPeriod(x)) return;
                allDeals++;
                const uid = x.createdById || x.memberId || '';
                const name = x.createdByName || x.memberName || 'غير معروف';
                if (!reps[uid]) reps[uid] = { name, email: '', deals: 0, sales: 0, commissions: 0, clients: 0, leads: 0 };
                reps[uid].deals++;
                if (x.status === 'won') {
                    won++;
                    const amount = Number(x.finalPrice || 0);
                    const comm = Number(x.commissionAmount || 0);
                    sales += amount;
                    commissions += comm;
                    reps[uid].sales += amount;
                    reps[uid].commissions += comm;
                }
            });

            clientsSnap.forEach(d => {
                const x = d.data();
                if (!inPeriod(x)) return;
                clients++;
                const uid = x.createdById || x.memberId || '';
                const name = x.createdByName || x.memberName || 'غير معروف';
                if (!reps[uid]) reps[uid] = { name, email: '', deals: 0, sales: 0, commissions: 0, clients: 0, leads: 0 };
                reps[uid].clients++;
            });

            leadsSnap.forEach(d => {
                const x = d.data();
                if (!inPeriod(x)) return;
                leads++;
                const uid = x.createdById || x.assignedTo || '';
                const name = x.createdByName || x.assignedName || 'غير معروف';
                if (!reps[uid]) reps[uid] = { name, email: '', deals: 0, sales: 0, commissions: 0, clients: 0, leads: 0 };
                reps[uid].leads++;
            });

            const conversion = leads ? ((won / leads) * 100).toFixed(1) : '0.0';
            const avgDeal = won ? sales / won : 0;
            const sorted = Object.values(reps).sort((a,b) => b.sales - a.sales);
            const periodLabel = { all:'كل الوقت', today:'اليوم', week:'آخر 7 أيام', month:'آخر 30 يوم', year:'آخر سنة' }[period] || 'كل الوقت';

            const rows = sorted.map((r, i) => `<tr>
                <td>${i + 1}</td>
                <td><strong>${esc(r.name)}</strong></td>
                <td>${r.leads}</td>
                <td>${r.clients}</td>
                <td>${r.deals}</td>
                <td style="color:var(--color-emerald);font-weight:800;">${money(r.sales)}</td>
                <td style="color:var(--color-gold);font-weight:800;">${money(r.commissions)}</td>
            </tr>`).join('');

            content.innerHTML = `
                <div class="page-title">📊 التقارير</div>
                <div class="card">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
                        <div><strong>تقرير أداء الفريق</strong><div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${periodLabel}</div></div>
                        <select onchange="renderReports(this.value)" style="min-width:145px;padding:10px 12px;border-radius:12px;border:1px solid var(--border-subtle);background:var(--bg-primary);color:var(--text-primary);">
                            <option value="all" ${period==='all'?'selected':''}>كل الوقت</option>
                            <option value="today" ${period==='today'?'selected':''}>اليوم</option>
                            <option value="week" ${period==='week'?'selected':''}>آخر 7 أيام</option>
                            <option value="month" ${period==='month'?'selected':''}>آخر 30 يوم</option>
                            <option value="year" ${period==='year'?'selected':''}>آخر سنة</option>
                        </select>
                    </div>
                </div>
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-number">${won}</div><div class="stat-label">صفقات مربوحة</div></div>
                    <div class="stat-item"><div class="stat-number">${money(sales)}</div><div class="stat-label">إجمالي المبيعات</div></div>
                    <div class="stat-item"><div class="stat-number">${money(avgDeal)}</div><div class="stat-label">متوسط الصفقة</div></div>
                    <div class="stat-item"><div class="stat-number">${conversion}%</div><div class="stat-label">نسبة التحويل</div></div>
                    <div class="stat-item"><div class="stat-number">${clients}</div><div class="stat-label">عملاء مضافون</div></div>
                    <div class="stat-item"><div class="stat-number">${leads}</div><div class="stat-label">Leads</div></div>
                </div>
                <div class="card">
                    <div style="font-weight:800;margin-bottom:12px;">🏆 أداء المندوبين</div>
                    <div class="table-wrap"><table><thead><tr><th>#</th><th>المندوب</th><th>Leads</th><th>عملاء</th><th>صفقات</th><th>المبيعات</th><th>العمولة</th></tr></thead><tbody>${rows || '<tr><td colspan="7"><div class="empty-state">لا توجد بيانات في الفترة المحددة</div></td></tr>'}</tbody></table></div>
                </div>
            `;
        }

                        `<div class="actions"><button class="btn btn-small btn-secondary" onclick="editTask('${d.id}')">✏️</button><button class="btn btn-small btn-red" onclick="deleteTask('${d.id}')">🗑</button></div>`;
                } else {
                    const st = x.status || 'todo';
                    if (st === 'todo') act =
                        `<button class="btn btn-small btn-gold" onclick="updateTaskStatus('${d.id}','doing')">⏳ بدء</button>`;
                    else if (st === 'doing') act =
                        `<button class="btn btn-small btn-emerald" onclick="updateTaskStatus('${d.id}','done')">✅ إنهاء</button>`;
                    else act = `<span class="badge badge-emerald">مكتملة</span>`;
                }
                const assignedName = usersList.find(u => u.uid === x.assignedToId)?.name || x.assignedTo || '-';
                const due = x.dueDate ? new Date(x.dueDate) : null;
                const overdue = due && !['done'].includes(x.status||'') && due.getTime() < Date.now();
                rows +=
                    `<tr><td><strong>${esc(x.title)}</strong></td><td>${esc(assignedName)}</td><td>${statusBadge(x.status)}</td><td><span class="badge ${x.priority==='high'?'badge-red':'badge-gold'}">${esc(x.priority||'medium')}</span></td><td class="${overdue?'due-overdue':''}">${due ? due.toLocaleString('ar-EG') : '-'}</td><td>${act}</td></tr>`;
            });
            content.innerHTML = `
                <div class="page-title">📋 المهام</div>
                <div class="card">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                        ${isAdmin ? `<button class="btn btn-small btn-gold" onclick="openTaskModal()">+ مهمة</button>` : ''}
                    </div>
                    <div class="table-wrap"><table><thead><tr><th>المهمة</th><th>المسؤول</th><th>الحالة</th><th>الأولوية</th><th>التسليم</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6"><div class="empty-state">لا توجد مهام</div></td></tr>'}</tbody></table></div>
                </div>
            `;
        }

        window.updateTaskStatus = async function(id, newStatus) {
            try {
                const ref = doc(db, 'tasks', id);
                await updateDoc(ref, { status: newStatus });
                const snap = await getDoc(ref);
                const data = snap.data();
                if (newStatus === 'done') {
                    const admins = await getDocs(query(collection(db, 'users'), where('role', 'in', ['admin', 'manager'])));
                    admins.forEach(a => {
                        createNotification(a.data().uid, '✅ مهمة مكتملة',
                            `${currentUserData?.name || 'عضو'} أنهى مهمة: ${data.title}`, '#tasks');
                    });
                }
                toast('تم تحديث الحالة');
                renderTasks();
            } catch (e) { toast('خطأ: ' + e.message); }
        };

        window.openTaskModal = function(id = null, data = {}) {
            let opts = '<option value="">-- اختر عضو --</option>';
            usersList.forEach(u => {
                const sel = (u.uid === data.assignedToId) ? 'selected' : '';
                opts += `<option value="${u.uid}" ${sel}>${esc(u.name)}</option>`;
            });

            showModal(id ? 'تعديل مهمة' : 'مهمة جديدة', `
                <div class="field"><label>عنوان المهمة</label><input id="taskTitle" value="${esc(data.title)}"></div>
                <div class="field"><label>المسؤول</label><select id="taskAssignedId">${opts}</select></div>
                <div class="field"><label>الحالة</label><select id="taskStatus"><option value="todo">جديدة</option><option value="doing">قيد التنفيذ</option><option value="done">مكتملة</option></select></div>
                <div class="field"><label>الأولوية</label><select id="taskPriority"><option value="low">منخفضة</option><option value="medium" selected>متوسطة</option><option value="high">عالية</option></select></div>
                 <div class="field"><label>موعد التسليم</label><input id="taskDueDate" type="datetime-local" value="${esc(data.dueDate||'')}"></div>
                <button class="btn" onclick="saveTask('${id||''}')">💾 حفظ</button>
            `);
        };

        window.saveTask = async function(id) {
            const title = $('taskTitle').value.trim();
            const assignedToId = $('taskAssignedId').value;
            const status = $('taskStatus').value;
            const priority = $('taskPriority').value;
            const dueDate = $('taskDueDate').value || '';
            if (!title) { toast('عنوان المهمة مطلوب'); return; }
            if (!assignedToId) { toast('اختر عضو مسؤول'); return; }

            const assignedUser = usersList.find(u => u.uid === assignedToId);
            const data = {
                title,
                assignedToId,
                assignedTo: assignedUser?.name || '',
                status,
                priority,
                dueDate,
                createdBy: currentUser.uid,
                createdByName: currentUserData?.name || currentUser.email || '' 
            };

            try {
                if (id) {
                    await updateDoc(doc(db, 'tasks', id), data);
                    await logActivity('update', 'task', id, { title, assignedTo: assignedUser?.name || '', dueDate });
                    toast('تم تحديث المهمة');
                } else {
                    data.createdAt = serverTimestamp();
                    const ref = await addDoc(collection(db, 'tasks'), data);
                    await logActivity('create', 'task', ref.id, { title, assignedTo: assignedUser?.name || '', dueDate });
                    toast('تم إضافة المهمة');
                    await createNotification(assignedToId, '📋 مهمة جديدة',
                        `تم تعيين مهمة "${title}" لك من قبل ${currentUserData?.name || 'الإدارة'}`, '#tasks');
                }
                closeModal();
                renderTasks();
            } catch (e) { toast('خطأ: ' + e.message); }
        };
        window.editTask = async function(id) { const s = await getDoc(doc(db, 'tasks', id)); if (s.exists()) openTaskModal(
                id, s.data()); };
        window.deleteTask = async function(id) { if (!confirm('حذف؟')) return; await deleteDoc(doc(db, 'tasks', id));
            await logActivity('delete', 'task', id);
            toast('تم الحذف');
            renderTasks(); };

        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        async function renderNotifications() {
            if (!currentUser) return;
            const q = query(collection(db, 'notifications'), where('userId', '==', currentUser.uid), orderBy('createdAt',
                'desc'));
            const snap = await getDocs(q);
            let items = '';
            if (snap.empty) {
                items = `<div class="empty-state">🔕 لا توجد إشعارات</div>`;
            } else {
                snap.forEach(d => {
                    const n = d.data();
                    const cls = n.read ? '' : 'unread';
                    items += `
                        <div class="card" style="border-right:4px solid ${n.read ? 'var(--border-subtle)' : 'var(--color-gold)'}; margin-bottom:8px; cursor:pointer;" onclick="markNotifRead('${d.id}')">
                            <div style="display:flex;justify-content:space-between;">
                                <strong style="color:var(--text-primary);">${esc(n.title)}</strong>
                                <span style="font-size:11px;color:var(--text-muted);">${formatDate(n.createdAt)}</span>
                            </div>
                            <div style="font-size:14px;color:var(--text-secondary);margin-top:4px;">${esc(n.body)}</div>
                        </div>
                    `;
                });
            }
            content.innerHTML = `
                <div class="page-title">🔔 الإشعارات</div>
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <button class="btn btn-small btn-gold" onclick="markAllRead('${currentUser.uid}')">تحديد الكل كمقروء</button>
                </div>
                ${items}
            `;
            updateNotifBadge();
        }

        window.markNotifRead = markNotifRead;
        window.markAllRead = markAllRead;

        // ============================================================
        // PROFILE
        // ============================================================
        async function renderProfile() {
            const uid = currentUser.uid;
            const [clientsSnap, leadsSnap, dealsSnap] = await Promise.all([
                getDocs(query(collection(db,'clients'), where('createdById','==',uid))),
                getDocs(query(collection(db,'leads'), where('createdById','==',uid))),
                getDocs(query(collection(db,'deals'), where('createdById','==',uid)))
            ]);
            let sales=0, won=0;
            dealsSnap.forEach(d=>{const x=d.data(); if(x.status==='won'){won++;sales+=Number(x.finalPrice||0)}});
            content.innerHTML = `
                <div class="page-title">👤 ملفي</div>
                <div class="card">
                    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
                        <div class="avatar" style="width:60px;height:60px;font-size:28px;">${esc((currentUserData?.name||'M')[0])}</div>
                        <div><div style="font-weight:800;font-size:20px;color:var(--text-primary);">${esc(currentUserData?.name||'غير محدد')}</div><div style="color:var(--text-muted);">${esc(currentUser.email)}</div><span class="badge badge-gold">${esc(currentRole)}</span></div>
                    </div>
                    <div class="profile-metrics">
                        <div class="profile-metric"><b>${clientsSnap.size}</b><span>عملاء</span></div>
                        <div class="profile-metric"><b>${leadsSnap.size}</b><span>Leads</span></div>
                        <div class="profile-metric"><b>${won}</b><span>صفقات</span></div>
                        <div class="profile-metric"><b>${money(sales)}</b><span>مبيعات</span></div>
                    </div>
                    <div class="field" style="margin-top:18px;"><label>الاسم</label><input id="profileName" value="${esc(currentUserData?.name||'')}"></div>
                    <button class="btn" onclick="updateProfile()">💾 تحديث</button>
                </div>`;
        }

        window.updateProfile = async function() {
            const name = $('profileName').value.trim();
            if (!name) { toast('الاسم مطلوب'); return; }
            await updateDoc(doc(db, 'users', currentUserData?._docId || currentUser.uid), { name });
            currentUserData.name = name;
            await logActivity('update','user',currentUserData._docId || currentUser.uid,{name});
            $('topName').textContent = name;
            toast('تم التحديث');
            renderProfile();
        };


        // ============================================================
        // V5 — QUICK ACTIONS / GLOBAL SEARCH / INSTALL / OFFLINE
        // ============================================================
        function openQuickActions(){
            showModal('⚡ إضافة سريعة', `<div class="quick-sheet">
                <button onclick="closeModal();openClientModal()">👤<br>عميل</button>
                <button onclick="closeModal();openLeadModal()">🔥<br>Lead</button>
                <button onclick="closeModal();openDealModal()">💰<br>صفقة</button>
                <button onclick="closeModal();openTaskModal()">📋<br>مهمة</button>
                <button onclick="closeModal();openProjectModal()">📦<br>مشروع</button>
                <button onclick="closeModal();navigate('reports')">📊<br>التقارير</button>
            </div>`);
        }
        window.openQuickActions=openQuickActions;

        function openGlobalSearch(){
            $('searchOverlay').classList.add('show');
            setTimeout(()=>$('globalSearchInput')?.focus(),50);
        }
        function closeGlobalSearch(){ $('searchOverlay').classList.remove('show'); }
        window.openGlobalSearch=openGlobalSearch; window.closeGlobalSearch=closeGlobalSearch;

        async function runGlobalSearch(term){
            const box=$('globalSearchResults');
            term=(term||'').trim().toLowerCase();
            if(!term){box.innerHTML='<div class="empty-state">اكتب كلمة للبحث</div>';return;}
            box.innerHTML='<div class="empty-state">⏳ بحث...</div>';
            const sources=[
                ['clients','👤 عميل',x=>`${x.name||''} ${x.phone||''} ${x.email||''} ${x.project||''}`, 'clients'],
                ['leads','🔥 Lead',x=>`${x.name||''} ${x.phone||''} ${x.source||''} ${x.createdByName||''}`, 'leads'],
                ['deals','💰 صفقة',x=>`${x.clientName||''} ${x.createdByName||x.memberName||''} ${x.finalPrice||''}`, 'deals'],
                ['projects','📦 مشروع',x=>`${x.name||''} ${x.category||''}`, 'projects'],
                ['users','👤 مندوب',x=>`${x.name||''} ${x.email||''} ${x.role||''}`, 'team']
            ];
            const found=[];
            for(const [col,label,toText,target] of sources){
                try{
                    const snap=await getDocs(collection(db,col));
                    snap.forEach(d=>{const x=d.data();if(toText(x).toLowerCase().includes(term))found.push({id:d.id,label,target,x});});
                }catch(e){console.warn(e)}
            }
            if(!found.length){box.innerHTML='<div class="empty-state">لا توجد نتائج</div>';return;}
            box.innerHTML=found.slice(0,40).map(r=>{
                const title=r.x.name||r.x.clientName||r.x.title||r.x.email||'بدون اسم';
                const sub=r.x.createdByName||r.x.memberName||r.x.phone||r.x.email||'';
                return `<div class="search-result" onclick="closeGlobalSearch();navigate('${r.target}')"><div class="result-type">${r.label}</div><strong>${esc(title)}</strong><div style="font-size:12px;color:var(--text-muted);margin-top:3px;">${esc(sub)}</div></div>`;
            }).join('');
        }
        window.runGlobalSearch=runGlobalSearch;

        let deferredInstallPrompt=null;
        window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;$('installBtn')?.classList.remove('hidden');});
        async function installApp(){
            if(!deferredInstallPrompt){toast('التثبيت غير متاح حاليًا');return;}
            deferredInstallPrompt.prompt();
            await deferredInstallPrompt.userChoice;
            deferredInstallPrompt=null;$('installBtn')?.classList.add('hidden');
        }
        window.installApp=installApp;

        function updateNetworkStatus(){
            const el=$('networkStatus'); if(!el)return;
            const online=navigator.onLine; el.textContent=online?'● متصل':'● بدون إنترنت'; el.classList.toggle('offline',!online);
            document.body.classList.toggle('is-offline',!online);
        }
        window.addEventListener('online',updateNetworkStatus); window.addEventListener('offline',updateNetworkStatus); updateNetworkStatus();

        // Local cache for quick offline viewing of the main lists. Firebase paths remain unchanged.
        async function cacheCollection(name){
            try{const snap=await getDocs(collection(db,name));const arr=snap.docs.map(d=>({id:d.id,data:d.data()}));localStorage.setItem('mina-cache-'+name,JSON.stringify(arr));return arr;}catch(e){
                try{return JSON.parse(localStorage.getItem('mina-cache-'+name)||'[]');}catch{return []}
            }
        }
        async function cachedCollection(name){
            if(navigator.onLine)return cacheCollection(name);
            try{return JSON.parse(localStorage.getItem('mina-cache-'+name)||'[]');}catch{return []}
        }

        // Printable invoice from the existing deals collection.
        async function printInvoice(id){
            try{
                const s=await getDoc(doc(db,'deals',id)); if(!s.exists())return;
                const x=s.data();
                const inv=$('invoicePrint');
                inv.innerHTML=`<h1>MINA KING</h1><p>فاتورة صفقة</p><hr><p><b>العميل:</b> ${esc(x.clientName||'-')}</p><p><b>المندوب:</b> ${esc(x.createdByName||x.memberName||'-')}</p><table><tr><th>البيان</th><th>القيمة</th></tr><tr><td>قيمة الصفقة</td><td>${money(x.finalPrice)}</td></tr><tr><td>نسبة العمولة</td><td>${x.commissionRate||0}%</td></tr><tr><td>قيمة العمولة</td><td>${money(x.commissionAmount||0)}</td></tr><tr><td>الحالة</td><td>${esc(x.status||'-')}</td></tr></table><div class="invoice-total">الإجمالي: ${money(x.finalPrice)}</div><p style="margin-top:30px;font-size:12px">تم إنشاء المستند من MINA KING CRM</p>`;
                await logActivity('create','deal',id,{invoicePrinted:true,clientName:x.clientName||''});
                window.print();
            }catch(e){toast('تعذر إنشاء الفاتورة: '+e.message,'⚠️')}
        }
        window.printInvoice=printInvoice;

        // Refresh cached core data when the app becomes active.
        window.addEventListener('visibilitychange',()=>{if(!document.hidden && currentUser && navigator.onLine){['users','clients','leads','deals','projects','tasks'].forEach(cacheCollection)}});

                // ============================================================
        // THEME
        // ============================================================
        window.toggleTheme = function() {
            document.body.classList.toggle('light');
            try {
                localStorage.setItem('mina-theme', document.body.classList.contains('light') ? 'light' : 'dark');
            } catch (e) {
                console.warn('Theme storage unavailable:', e);
            }
        };
        // الافتراضي dark، لكن لو كان مخزن light نشغله
        try {
            if (localStorage.getItem('mina-theme') === 'light') document.body.classList.add('light');
        } catch (e) {
            console.warn('Theme preference unavailable:', e);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW:',e)));
        }
        console.log('👑 MINA KING CRM V5 loaded successfully!');
    </script>
</body>
</html>
