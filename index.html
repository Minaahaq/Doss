<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>MINA PROJECTS • منصة احترافية</title>
  <!-- Chart.js للرسوم البيانية -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Firebase Modular SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    :root {
      --bg: #f2f6fe;
      --surface: #ffffff;
      --primary: #0b1d33;
      --secondary: #1d4ed8;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --text: #0f172a;
      --text-light: #475569;
      --border: #e2e8f0;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
      --radius: 28px;
      --glass: rgba(255, 255, 255, 0.6);
      --gradient: linear-gradient(135deg, #0b1d33 0%, #1d4ed8 100%);
      --badge-bg: #eef2ff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .dark {
      --bg: #060d1a;
      --surface: #111d33;
      --primary: #e2e8f0;
      --secondary: #60a5fa;
      --accent: #a78bfa;
      --text: #f1f5f9;
      --text-light: #94a3b8;
      --border: #1e2f50;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
      --glass: rgba(17, 29, 51, 0.7);
      --badge-bg: #1e2f50;
    }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-weight: 400;
    }
    #app {
      width: 100%;
      max-width: 1480px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px 32px;
      backdrop-filter: blur(2px);
      transition: var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    /* Login */
    #loginView {
      max-width: 440px;
      margin: 50px auto;
      padding: 48px 36px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
      margin-bottom: 32px;
      text-align: center;
    }
    .logo span { background: none; -webkit-text-fill-color: var(--accent); }
    .field { margin-bottom: 22px; }
    .field label { display: block; font-weight: 600; font-size: 13px; color: var(--text-light); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      transition: var(--transition);
    }
    .field input:focus, .field select:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }
    .btn {
      background: var(--gradient);
      border: none;
      color: white;
      font-weight: 700;
      padding: 16px 28px;
      border-radius: 40px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 24px rgba(29, 78, 216, 0.3);
      letter-spacing: 0.3px;
    }
    .btn:hover { transform: scale(1.02); opacity: 0.95; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: none;
      width: auto;
    }
    .btn-sm { padding: 8px 16px; font-size: 13px; width: auto; }
    .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .flex-between { justify-content: space-between; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
    .card {
      background: var(--bg);
      padding: 20px 22px;
      border-radius: 24px;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .card:hover { box-shadow: var(--shadow); }
    .card-glass {
      background: var(--glass);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .badge {
      background: var(--badge-bg);
      color: var(--secondary);
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .table-wrap { overflow-x: auto; border-radius: 24px; border: 1px solid var(--border); background: var(--surface); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: var(--bg); padding: 16px 14px; text-align: right; font-weight: 700; color: var(--text-light); border-bottom: 1px solid var(--border); }
    td { padding: 14px 14px; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--bg); }
    .sidebar { display: none; }
    @media (min-width: 820px) {
      .sidebar { display: flex; flex-direction: column; gap: 4px; min-width: 210px; padding: 8px 0; }
      .app-layout { display: flex; gap: 32px; }
      .main-area { flex: 1; min-width: 0; }
    }
    .nav-item {
      padding: 14px 18px;
      border-radius: 16px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 600;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg); color: var(--text); }
    .nav-item.active { background: var(--gradient); color: white; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.3); }
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--surface); color: var(--text); padding: 16px 32px;
      border-radius: 60px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border); z-index: 9999; display: none;
      font-weight: 600; backdrop-filter: blur(12px);
      min-width: 200px; text-align: center;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; z-index: 9998;
      padding: 20px;
    }
    .modal-card {
      background: var(--surface); max-width: 580px; width: 100%; border-radius: 32px;
      padding: 36px; box-shadow: var(--shadow); border: 1px solid var(--border);
      max-height: 90vh; overflow-y: auto;
    }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-2 { margin-top: 20px; }
    .mb-2 { margin-bottom: 20px; }
    .gap-1 { gap: 8px; }
    .w-full { width: 100%; }
    .stat-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .stat-label { font-size: 13px; color: var(--text-light); font-weight: 500; margin-top: 4px; }
    .mobile-nav { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 20px; }
    .mobile-nav button {
      background: var(--bg); border: none; padding: 10px 18px; border-radius: 40px;
      font-weight: 600; color: var(--text-light); cursor: pointer; font-size: 13px;
      transition: var(--transition);
    }
    .mobile-nav button.active { background: var(--gradient); color: white; }
    @media (min-width: 820px) { .mobile-nav { display: none; } }
    .avatar { width: 40px; height: 40px; border-radius: 40px; background: var(--accent); color: white; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .chart-container { height: 250px; position: relative; }
    .search-box { background: var(--bg); border: 1px solid var(--border); border-radius: 40px; padding: 10px 20px; display: flex; align-items: center; gap: 10px; }
    .search-box input { border: none; background: transparent; outline: none; color: var(--text); width: 100%; }
    .pill { background: var(--accent); color: white; border-radius: 40px; padding: 2px 14px; font-size: 12px; font-weight: 600; }
  </style>
</head>
<body>
<div id="app">
  <div id="toast" class="toast"></div>

  <!-- LOGIN -->
  <div id="loginView">
    <div class="logo">MINA <span>PROJECTS</span></div>
    <div class="field"><label>📧 البريد الإلكتروني</label><input type="email" id="loginEmail" placeholder="admin@mina.com" autocomplete="email"></div>
    <div class="field"><label>🔒 كلمة المرور</label><input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn" id="loginBtn">🚀 دخول إلى المنصة</button>
    <div class="text-center mt-2"><span style="color:var(--text-light);font-size:13px;">🔐 نظام آمن ومشفر بالكامل</span></div>
  </div>

  <!-- APP -->
  <div id="appMain" class="hidden">
    <div class="flex flex-between" style="padding:4px 0 16px;">
      <div class="logo" style="font-size:24px;">MINA <span>PROJECTS</span></div>
      <div class="flex gap-1">
        <button id="themeToggle" class="btn-outline btn btn-sm">🌓</button>
        <button id="logoutBtn" class="btn-outline btn btn-sm">🚪 خروج</button>
      </div>
    </div>
    <div class="app-layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="mobile-nav" id="mobileNav"></div>
      <div class="main-area" id="mainContent"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay"><div class="modal-card" id="modalContent"></div></div>

<script type="module">
  // ======================= FIREBASE =======================
  import { initializeApp } from "firebase/app";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "firebase/auth";
  import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, getDocs, query, where, orderBy, Timestamp, onSnapshot, addDoc, arrayUnion, serverTimestamp, writeBatch, limit } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyDsJXNa6EYenn2f5mfoNQVEDxHhCH-XGAo",
  authDomain: "alzahady-6e615.firebaseapp.com",
  databaseURL: "https://alzahady-6e615-default-rtdb.firebaseio.com",
  projectId: "alzahady-6e615",
  storageBucket: "alzahady-6e615.firebasestorage.app",
  messagingSenderId: "377804257010",
  appId: "1:377804257010:web:9516e9ecbbc8b22ab0c26b",
  measurementId: "G-4XPCD5L40F"
};
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // ======================= DOM REFS =======================
  const $ = (id) => document.getElementById(id);
  const loginView = $('loginView');
  const appMain = $('appMain');
  const mainContent = $('mainContent');
  const sidebar = $('sidebar');
  const mobileNav = $('mobileNav');
  const toastEl = $('toast');
  const modalOverlay = $('modalOverlay');
  const modalContent = $('modalContent');

  let currentUser = null, currentUserData = null, currentRole = null;
  let chartInstances = {};

  // ======================= HELPERS =======================
  function showToast(msg, duration = 3500) {
    toastEl.textContent = msg;
    toastEl.style.display = 'block';
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.style.display = 'none', duration);
  }

  function showModal(html) {
    modalContent.innerHTML = html;
    modalOverlay.style.display = 'flex';
  }
  window.closeModal = () => { modalOverlay.style.display = 'none'; };
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

  function renderView(html) { mainContent.innerHTML = html; }
  function setActiveNav(id) {
    document.querySelectorAll('.nav-item, .mobile-nav button').forEach(el => el.classList.remove('active'));
    document.querySelectorAll(`[data-view="${id}"]`).forEach(el => el.classList.add('active'));
  }

  // ======================= NAVIGATION =======================
  function navigate(view) {
    if (view === 'logout') { signOut(auth); return; }
    setActiveNav(view);
    if (currentRole === 'admin') renderAdminView(view);
    else renderTeamView(view);
  }
  window._navigate = navigate;

  function buildNav(links) {
    const html = links.map(l => `<div class="nav-item" data-view="${l.id}" onclick="window._navigate('${l.id}')">${l.icon} ${l.label}</div>`).join('');
    sidebar.innerHTML = html;
    mobileNav.innerHTML = links.map(l => `<button data-view="${l.id}" onclick="window._navigate('${l.id}')">${l.icon} ${l.label}</button>`).join('');
  }

  // ======================= AUTH =======================
  $('loginBtn').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();
    const pass = $('loginPassword').value;
    if (!email || !pass) return showToast('⚠️ يرجى ملء جميع الحقول');
    try {
      await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      if (e.code === 'auth/user-not-found') showToast('🚫 Access Denied. هذا البريد غير مسجل.');
      else showToast('❌ فشل الدخول: ' + e.message);
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const docSnap = await getDoc(doc(db, 'users', user.email));
      if (docSnap.exists()) {
        currentUserData = docSnap.data();
        currentRole = currentUserData.role || 'member';
        loginView.classList.add('hidden');
        appMain.classList.remove('hidden');

        if (currentRole === 'admin') {
          buildNav([
            { id: 'dashboard', icon: '📊', label: 'لوحة التحكم' },
            { id: 'members', icon: '👥', label: 'الأعضاء' },
            { id: 'clients', icon: '📋', label: 'العملاء' },
            { id: 'projects', icon: '📦', label: 'المشاريع' },
            { id: 'deals', icon: '💰', label: 'الصفقات' },
            { id: 'commissions', icon: '💵', label: 'العمولات' },
            { id: 'reports', icon: '📈', label: 'التقارير' },
            { id: 'activity', icon: '📜', label: 'سجل النشاط' },
          ]);
          navigate('dashboard');
        } else {
          buildNav([
            { id: 'dashboard', icon: '📊', label: 'لوحتي' },
            { id: 'myclients', icon: '📋', label: 'عملائي' },
            { id: 'mydeals', icon: '💰', label: 'صفقاتي' },
            { id: 'mycommissions', icon: '💵', label: 'عمولاتي' },
            { id: 'profile', icon: '👤', label: 'ملفي الشخصي' },
          ]);
          navigate('dashboard');
        }
      } else {
        showToast('⚠️ حساب غير مصرح به. تواصل مع المدير.');
        signOut(auth);
      }
    } else {
      loginView.classList.remove('hidden');
      appMain.classList.add('hidden');
      currentUser = null;
      currentUserData = null;
      currentRole = null;
    }
  });

  $('logoutBtn').addEventListener('click', () => signOut(auth));
  $('themeToggle').addEventListener('click', () => {
    document.body.classList.toggle('dark');
    localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  });
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

  // ======================= HELPERS (FIRESTORE) =======================
  async function logActivity(action, entityType, entityId, details = '') {
    if (!currentUser) return;
    await addDoc(collection(db, 'activityLogs'), {
      userId: currentUser.uid,
      userEmail: currentUser.email,
      userName: currentUserData?.name || 'Unknown',
      action,
      entityType,
      entityId,
      details,
      timestamp: serverTimestamp()
    });
  }

  async function sendNotification(userId, title, body, type = 'info', link = '') {
    await addDoc(collection(db, 'notifications'), {
      userId,
      title,
      body,
      type,
      link,
      read: false,
      createdAt: serverTimestamp()
    });
  }

  // ======================= RENDER: ADMIN =======================
  function renderAdminView(view) {
    if (view === 'dashboard') renderAdminDashboard();
    else if (view === 'members') renderMembers();
    else if (view === 'clients') renderClients();
    else if (view === 'projects') renderProjects();
    else if (view === 'deals') renderDeals();
    else if (view === 'commissions') renderCommissions();
    else if (view === 'reports') renderReports();
    else if (view === 'activity') renderActivityLog();
    else renderAdminDashboard();
  }

  // ----- Admin Dashboard -----
  async function renderAdminDashboard() {
    const membersSnap = await getDocs(collection(db, 'users'));
    const clientsSnap = await getDocs(collection(db, 'clients'));
    const dealsSnap = await getDocs(collection(db, 'deals'));
    const commissionsSnap = await getDocs(collection(db, 'commissions'));
    const totalMembers = membersSnap.size;
    const totalClients = clientsSnap.size;
    const totalDeals = dealsSnap.size;
    let totalComm = 0;
    commissionsSnap.forEach(d => { totalComm += d.data().amount || 0; });

    renderView(`
      <div class="grid-3">
        <div class="card"><div class="stat-value">${totalMembers}</div><div class="stat-label">👥 الأعضاء</div></div>
        <div class="card"><div class="stat-value">${totalClients}</div><div class="stat-label">📋 العملاء</div></div>
        <div class="card"><div class="stat-value">${totalDeals}</div><div class="stat-label">💰 الصفقات</div></div>
        <div class="card"><div class="stat-value">$${totalComm.toFixed(0)}</div><div class="stat-label">💵 إجمالي العمولات</div></div>
      </div>
      <div class="grid-2 mt-2">
        <div class="card"><div class="chart-container"><canvas id="chartSales"></canvas></div></div>
        <div class="card"><div class="chart-container"><canvas id="chartLeads"></canvas></div></div>
      </div>
      <div class="card mt-2"><h3>📌 النشاطات الأخيرة</h3><div id="recentActivities">جاري التحميل...</div></div>
    `);

    // charts
    setTimeout(() => {
      const ctx1 = document.getElementById('chartSales')?.getContext('2d');
      const ctx2 = document.getElementById('chartLeads')?.getContext('2d');
      if (ctx1) {
        if (chartInstances.sales) chartInstances.sales.destroy();
        chartInstances.sales = new Chart(ctx1, {
          type: 'bar',
          data: { labels: ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو'], datasets: [{ label: 'المبيعات', data: [1200, 1900, 3000, 5000, 4200], backgroundColor: '#7c3aed' }] },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
      if (ctx2) {
        if (chartInstances.leads) chartInstances.leads.destroy();
        chartInstances.leads = new Chart(ctx2, {
          type: 'doughnut',
          data: { labels: ['جديد', 'مؤهل', 'مفاوضة', 'مربوح'], datasets: [{ data: [30, 20, 15, 10], backgroundColor: ['#1d4ed8', '#7c3aed', '#f59e0b', '#10b981'] }] },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }, 100);

    // Recent activities
    const qAct = query(collection(db, 'activityLogs'), orderBy('timestamp', 'desc'), limit(5));
    const actSnap = await getDocs(qAct);
    let actHtml = '';
    actSnap.forEach(d => {
      const a = d.data();
      actHtml += `<div class="flex flex-between" style="border-bottom:1px solid var(--border);padding:8px 0;"><span>${a.action}</span><span style="color:var(--text-light);font-size:12px;">${a.userName}</span></div>`;
    });
    const el = document.getElementById('recentActivities');
    if (el) el.innerHTML = actHtml || 'لا توجد نشاطات';
  }

  // ----- Members -----
  async function renderMembers() {
    const snap = await getDocs(collection(db, 'users'));
    let rows = '';
    snap.forEach(d => {
      const u = d.data();
      rows += `<tr>
        <td><span class="avatar">${u.name?.[0]||'U'}</span> ${u.name||''}</td>
        <td>${u.email}</td>
        <td>${u.phone||'-'}</td>
        <td>${u.commissionRate||0}%</td>
        <td><span class="badge ${u.status==='active'?'badge-success':'badge-danger'}">${u.status||'inactive'}</span></td>
        <td class="flex" style="gap:4px;">
          <button class="btn-outline btn btn-sm" onclick="window._editMember('${u.email}')">✏️</button>
          <button class="btn-outline btn btn-sm" onclick="window._toggleMember('${u.email}','${u.status}')">${u.status==='active'?'⛔':'✅'}</button>
        </td>
      </tr>`;
    });
    renderView(`
      <div class="flex flex-between"><h2>👥 إدارة الأعضاء</h2><button class="btn" style="width:auto;padding:8px 24px;" onclick="window._addMember()">+ إضافة عضو</button></div>
      <div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>الهاتف</th><th>العمولة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table></div>
    `);
    window._addMember = () => {
      showModal(`
        <h3>➕ إضافة عضو جديد</h3>
        <div class="field"><label>الاسم الكامل</label><input id="mName" placeholder="أحمد محمد"/></div>
        <div class="field"><label>البريد الإلكتروني</label><input id="mEmail" placeholder="ahmed@mina.com"/></div>
        <div class="field"><label>رقم الهاتف</label><input id="mPhone" placeholder="+966 50 000 0000"/></div>

      `);

    window._saveDeal = async () => {
      const clientId = document.getElementById('dClient').value.trim();
      const memberId = document.getElementById('dMember').value.trim();

      const commRate = parseFloat(document.getElementById('dComm').value) || 0;

      await addDoc(collection(db, 'deals'), {
        clientId, memberId, finalPrice: price, commissionRate: commRate, commissionAmount: commAmount,
        status: 'pending', createdAt: serverTimestamp()
      });
      // Add commission record
      await addDoc(collection(db, 'commissions'), {
        memberId, amount: commAmount, status: 'pending', dealId: 'auto', createdAt: serverTimestamp()

  function renderTeamView(view) {
    if (view === 'dashboard') renderTeamDashboard();
    else if (view === 'myclients') renderMyClients();

    else if (view === 'mycommissions') renderMyCommissions();

  async function renderTeamDashboard() {
    const uid = currentUser?.uid;
    const qClients = query(collection(db, 'clients'), where('memberId', '==', uid));
    const qDeals = query(collection(db, 'deals'), where('memberId', '==', uid));
    const qComm = query(collection(db, 'commissions'), where('memberId', '==', uid));
    const [clientsSnap, dealsSnap, commSnap] = await Promise.all([getDocs(qClients), getDocs(qDeals), getDocs(qComm)]);
    let totalComm = 0, pendingComm = 0;
    commSnap.forEach(d => { const amt = d.data().amount || 0; totalComm += amt; if (d.data().status !== 'paid') pendingComm += amt; });

    renderView(`
      <h2>👋 مرحباً، ${currentUserData?.name || 'عضو'}!</h2>
      <div class="grid-4">
        <div class="card"><div class="stat-value">${clientsSnap.size}</div><div class="stat-label">📋 عملائي</div></div>
        <div class="card"><div class="stat-value">${dealsSnap.size}</div><div class="stat-label">💰 صفقاتي</div></div>
        <div class="card"><div class="stat-value">$${totalComm.toFixed(0)}</div><div class="stat-label">💵 إجمالي العمولات</div></div>
        <div class="card"><div class="stat-value">$${pendingComm.toFixed(0)}</div><div class="stat-label">⏳ معلقة</div></div>
      </div>
      <div class="card mt-2"><h3>🆔 كود الإحالة الخاص بك</h3><div style="font-size:24px;font-weight:800;color:var(--accent);">${currentUserData?.referralCode || 'MINA-0001'}</div></div>

  }
