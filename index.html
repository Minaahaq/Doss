<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة 2026 - بحث فوري</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tahoma', Arial, sans-serif; }
        body { background: #eef1f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #ffffff; max-width: 850px; width: 100%; padding: 30px; border-radius: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); border-top: 6px solid #1a237e; }
        h1 { color: #1a237e; text-align: center; font-size: 28px; }
        .sub { text-align: center; color: #555; margin-bottom: 25px; font-size: 15px; }
        .search-box { display: flex; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box input { flex: 1; padding: 14px 20px; border: 2px solid #dde1e8; border-radius: 40px; font-size: 18px; outline: none; transition: 0.3s; min-width: 200px; }
        .search-box input:focus { border-color: #1a237e; }
        .search-box button { padding: 14px 35px; background: #1a237e; color: #fff; border: none; border-radius: 40px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background: #0d1555; transform: scale(1.02); }
        .loader { display: none; text-align: center; padding: 20px; font-size: 16px; color: #1a237e; }
        .progress-bar { width: 100%; height: 6px; background: #e0e0e0; border-radius: 10px; margin: 10px 0; overflow: hidden; display: none; }
        .progress-bar .fill { height: 100%; width: 0%; background: #1a237e; transition: width 0.5s; }
        .error { color: #d32f2f; text-align: center; padding: 20px; font-size: 17px; display: none; background: #ffebee; border-radius: 12px; border-right: 4px solid #d32f2f; }
        .result-card { background: #f8faff; border-radius: 16px; padding: 25px; border-right: 6px solid #1a237e; display: none; margin-top: 10px; }
        .result-card h2 { color: #1a237e; font-size: 22px; margin-bottom: 20px; border-bottom: 2px dashed #ddd; padding-bottom: 12px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .info-item { background: #fff; padding: 12px 18px; border-radius: 12px; border: 1px solid #e8ecf5; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .info-item span { font-weight: bold; color: #1a237e; display: inline-block; width: 100px; }
        .grade-badge { display: inline-block; padding: 4px 22px; background: #ffb300; border-radius: 40px; font-weight: bold; color: #1a237e; }
        .subjects-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 15px; }
        .subjects-table th { background: #1a237e; color: #fff; padding: 10px 12px; text-align: right; }
        .subjects-table td { padding: 10px 12px; border-bottom: 1px solid #e4e7f0; }
        .subjects-table tr:nth-child(even) { background: #f4f6fc; }
        .source-note { margin-top: 20px; font-size: 12px; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 15px; }
        @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <h1>🎓 نتيجة الثانوية العامة 2026</h1>
    <p class="sub">أدخل رقم الجلوس – نظام ذكي يجرب 5 بروكسيات مع إعادة المحاولة</p>
    <div class="search-box">
        <input type="text" id="seatInput" placeholder="مثال: 1776500" value="1776500">
        <button onclick="fetchResult()">🔍 بحث فوري</button>
    </div>
    <div class="loader" id="loader">⏳ جاري البحث...</div>
    <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
    <div class="error" id="errorMsg"></div>
    <div class="result-card" id="resultCard"></div>
</div>

<script>
    const TARGET_BASE = 'https://than.nezakr.net/?system=s1&t=glos&k=';

    // 5 بروكسيات (بعضها جديد ومستقر)
    const PROXIES = [
        (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
        (url) => `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
        (url) => `https://api.cors.lol/?url=${encodeURIComponent(url)}`,
        (url) => `https://cors-anywhere.herokuapp.com/${url}`,
        (url) => `https://proxy.cors.sh/${url}`
    ];

    // دالة جلب مع تايمت وإعادة محاولة (لكل بروكسي 3 مرات)
    async function fetchWithRetry(proxyFn, targetUrl, retries = 3, timeout = 8000) {
        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);
                const proxyUrl = proxyFn(targetUrl);
                const response = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                if (text.length < 100) throw new Error('استجابة فارغة');
                return text;
            } catch (err) {
                // لو كانت آخر محاولة، نرمي الخطأ عشان نعرضه
                if (attempt === retries) throw err;
                // وإلا نستنى 200 ميلي ثانية قبل إعادة المحاولة
                await new Promise(r => setTimeout(r, 200));
            }
        }
    }

    async function fetchResult() {
        const seat = document.getElementById('seatInput').value.trim();
        const card = document.getElementById('resultCard');
        const errorDiv = document.getElementById('errorMsg');
        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        card.style.display = 'none';
        errorDiv.style.display = 'none';
        loader.style.display = 'block';
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';
        loader.textContent = '⏳ بدء البحث...';

        if (!seat || !/^\d+$/.test(seat)) {
            errorDiv.textContent = '⚠️ برجاء إدخال رقم جلوس صحيح (أرقام فقط)';
            errorDiv.style.display = 'block';
            loader.style.display = 'none';
            progressBar.style.display = 'none';
            return;
        }

        const targetUrl = TARGET_BASE + seat;
        let lastError = '';

        // جرب كل بروكسي مع إعادة المحاولة
        for (let i = 0; i < PROXIES.length; i++) {
            const progress = Math.round(((i) / PROXIES.length) * 100);
            progressFill.style.width = progress + '%';
            loader.textContent = `⏳ جاري التجربة ${i+1}/${PROXIES.length} (إعادة المحاولة 3 مرات)...`;

            try {
                const htmlText = await fetchWithRetry(PROXIES[i], targetUrl, 3, 8000);
                // نجاح – نحلل ونعرض
                const data = parseHTML(htmlText, seat, targetUrl);
                renderResult(data);
                loader.style.display = 'none';
                progressBar.style.display = 'none';
                return;
            } catch (err) {
                lastError = err.message;
                console.warn(`Proxy ${i+1} فشل بعد 3 محاولات:`, err);
                // نكمل للتالي
            }
        }

        // لو كل البروكسيات فشلت
        loader.style.display = 'none';
        progressBar.style.display = 'none';
        errorDiv.innerHTML = `❌ فشل الجلب من كل البروكسيات. آخر خطأ: ${lastError}<br>
                              <span style="font-size:14px;">تأكد من اتصال الإنترنت، أو حاول بعد دقيقة، أو استخدم VPN.</span>`;
        errorDiv.style.display = 'block';
    }

    // ===== تحليل HTML (نفسه لكن أقوى) =====
    function parseHTML(html, seat, sourceUrl) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const bodyText = doc.body.innerText;

        // اسم من title
        let name = 'غير معروف';
        const title = doc.querySelector('title');
        if (title) {
            const match = title.textContent.match(/نتيجة الطالب (.*?) في/);
            if (match) name = match[1].trim();
        }

        // حقول
        const extractField = (text, label) => {
            const regex = new RegExp(`${label}\\s*([^\\n\\d]+?)(?:\\d|\\n|$)`);
            const match = text.match(regex);
            return match ? match[1].trim() : 'غير محدد';
        };
        const section = extractField(bodyText, 'الشعبة');
        const eduType = extractField(bodyText, 'نوع التعليم');
        const grade = extractField(bodyText, 'التقدير');

        // مواد
        const subjects = {};
        const tables = doc.querySelectorAll('table');
        tables.forEach(table => {
            const rows = table.querySelectorAll('tr');
            rows.forEach(row => {
                const cols = row.querySelectorAll('td');
                if (cols.length >= 2) {
                    const subj = cols[0].textContent.trim();
                    const score = cols[1].textContent.trim();
                    if (subj.length > 1 && (score.includes('/') || /\d/.test(score)) &&
                        !['المادة', 'الدرجة', 'التقدير', 'المستوى'].includes(subj)) {
                        subjects[subj] = score;
                    }
                }
            });
        });

        if (Object.keys(subjects).length === 0) {
            const lines = bodyText.split('\n');
            for (let line of lines) {
                line = line.trim();
                const match = line.match(/^([\u0600-\u06FF\s]{2,}?)\s*(\d+\.?\d*\s*\/\s*\d+)/);
                if (match) {
                    const subj = match[1].trim();
                    const score = match[2].trim();
                    if (subj.length > 1 && !['الصف', 'الفصل', 'المجموع'].includes(subj)) {
                        subjects[subj] = score;
                    }
                }
            }
        }

        if (Object.keys(subjects).length === 0) {
            subjects['ملاحظة'] = 'تم جلب الصفحة لكن لم يتم العثور على جدول المواد. تأكد من رقم الجلوس.';
        }

        return { name, seat, section, education_type: eduType, grade, subjects, source: sourceUrl };
    }

    // ===== عرض النتيجة =====
    function renderResult(data) {
        const card = document.getElementById('resultCard');
        let subjectsHtml = '';
        for (const [name, score] of Object.entries(data.subjects)) {
            subjectsHtml += `<tr><td>${name}</td><td>${score}</td><td>غير متاح</td></tr>`;
        }

        card.innerHTML = `
            <h2>📌 نتيجة الطالب: ${data.name}</h2>
            <div class="info-grid">
                <div class="info-item"><span>رقم الجلوس:</span> ${data.seat}</div>
                <div class="info-item"><span>الشعبة:</span> ${data.section}</div>
                <div class="info-item"><span>نوع التعليم:</span> ${data.education_type}</div>
                <div class="info-item"><span>التقدير:</span> <span class="grade-badge">${data.grade}</span></div>
            </div>
            <h3>📘 تفاصيل الدرجات</h3>
            <table class="subjects-table">
                <thead><tr><th>المادة</th><th>الدرجة</th><th>المستوى</th></tr></thead>
                <tbody>${subjectsHtml}</tbody>
            </table>
            <div class="source-note">✅ تم الجلب عبر بروكسي من: <a href="${data.source}" target="_blank">${data.source}</a></div>
        `;
        card.style.display = 'block';
    }

    // Enter + بحث تلقائي
    document.getElementById('seatInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fetchResult();
    });
    window.onload = fetchResult;
</script>
</body>
</html>
