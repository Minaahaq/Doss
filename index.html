<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتيجة الثانوية العامة 2026 - بحث فوري</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f8f9fa; padding-top: 20px; }
        .container { max-width: 1000px; }
        .search-box { background: #fff; border-radius: 16px; padding: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .result-card { background: #fff; border-radius: 16px; padding: 25px; margin-top: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); display: none; }
        .student-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e9ecef; padding-bottom: 15px; flex-wrap: wrap; }
        .grade-badge { padding: 5px 20px; border-radius: 40px; color: #fff; font-weight: bold; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .info-item { background: #f8f9fa; padding: 12px; border-radius: 12px; border-right: 4px solid #0d6efd; }
        .subject-row { display: grid; grid-template-columns: 1.5fr 1fr 0.8fr 1.2fr; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 10px; margin-bottom: 6px; }
        .subject-row.header { background: #0d6efd; color: #fff; font-weight: bold; }
        .progress-bar-custom { height: 8px; background: #e9ecef; border-radius: 10px; overflow: hidden; }
        .progress-bar-custom span { display: block; height: 100%; border-radius: 10px; }
        .summary-box { background: #f8f9fa; padding: 15px; border-radius: 12px; text-align: center; flex: 1; min-width: 100px; }
        .loader { display: none; text-align: center; padding: 30px; }
        .error { display: none; }
        @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } .subject-row { grid-template-columns: 1fr 1fr; } .subject-row.header { display: none; } }
    </style>
</head>
<body>
<div class="container">
    <div class="search-box">
        <h4 class="text-center"><i class="fas fa-search text-primary"></i> بحث عن نتيجة الطالب</h4>
        <div class="row g-2 mt-3">
            <div class="col-md-8">
                <input type="text" id="seatInput" class="form-control" placeholder="أدخل رقم الجلوس" value="1776500">
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="fetchResult()"><i class="fas fa-arrow-left"></i> بحث</button>
            </div>
        </div>
        <div class="loader" id="loader"><i class="fas fa-spinner fa-spin fa-2x text-primary"></i><p>جاري جلب النتيجة من الخادم...</p></div>
        <div class="error alert alert-danger" id="errorMsg"></div>
    </div>
    <div class="result-card" id="resultCard"></div>
</div>

<script>
    // ===== دالة البحث (تطلب من API الخاص بنا) =====
    async function fetchResult() {
        const seat = document.getElementById('seatInput').value.trim();
        const card = document.getElementById('resultCard');
        const error = document.getElementById('errorMsg');
        const loader = document.getElementById('loader');

        card.style.display = 'none';
        error.style.display = 'none';
        loader.style.display = 'block';

        if (!seat || !/^\d+$/.test(seat)) {
            error.innerHTML = '⚠️ رقم الجلوس أرقام فقط';
            error.style.display = 'block';
            loader.style.display = 'none';
            return;
        }

        try {
            // استدعاء الـ API الخاص بنا على نفس الخادم (بدون CORS)
            const response = await fetch(`/api/proxy?seat=${seat}`);
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || `HTTP ${response.status}`);
            }
            const html = await response.text();
            const data = parseHTML(html, seat);
            renderResult(data);
            loader.style.display = 'none';
        } catch (e) {
            loader.style.display = 'none';
            error.innerHTML = `❌ فشل الجلب: ${e.message}<br><span class="small">تأكد من اتصال الإنترنت.</span>`;
            error.style.display = 'block';
            console.error(e);
        }
    }

    // ===== تحليل HTML واستخراج البيانات =====
    function parseHTML(html, seat) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const body = doc.body.innerText;

        let name = 'غير معروف';
        const title = doc.querySelector('title');
        if (title) {
            const m = title.textContent.match(/نتيجة الطالب (.*?) في/);
            if (m) name = m[1].trim();
        }

        const extract = (label) => {
            const regex = new RegExp(`${label}\\s*([^\\n\\d]+?)(?:\\d|\\n|$)`);
            const m = body.match(regex);
            return m ? m[1].trim() : 'غير محدد';
        };
        const section = extract('الشعبة');
        const eduType = extract('نوع التعليم');
        const rawGrade = extract('التقدير');

        const subjects = {};
        let totalEarned = 0, totalMax = 0;
        const lines = body.split('\n');
        for (let line of lines) {
            line = line.trim();
            const match = line.match(/^([\u0600-\u06FF\s]{2,}?)\s*(\d+\.?\d*)\s*\/\s*(\d+\.?\d*)/);
            if (match) {
                let subj = match[1].trim();
                const earned = parseFloat(match[2]);
                const max = parseFloat(match[3]);
                if (subj.length > 1 && !['المادة','الدرجة','التقدير','المستوى','الصف','الفصل','المجموع'].includes(subj) && !isNaN(earned) && !isNaN(max) && max > 0) {
                    subj = subj.replace(/[0-9]/g,'').trim();
                    if (subj.length > 1) {
                        const percent = (earned / max) * 100;
                        subjects[subj] = { earned, max, percent: Math.round(percent * 100) / 100 };
                        totalEarned += earned;
                        totalMax += max;
                    }
                }
            }
        }

        if (Object.keys(subjects).length === 0) {
            subjects['ملاحظة'] = { earned: 0, max: 0, percent: 0 };
        }

        const totalPercent = totalMax > 0 ? Math.round((totalEarned / totalMax) * 10000) / 100 : 0;
        const getGrade = (p) => {
            if (p >= 90) return { text: 'ممتاز', class: 'success' };
            if (p >= 80) return { text: 'جيد جداً', class: 'primary' };
            if (p >= 65) return { text: 'جيد', class: 'warning' };
            if (p >= 50) return { text: 'مقبول', class: 'orange' };
            return { text: 'ضعيف', class: 'danger' };
        };
        const finalGrade = getGrade(totalPercent);

        return {
            name, seat, section, eduType, rawGrade,
            totalEarned: Math.round(totalEarned * 100) / 100,
            totalMax: Math.round(totalMax * 100) / 100,
            totalPercent, finalGrade, subjects
        };
    }

    // ===== عرض النتيجة =====
    function renderResult(data) {
        const card = document.getElementById('resultCard');
        let subjectsHtml = '';
        for (const [name, info] of Object.entries(data.subjects)) {
            if (name === 'ملاحظة') {
                subjectsHtml += `<div class="subject-row"><span>⚠️ ${info.earned || 'لا توجد مواد'}</span></div>`;
                continue;
            }
            const p = info.percent;
            let color = '#e53935', level = 'ضعيف';
            if (p >= 90) { color = '#2e7d32'; level = 'ممتاز'; }
            else if (p >= 80) { color = '#1976d2'; level = 'جيد جداً'; }
            else if (p >= 65) { color = '#f9a825'; level = 'جيد'; }
            else if (p >= 50) { color = '#ef6c00'; level = 'مقبول'; }

            subjectsHtml += `
                <div class="subject-row">
                    <span><b>${name}</b></span>
                    <span>${info.earned} / ${info.max}</span>
                    <span><span class="badge" style="background:${color};">${level}</span></span>
                    <span>
                        <div class="progress-bar-custom"><span style="width:${p}%; background:${color};"></span></div>
                        <small>${p}%</small>
                    </span>
                </div>
            `;
        }

        const gradeMap = { 'ممتاز':'success', 'جيد جداً':'primary', 'جيد':'warning', 'مقبول':'orange', 'ضعيف':'danger' };
        const badgeClass = gradeMap[data.finalGrade.text] || 'secondary';

        card.innerHTML = `
            <div class="student-header">
                <h4><i class="fas fa-user-graduate"></i> ${data.name}</h4>
                <span class="grade-badge bg-${badgeClass}">${data.finalGrade.text} (${data.totalPercent}%)</span>
            </div>
            <div class="info-grid">
                <div class="info-item"><small>رقم الجلوس</small><br><b>${data.seat}</b></div>
                <div class="info-item"><small>الشعبة</small><br><b>${data.section}</b></div>
                <div class="info-item"><small>نوع التعليم</small><br><b>${data.eduType}</b></div>
                <div class="info-item"><small>تقدير الموقع</small><br><b>${data.rawGrade}</b></div>
            </div>
            <h6 class="mt-3">📘 درجات المواد</h6>
            <div class="subject-row header"><span>المادة</span><span>الدرجة</span><span>التقدير</span><span>النسبة</span></div>
            ${subjectsHtml}
            <div class="d-flex flex-wrap gap-3 mt-4">
                <div class="summary-box"><h5>${data.totalEarned}</h5><small>المجموع</small></div>
                <div class="summary-box"><h5>${data.totalMax}</h5><small>المجموع الكلي</small></div>
                <div class="summary-box"><h5>${data.totalPercent}%</h5><small>النسبة</small></div>
                <div class="summary-box"><h5>${data.finalGrade.text}</h5><small>التقدير</small></div>
            </div>
        `;
        card.style.display = 'block';
    }

    // بحث بالضغط على Enter
    document.getElementById('seatInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') fetchResult();
    });

    // بحث تلقائي عند تحميل الصفحة
    window.onload = fetchResult;
</script>
</body>
</html>
