<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MINA PROJECTS • CRM</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<script type="importmap">
{
  "imports": {
    "firebase/app":
      "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js",
    "firebase/auth":
      "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js",
    "firebase/firestore":
      "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js"
  }
}
</script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,"Segoe UI",Tahoma,sans-serif
}

:root{
  --bg:#f4f7fb;
  --surface:#fff;
  --surface2:#f8fafc;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --primary:#2563eb;
  --primary2:#1d4ed8;
  --purple:#7c3aed;
  --green:#10b981;
  --orange:#f59e0b;
  --red:#ef4444;
  --shadow:0 15px 45px rgba(15,23,42,.08);
  --radius:20px;
}

body.dark{
  --bg:#07111f;
  --surface:#0e1a2b;
  --surface2:#132238;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --border:#213451;
  --shadow:0 20px 50px rgba(0,0,0,.35);
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.25s;
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:440px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:30px;
  padding:42px;
  box-shadow:var(--shadow);
}

.logo{
  font-size:30px;
  font-weight:900;
  text-align:center;
  margin-bottom:8px;
  background:linear-gradient(135deg,#0f172a,#2563eb,#7c3aed);
  -webkit-background-clip:text;
  color:transparent;
}

.logo span{
  color:var(--purple)
}

.login-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:30px;
}

/* APP */

#app{
  min-height:100vh;
}

.layout{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:250px;
  background:var(--surface);
  border-left:1px solid var(--border);
  padding:20px 14px;
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  z-index:20;
}

.brand{
  font-size:22px;
  font-weight:900;
  padding:12px;
  margin-bottom:18px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:var(--muted);
  text-align:right;
  padding:13px 15px;
  border-radius:13px;
  font-weight:700;
  transition:.2s;
}

.nav button:hover{
  background:var(--surface2);
  color:var(--text);
}

.nav button.active{
  background:linear-gradient(135deg,var(--primary),var(--purple));
  color:white;
  box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.main{
  margin-right:250px;
  width:calc(100% - 250px);
  padding:22px;
}

.topbar{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:13px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:22px;
  box-shadow:var(--shadow);
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  border-radius:12px;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--purple));
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

/* COMPONENTS */

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.page-title h1{
  font-size:25px;
}

.page-title p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:0 5px 25px rgba(15,23,42,.03);
}

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,1fr)
}

.grid-3{
  grid-template-columns:repeat(3,1fr)
}

.grid-4{
  grid-template-columns:repeat(4,1fr)
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:18px;
}

.stat{
  position:relative;
  overflow:hidden;
}

.stat-icon{
  font-size:25px;
  margin-bottom:12px;
}

.stat-value{
  font-size:30px;
  font-weight:900;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.stat-line{
  height:4px;
  background:linear-gradient(90deg,var(--primary),var(--purple));
  border-radius:10px;
  margin-top:15px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:#fff;
  font-weight:800;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(1.05)
}

.btn.secondary{
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
}

.btn.green{
  background:var(--green)
}

.btn.red{
  background:var(--red)
}

.btn.orange{
  background:var(--orange)
}

.btn.small{
  padding:7px 11px;
  font-size:12px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea,
.search{
  width:100%;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px 14px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.search-wrap{
  flex:1;
  min-width:220px;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th{
  background:var(--surface2);
  color:var(--muted);
  font-size:12px;
  text-align:right;
  padding:14px;
  white-space:nowrap;
}

td{
  padding:13px 14px;
  border-top:1px solid var(--border);
  font-size:13px;
}

tr:hover td{
  background:var(--surface2);
}

.badge{
  display:inline-flex;
  padding:5px 10px;
  border-radius:30px;
  font-size:11px;
  font-weight:800;
}

.badge.blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge.green{
  background:#d1fae5;
  color:#047857;
}

.badge.orange{
  background:#fef3c7;
  color:#b45309;
}

.badge.red{
  background:#fee2e2;
  color:#b91c1c;
}

body.dark .badge.blue{
  background:#172d52;
  color:#93c5fd;
}

body.dark .badge.green{
  background:#103d31;
  color:#6ee7b7;
}

body.dark .badge.orange{
  background:#493614;
  color:#fcd34d;
}

body.dark .badge.red{
  background:#491d23;
  color:#fca5a5;
}

.actions{
  display:flex;
  gap:5px;
}

.chart-box{
  height:300px;
}

.empty{
  padding:40px;
  text-align:center;
  color:var(--muted);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.65);
  backdrop-filter:blur(5px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal.show{
  display:flex
}

.modal-card{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:var(--surface2);
  color:var(--text);
  width:35px;
  height:35px;
  border-radius:10px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  pointer-events:none;
  z-index:200;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:13px 22px;
  border-radius:40px;
  box-shadow:var(--shadow);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

.mobile-nav{
  display:none;
}

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    margin-right:0;
    width:100%;
    padding:12px;
  }

  .mobile-nav{
    display:flex;
    overflow:auto;
    gap:7px;
    margin-bottom:15px;
  }

  .mobile-nav button{
    white-space:nowrap;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    padding:9px 13px;
    border-radius:30px;
    font-size:12px;
    font-weight:700;
  }

  .mobile-nav button.active{
    background:var(--primary);
    color:#fff;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-2,
  .grid-3{
    grid-template-columns:1fr;
  }

}

@media(max-width:500px){

  .login-card{
    padding:28px 20px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .stat-value{
    font-size:23px;
  }

  .topbar{
    padding:10px;
  }

  .topbar-title{
    display:none;
  }

}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<section id="loginScreen">

  <div class="login-card">

    <div class="logo">
      MINA <span>PROJECTS</span>
    </div>

    <div class="login-sub">
      نظام إدارة الشركة و CRM
    </div>

    <div class="field">
      <label>البريد الإلكتروني</label>
      <input id="loginEmail"
             type="email"
             autocomplete="email"
             placeholder="admin@company.com">
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input id="loginPassword"
             type="password"
             autocomplete="current-password"
             placeholder="••••••••">
    </div>

    <button class="btn" style="width:100%" id="loginBtn">
      تسجيل الدخول
    </button>

    <div id="loginError"
         style="color:var(--red);font-size:13px;text-align:center;margin-top:15px">
    </div>

  </div>

</section>


<!-- =====================================================
     APPLICATION
===================================================== -->

<section id="app" class="hidden">

<div class="layout">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">
      MINA <span style="color:var(--purple)">PROJECTS</span>
    </div>

    <nav id="sidebarNav" class="nav"></nav>

    <div style="position:absolute;bottom:20px;right:14px;left:14px">

      <button
        class="btn secondary"
        style="width:100%"
        onclick="logout()">
        🚪 تسجيل الخروج
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <div class="topbar-title">
        <strong id="pageHeading">لوحة التحكم</strong>
      </div>

      <div class="top-actions">

        <button class="icon-btn"
                onclick="toggleTheme()">
          🌓
        </button>

        <button class="icon-btn"
                onclick="navigate('notifications')">
          🔔
        </button>

        <div class="user-box">
          <div class="avatar" id="topAvatar">M</div>
          <div>
            <strong id="topName">Admin</strong>
            <div style="font-size:11px;color:var(--muted)" id="topRole">
              Admin
            </div>
          </div>
        </div>

      </div>

    </div>


    <!-- MOBILE NAV -->

    <div id="mobileNav" class="mobile-nav"></div>


    <!-- CONTENT -->

    <div id="content"></div>

  </main>

</div>
</section>


<!-- =====================================================
     MODAL
===================================================== -->

<div id="modal" class="modal">

  <div class="modal-card">

    <div class="modal-head">
      <strong id="modalTitle">نافذة</strong>

      <button class="close"
              onclick="closeModal()">
        ✕
      </button>
    </div>

    <div id="modalBody"></div>

  </div>

</div>


<div id="toast" class="toast"></div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "firebase/app";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "firebase/auth";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  addDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  query,
  where,
  orderBy,
  limit,
  serverTimestamp
} from "firebase/firestore";


/*
 IMPORTANT:
 ضع بيانات Firebase الخاصة بمشروعك هنا.
*/

const firebaseConfig = {

  apiKey: "YOUR_FIREBASE_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  projectId:
    "YOUR_PROJECT_ID",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_MESSAGING_SENDER_ID",

  appId:
    "YOUR_FIREBASE_APP_ID"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);


/* =====================================================
   STATE
===================================================== */

let currentUser = null;
let currentUserData = null;
let currentRole = "member";

let activeView = "dashboard";

let charts = {};

const content =
  document.getElementById("content");


/* =====================================================
   HELPERS
===================================================== */

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function money(value){

  return Number(value || 0)
    .toLocaleString("en-US",{
      style:"currency",
      currency:"USD",
      maximumFractionDigits:0
    });

}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => el.classList.remove("show"),
      3000
    );

}


function showModal(title, html){

  $("modalTitle").textContent = title;

  $("modalBody").innerHTML = html;

  $("modal").classList.add("show");

}


function closeModal(){

  $("modal").classList.remove("show");

}


window.closeModal = closeModal;


$("modal").addEventListener("click",e=>{

  if(e.target.id === "modal"){
    closeModal();
  }

});


function statusBadge(status){

  const map = {

    new:["جديد","blue"],
    contacted:["تم التواصل","orange"],
    qualified:["مؤهل","blue"],
    negotiation:["تفاوض","orange"],
    won:["مربوحة","green"],
    lost:["خاسرة","red"],
    pending:["معلقة","orange"],
    approved:["معتمدة","blue"],
    paid:["مدفوعة","green"],
    active:["نشط","green"],
    inactive:["متوقف","red"],
    todo:["جديدة","blue"],
    doing:["قيد التنفيذ","orange"],
    done:["مكتملة","green"]

  };

  const x =
    map[status] ||
    [status || "غير محدد","blue"];

  return `
    <span class="badge ${x[1]}">
      ${esc(x[0])}
    </span>
  `;

}


/* =====================================================
   NAVIGATION
===================================================== */

const adminNav = [

  ["dashboard","📊","الرئيسية"],
  ["leads","🔥","Leads"],
  ["clients","👥","العملاء"],
  ["projects","📦","المشاريع"],
  ["deals","💰","الصفقات"],
  ["commissions","💵","العمولات"],
  ["team","👨‍💼","الفريق"],
  ["tasks","📋","المهام"],
  ["reports","📈","التقارير"],
  ["notifications","🔔","الإشعارات"],
  ["settings","⚙️","الإعدادات"]

];


const memberNav = [

  ["dashboard","📊","لوحتي"],
  ["leads","🔥","Leads"],
  ["clients","👥","عملائي"],
  ["projects","📦","المشاريع"],
  ["deals","💰","صفقاتي"],
  ["commissions","💵","عمولاتي"],
  ["tasks","📋","مهامي"],
  ["notifications","🔔","الإشعارات"],
  ["profile","👤","ملفي"]

];


function getNav(){

  return currentRole === "admin" ||
         currentRole === "manager"
    ? adminNav
    : memberNav;

}


function buildNavigation(){

  const nav = getNav();

  $("sidebarNav").innerHTML =
    nav.map(item=>`

      <button
        class="${item[0] === activeView ? "active":""}"
        onclick="navigate('${item[0]}')">

        ${item[1]} ${item[2]}

      </button>

    `).join("");


  $("mobileNav").innerHTML =
    nav.map(item=>`

      <button
        class="${item[0] === activeView ? "active":""}"
        onclick="navigate('${item[0]}')">

        ${item[1]} ${item[2]}

      </button>

    `).join("");

}


window.navigate = navigate;


async function navigate(view){

  activeView = view;

  buildNavigation();

  const titles = {

    dashboard:"لوحة التحكم",
    leads:"إدارة Leads",
    clients:"العملاء",
    projects:"المشاريع",
    deals:"الصفقات",
    commissions:"العمولات",
    team:"فريق العمل",
    tasks:"المهام",
    reports:"التقارير",
    notifications:"الإشعارات",
    settings:"الإعدادات",
    profile:"الملف الشخصي"

  };

  $("pageHeading").textContent =
    titles[view] || "MINA PROJECTS";


  content.innerHTML = `
    <div class="empty">
      جاري التحميل...
    </div>
  `;


  try{

    switch(view){

      case "dashboard":
        await renderDashboard();
        break;

      case "leads":
        await renderLeads();
        break;

      case "clients":
        await renderClients();
        break;

      case "projects":
        await renderProjects();
        break;

      case "deals":
        await renderDeals();
        break;

      case "commissions":
        await renderCommissions();
        break;

      case "team":
        await renderTeam();
        break;

      case "tasks":
        await renderTasks();
        break;

      case "reports":
        await renderReports();
        break;

      case "notifications":
        await renderNotifications();
        break;

      case "settings":
        await renderSettings();
        break;

      case "profile":
        await renderProfile();
        break;

    }

  }catch(error){

    console.error(error);

    content.innerHTML = `
      <div class="card">
        ❌ حدث خطأ أثناء تحميل القسم.
        <br><br>
        <small>${esc(error.message)}</small>
      </div>
    `;

  }

}


/* =====================================================
   AUTH
===================================================== */

$("loginBtn").addEventListener("click",login);


$("loginPassword").addEventListener("keydown",e=>{

  if(e.key === "Enter"){
    login();
  }

});


async function login(){

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;


  $("loginError").textContent = "";


  if(!email || !password){

    $("loginError").textContent =
      "اكتب البريد وكلمة المرور.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    $("loginError").textContent =
      "بيانات الدخول غير صحيحة أو الحساب غير متاح.";

  }

}


window.logout = async function(){

  await signOut(auth);

};


onAuthStateChanged(auth,async user=>{

  if(!user){

    $("loginScreen").classList.remove("hidden");

    $("app").classList.add("hidden");

    currentUser = null;

    return;

  }


  currentUser = user;


  /*
   IMPORTANT:
   role should ideally come from Firebase Custom Claims.
   Firestore role is used here for UI rendering.
   Security Rules MUST enforce the real permission.
  */

  const userSnap =
    await getDoc(
      doc(db,"users",user.uid)
    );


  if(!userSnap.exists()){

    toast("هذا الحساب غير مضاف للشركة.");

    await signOut(auth);

    return;

  }


  currentUserData =
    userSnap.data();

  currentRole =
    currentUserData.role || "member";


  $("topName").textContent =
    currentUserData.name ||
    user.displayName ||
    user.email;


  $("topRole").textContent =
    currentRole.toUpperCase();


  $("topAvatar").textContent =
    (
      currentUserData.name ||
      user.email ||
      "M"
    )[0].toUpperCase();


  $("loginScreen").classList.add("hidden");

  $("app").classList.remove("hidden");


  buildNavigation();

  await navigate("dashboard");

});

window.toggleTheme = function(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "mina-theme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

};


if(localStorage.getItem("mina-theme")==="dark"){

  document.body.classList.add("dark");

}

   ACTIVITY
===================================================== */

async function logActivity(
  action,
  entityType,
  entityId="",
  details=""
){

  if(!currentUser) return;

  /*
   Security Rules should prevent client
   manipulation of audit logs.
   In production, move this operation
   to Cloud Functions.
  */

  try{

    await addDoc(
      collection(db,"activityLogs"),
      {

        userId:currentUser.uid,

        userEmail:currentUser.email,

        userName:
          currentUserData?.name ||
          currentUser.email,

        action,

        entityType,

        entityId,

        details,

        createdAt:
          serverTimestamp()

      }
    );

  }catch(e){

    console.warn("Activity log:",e);

  }

}

function destroyChart(name){

window.filterLeadStatus = function(value){

  document
    .querySelectorAll("#leadTable tbody tr")
    .forEach(row=>{

      if(!value){

        row.style.display="";

        return;

      }

      row.style.display =
        row.textContent.includes(
          statusText(value)
        )
        ? ""
        : "none";

    });

};


function statusText(s){

  const x = {
    new:"جديد",
    contacted:"تم التواصل",
    qualified:"مؤهل",
    negotiation:"تفاوض",
    won:"مربوحة",
    lost:"خاسرة"
  };

  return x[s] || s;

}

window.saveLead = async function(id){

  const data = {

    name:$("leadName").value.trim(),

    phone:$("leadPhone").value.trim(),

    email:$("leadEmail").value.trim(),

    source:$("leadSource").value,

    status:$("leadStatus").value,

    campaign:$("leadCampaign").value.trim(),

    notes:$("leadNotes").value.trim()

  };


  if(!data.phone){

    toast("رقم الهاتف مطلوب");

    return;

  }


  try{

    if(id){

      await updateDoc(
        doc(db,"leads",id),
        data
      );

      await logActivity(
        "تعديل Lead",
        "lead",
        id
      );

      toast("تم تحديث الـ Lead");

    }else{

      data.assignedTo =
        currentUser.uid;

      data.assignedName =
        currentUserData?.name || "";

      data.createdAt =
        serverTimestamp();

      await addDoc(
        collection(db,"leads"),
        data
      );

      await logActivity(
        "إضافة Lead",
        "lead",
        data.phone
      );

      toast("تمت إضافة الـ Lead");

    }


    closeModal();

    renderLeads();

  }catch(e){

    toast("حدث خطأ: "+e.message);

  }

};


window.editLead = async function(id){

  const snap =
    await getDoc(
      doc(db,"leads",id)
    );

  if(!snap.exists()) return;

  openLeadModal(
    id,
    snap.data()
  );

};


window.deleteLead = async function(id){

  if(!confirm("هل تريد حذف هذا الـ Lead؟"))
    return;

  await deleteDoc(
    doc(db,"leads",id)
  );

  await logActivity(
    "حذف Lead",
    "lead",
    id
  );

  toast("تم الحذف");

  renderLeads();

};

window.saveMember = async function(id){

  const data={

    name:
      $("memberName").value.trim(),

    email:
      $("memberEmail").value.trim(),

    role:
      $("memberRole").value,

    commissionRate:
      Number($("memberCommission").value||0),

    status:
      $("memberStatus").value

  };


  if(!data.name || !data.email){

    toast("الاسم والبريد مطلوبان");

    return;

  }


  try{

    /*
      Security:
      Firestore Rules يجب أن تمنع member
      من تعديل role/status.
    */

    if(id){

      await updateDoc(
        doc(db,"users",id),
        {
          name:data.name,
          commissionRate:data.commissionRate,
          status:data.status
        }
      );

      toast("تم تحديث العضو");

    }else{

      /*
       لا ننشئ Firebase Auth user من المتصفح.
       هذه البيانات تصلح بعد تشغيل Cloud Function.
      */

      toast(
        "لإنشاء حساب دخول جديد استخدم Cloud Function."
      );

      return;

    }


    closeModal();

    renderTeam();

  }catch(e){

===================================================== */

async function renderReports(){

  const [
    deals,
    leads,
    clients
  ] = await Promise.all([

    getDocs(collection(db,"deals")),

    getDocs(collection(db,"leads")),

    getDocs(collection(db,"clients"))

  ]);


  let totalSales=0;
  let won=0;
  let lost=0;


  deals.forEach(d=>{

    const x=d.data();

    if(x.status==="won"){

      won++;

      totalSales +=
        Number(x.finalPrice||0);

    }

    if(x.status==="lost")
      lost++;

  });


  const conversion =
    leads.size
      ? ((won/leads.size)*100).toFixed(1)
      : 0;


  content.innerHTML = `

    <div class="page-title">

      <div>
        <h1>📈 التقارير</h1>
        <p>مؤشرات أداء الشركة</p>
      </div>

    </div>


    <div class="stats">

      <div class="card stat">
        <div class="stat-value">
          ${leads.size}
        </div>
        <div class="stat-label">
          إجمالي Leads
        </div>
      </div>

      <div class="card stat">
        <div class="stat-value">
          ${clients.size}
        </div>
        <div class="stat-label">
          العملاء
        </div>
      </div>

      <div class="card stat">
        <div class="stat-value">
          ${won}
        </div>
        <div class="stat-label">
          صفقات مربوحة
        </div>
      </div>

      <div class="card stat">
        <div class="stat-value">
          ${conversion}%
        </div>
        <div class="stat-label">
          معدل التحويل
        </div>
      </div>

    </div>


    <div class="grid grid-2">

      <div class="card">

        <h3 style="margin-bottom:15px">
          💰 المبيعات
        </h3>

        <div class="stat-value">
          ${money(totalSales)}
        </div>

        <p style="color:var(--muted);margin-top:8px">
          إجمالي الصفقات المربوحة
        </p>

      </div>


      <div class="card">

        <h3 style="margin-bottom:15px">
          📊 حالة الصفقات
        </h3>

        <div class="chart-box">
          <canvas id="reportChart"></canvas>
        </div>

      </div>

    </div>

  `;


  setTimeout(()=>{

    destroyChart("report");

    const ctx =
      $("reportChart")?.getContext("2d");

    if(ctx){

      charts.report =
        new Chart(ctx,{

          type:"doughnut",

          data:{

            labels:[
              "مربوحة",
              "خاسرة",
              "معلقة"
            ],

            datasets:[{

              data:[
                won,
                lost,
                Math.max(
                  deals.size-won-lost,
                  0
                )
              ]

            }]

          },

          options:{
            responsive:true,
            maintainAspectRatio:false
          }

        });

    }

  },50);

}

        <p style="color:var(--muted)">
          ${esc(x.body || "")}
        </p>

        <small style="color:var(--muted)">
          ${formatDate(x.createdAt)}
        </small>

      </div>

    `;

  });


  content.innerHTML = `

    <div class="page-title">

      <div>
        <h1>🔔 الإشعارات</h1>
        <p>آخر التنبيهات الخاصة بك</p>

    </div>

    ${
      rows ||
      `<div class="card empty">
        لا توجد إشعارات حالياً.
      </div>`
    }

  `;

}

/* =====================================================
   GENERAL TABLE SEARCH
===================================================== */

window.filterTable =
function(tableId,value){

  const q =
    value.toLowerCase();


  document
    .querySelectorAll(
      `#${tableId} tbody tr`
    )
    .forEach(row=>{

      row.style.display =
        row.textContent
          .toLowerCase()
          .includes(q)
          ? ""
          : "none";

    });

};


/* =====================================================
   DATE
===================================================== */

function formatDate(value){

  if(!value)
    return "-";


  try{

    const date =
      value.toDate
        ? value.toDate()
        : new Date(value);


    return date.toLocaleDateString(
      "ar-EG"
    );

  }catch{

    return "-";

  }

}
